name: WNG Step 8 Human Form Uniform Import

on:
  push:
    paths:
      - 'Tools/ApparelForge/human-form-uniform-runtime.zip'

permissions:
  contents: write

concurrency:
  group: wng-step8-human-form-uniform-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install finished Human Form Uniform art
        shell: bash
        run: |
          set -euo pipefail
          tmp=/tmp/human-form-uniform
          rm -rf "$tmp"
          mkdir -p "$tmp"
          unzip -q Tools/ApparelForge/human-form-uniform-runtime.zip -d "$tmp"
          dest="Textures/Things/Pawn/Humanlike/Apparel/Precursor"
          mkdir -p "$dest"
          install -m 0644 "$tmp"/WNG_HumanFormUniform*.png "$dest"/
          python - <<'PY'
          from pathlib import Path
          import struct
          root=Path("Textures/Things/Pawn/Humanlike/Apparel/Precursor")
          bodies=["Male","Female","Thin","Fat","Hulk"]
          dirs=["north","south","east","west"]
          expected=[root/"WNG_HumanFormUniform.png"]
          for b in bodies:
              expected.append(root/f"WNG_HumanFormUniform_{b}.png")
              expected.extend(root/f"WNG_HumanFormUniform_{b}_{d}.png" for d in dirs)
          assert len(expected)==26
          for p in expected:
              assert p.exists(), p
              data=p.read_bytes()
              assert data[:8]==b"\x89PNG\r\n\x1a\n", p
              w,h=struct.unpack(">II",data[16:24])
              assert (w,h)==(192,192), (p,w,h)
          print("validated",len(expected),"Human Form Uniform textures")
          PY
          git add -f Textures/Things/Pawn/Humanlike/Apparel/Precursor/WNG_HumanFormUniform*.png

      - name: Commit Step 8 directly to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f Tools/ApparelForge/human-form-uniform-runtime.zip
          git rm -f .github/workflows/wng-step8-human-form-uniform-import.yml
          git commit -m "Finish Step 8 Human Form Uniform art and RimWorld fit [skip ci]"
          git push
