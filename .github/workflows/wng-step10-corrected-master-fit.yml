name: WNG Step 10 Corrected Master Fit

on:
  push:
    paths:
      - 'Tools/ApparelForge/step10-corrected-master-fit.trigger'

permissions:
  contents: write

concurrency:
  group: wng-step10-corrected-master-fit
  cancel-in-progress: false

jobs:
  fit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fit corrected professional master
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow numpy
          python Tools/ApparelForge/source_art/fit_step10_human_form_combat_armour_master.py
          python - <<'PY'
          from pathlib import Path
          import struct
          root=Path("Textures/Things/Pawn/Humanlike/Apparel/Precursor")
          bodies=["Male","Female","Thin","Fat","Hulk"]
          dirs=["north","south","east","west"]
          expected=[root/"WNG_HumanFormCombatArmor.png"]
          for b in bodies:
              expected.append(root/f"WNG_HumanFormCombatArmor_{b}.png")
              expected.extend(root/f"WNG_HumanFormCombatArmor_{b}_{d}.png" for d in dirs)
          assert len(expected)==26
          for p in expected:
              data=p.read_bytes()
              assert data[:8]==b"\x89PNG\r\n\x1a\n", p
              w,h=struct.unpack(">II",data[16:24])
              assert (w,h)==(192,192), (p,w,h)
          print("validated",len(expected),"corrected Step 10 textures")
          PY
          git add -f Textures/Things/Pawn/Humanlike/Apparel/Precursor/WNG_HumanFormCombatArmor*.png

      - name: Commit corrected Step 10
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f Tools/ApparelForge/step10-corrected-master-fit.trigger
          git rm -f .github/workflows/wng-step10-corrected-master-fit.yml
          git commit -m "Replace Step 10 with professional Human Form Combat Armour master [skip ci]"
          git pull --rebase origin main
          git push origin main
