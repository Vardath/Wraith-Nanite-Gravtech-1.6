name: D158 Worldgen Audit

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  worldgen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit world and map generation contracts
        run: python3 .github/artqa/worldgen.py
