name: WNG Generate Grav Field Support Art

on:
  push:
    branches: [main]
    paths:
      - ".github/artgen/generate_grav_field_support.py"
      - ".github/workflows/wng-generate-grav-field-support.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m pip install --disable-pip-version-check pillow
      - run: python .github/artgen/generate_grav_field_support.py
      - name: Commit generated art
        shell: bash
        run: |
          git add Textures/Things/Building/Goauld/Gravship/WNG_GoauldGravFieldProjector.png Textures/Things/Building/Precursor/Gravship/WNG_AsuranGravFieldExtender.png
          if git diff --cached --quiet; then
            echo "No art change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Regenerate grav-field support art from clean source"
          git push
