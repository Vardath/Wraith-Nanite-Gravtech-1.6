  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  removal-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit optional mod removal safety
        run: python3 .github/artqa/removal_safety.py
