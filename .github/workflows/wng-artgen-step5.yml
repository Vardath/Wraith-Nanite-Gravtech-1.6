name: WNG ArtGen Step 5

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wng-artgen-step5.yml'
      - 'Tools/ArtGen/wng_apparel_generator.py'
      - 'Tools/ArtGen/profiles/human_form_uniform.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ArtGen dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy scipy cairosvg beautifulsoup4 requests
      - name: Validate ArtGen profiles
        run: |
          python -m py_compile Tools/ArtGen/wng_apparel_generator.py
          python Tools/ArtGen/wng_apparel_generator.py --validate-profiles-only
      - name: Fetch vanilla RimWorld geometry
        run: |
          git clone --depth 1 https://github.com/SamuelBucher/Madness-Pawns.git /tmp/madness
          git clone --depth 1 https://github.com/DaLongZhuaZi/RWonVela.git /tmp/rwvela
      - name: Render Step 5 with Costume Blueprint v2
        run: |
          python Tools/ArtGen/wng_apparel_generator.py human_form_uniform \
            --vanilla-dir "/tmp/madness/Raw sprites/apparel" \
            --body-dir "/tmp/rwvela/src/common/human/bodies" \
            --workdir /tmp/wng-artgen-step5 \
            --preview /tmp/wng-artgen-step5/contact-sheet.png
      - name: Validate live apparel contract
        run: python .github/artqa/apparel_art_audit.py
      - name: Commit Step 5 live PNGs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Textures/Things/Pawn/Humanlike/Apparel/Precursor/WNG_HumanFormUniform"*.png
          git diff --cached --quiet && exit 0
          git commit -m "Render Step 5 Human Form Uniform with ArtGen raster brush [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
