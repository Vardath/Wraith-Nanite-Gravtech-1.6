name: WNG Hunter Coat Reference-Driven Rebuild
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wng-huntercoat-reference-driven.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch vanilla Duster reference family
        run: git clone --depth 1 https://github.com/emipa606/Norbals.git /tmp/norbals
      - name: Install renderer
        run: python -m pip install --disable-pip-version-check pillow numpy scipy
      - name: Rebuild Hunter Coat from approved visual language
        run: python .github/artgen/huntercoat_material_transfer.py
      - name: Validate apparel implementation
        run: python .github/artqa/apparel_art_audit.py
      - name: Commit Hunter Coat and QA preview
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Textures/Things/Pawn/Humanlike/Apparel/Wraith/WNG_HunterCoat*.png .github/huntercoat_preview.png
          git commit -m "Rebuild Hunter Coat from Stargate and WNG reference art [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
