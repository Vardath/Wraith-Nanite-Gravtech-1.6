name: Temporary Dart incident build
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build WNG
        run: dotnet build Source/WNG/WNG.csproj -c Release
      - name: Parse XML
        run: python - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          for p in pathlib.Path('Defs').rglob('*.xml'):
              ET.parse(p)
          print('XML parse OK')
          PY
