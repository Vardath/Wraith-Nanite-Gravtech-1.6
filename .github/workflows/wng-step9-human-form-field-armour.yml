name: WNG Step 9 Human Form Field Armour

on:
  push:
    paths:
      - 'Tools/ApparelForge/step9-human-form-field-armour.trigger'

permissions:
  contents: write

concurrency:
  group: wng-step9-human-form-field-armour
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build correct Asuran/Human Form Field Armour
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow numpy
          python Tools/ApparelForge/source_art/generate_human_form_field_armour.py
          python - <<'PY'
          from pathlib import Path
          import struct
          root=Path("Textures/Things/Pawn/Humanlike/Apparel/Precursor")
          bodies=["Male","Female","Thin","Fat","Hulk"]
          dirs=["north","south","east","west"]
          expected=[root/"WNG_HumanFormFieldArmor.png"]
          for b in bodies:
              expected.append(root/f"WNG_HumanFormFieldArmor_{b}.png")
              expected.extend(root/f"WNG_HumanFormFieldArmor_{b}_{d}.png" for d in dirs)
          assert len(expected)==26
          for p in expected:
              assert p.exists(), p
              data=p.read_bytes()
              assert data[:8]==b"\x89PNG\r\n\x1a\n", p
              w,h=struct.unpack(">II",data[16:24])
              assert (w,h)==(192,192), (p,w,h)
          print("validated",len(expected),"Human Form Field Armour textures")
          PY
          git add -f Textures/Things/Pawn/Humanlike/Apparel/Precursor/WNG_HumanFormFieldArmor*.png

      - name: Commit Step 9 directly to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f Tools/ApparelForge/step9-human-form-field-armour.trigger
          git rm -f .github/workflows/wng-step9-human-form-field-armour.yml
          git commit -m "Finish Step 9 Human Form Field Armour art and RimWorld fit [skip ci]"
          git push
