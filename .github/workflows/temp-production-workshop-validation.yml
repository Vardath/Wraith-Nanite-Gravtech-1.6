name: Temporary WNG production workshop validation

on:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build WNG
        run: dotnet build Source/WNG/WNG.csproj -c Release
      - name: Parse all XML
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          files = list(pathlib.Path('Defs').rglob('*.xml')) + list(pathlib.Path('Patches').rglob('*.xml'))
          for p in files:
              ET.parse(p)
          print(f'Parsed {len(files)} XML files')
          PY
      - name: Check production invariants
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET

          def root(path):
              return ET.parse(path).getroot()

          # Smelter is Replicator-block disposal only in WNG-owned recipes.
          smelt = root('Defs/RecipeDefs/Recipes_ReplicatorBlockDisposal.xml')
          recipe = smelt.find("RecipeDef[defName='WNG_SmeltReplicatorBlocks']")
          assert recipe is not None
          users = [x.text for x in recipe.findall('./recipeUsers/li')]
          assert users == ['ElectricSmelter'], users

          # Asuran workshop is hidden from Architect by default and owns nanite-sludge production.
          aw = root('Defs/ThingDefs/Buildings_AsuranWorkshop.xml').find("ThingDef[defName='WNG_AsuranWorkshop']")
          assert aw is not None
          assert aw.find('designationCategory') is None
          assert any(x.text == 'WNG_SynthesizeNaniteSludge' for x in aw.findall('./recipes/li'))

          # Asuran Nanite Reserve gene grants the workshop assembly ability.
          gene = root('Defs/GeneDefs/Genes_AsuranFabrication.xml').find("GeneDef[defName='WNG_NaniteReserve']")
          assert gene is not None
          assert any(x.text == 'WNG_AssembleAsuranWorkshop' for x in gene.findall('./abilities/li'))

          # Technical Wraith engine seed is stripped from normal Architect exposure by patch.
          patch_text = pathlib.Path('Patches/WNG_BootstrapArchitectVisibility.xml').read_text()
          assert 'WNG_WraithGravEngineSeed' in patch_text and 'designationCategory' in patch_text

          # Obsolete Gravcore must not return as a DefName/product/acquisition path.
          bad = []
          for p in list(pathlib.Path('Defs').rglob('*.xml')) + list(pathlib.Path('Source/WNG').rglob('*.cs')):
              txt = p.read_text(errors='ignore')
              for token in ('<defName>WNG_Gravcore', '<defName>WNG_WraithGravcore', '<products><WNG_Gravcore'):
                  if token in txt:
                      bad.append((str(p), token))
          assert not bad, bad

          print('Production invariants passed')
          PY
