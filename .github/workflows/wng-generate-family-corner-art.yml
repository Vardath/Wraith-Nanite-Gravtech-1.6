name: Generate family gravship corner art

on:
  push:
    branches: [ main ]
    paths:
      - ".github/artfix/generate_family_corner_art.py"
      - ".github/workflows/wng-generate-family-corner-art.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Generate family outside-hull corner sprites
        run: python .github/artfix/generate_family_corner_art.py

      - name: Validate generated PNGs
        shell: python
        run: |
          from pathlib import Path
          from PIL import Image
          roots = [
              Path("Textures/Things/Building/Precursor/Gravship/HullCorners"),
              Path("Textures/Things/Building/Wraith/Gravship/HullCorners"),
              Path("Textures/Things/Building/Goauld/Gravship/HullCorners"),
          ]
          dirs = ("northeast","northwest","southeast","southwest")
          paths = []
          for root in roots:
              for d in dirs:
                  paths.append(root / f"AngledGravshipHull_{d}.png")
                  paths.append(root / f"AngledGravshipHull_Partial_{d}.png")
          assert len(paths) == 24
          for path in paths:
              assert path.exists(), path
              with Image.open(path) as im:
                  assert im.size == (256,256), (path, im.size)
                  assert im.mode in ("RGBA","LA","P"), (path, im.mode)
                  alpha = im.convert("RGBA").getchannel("A")
                  bbox = alpha.getbbox()
                  assert bbox is not None, path
                  # Reject the old fin/spike-style assets: the replacement must
                  # span diagonally across most of the 2x2 outside-corner quad.
                  assert (bbox[2]-bbox[0]) >= 160 and (bbox[3]-bbox[1]) >= 160, (path,bbox)
          print("Validated", len(paths), "family gravship corner sprites.")

      - name: Commit generated corner art
        run: |
          if git diff --quiet --             Textures/Things/Building/Precursor/Gravship/HullCorners             Textures/Things/Building/Wraith/Gravship/HullCorners             Textures/Things/Building/Goauld/Gravship/HullCorners
          then
            echo "Corner art already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             Textures/Things/Building/Precursor/Gravship/HullCorners             Textures/Things/Building/Wraith/Gravship/HullCorners             Textures/Things/Building/Goauld/Gravship/HullCorners
          git commit -m "Replace family gravship outside-corner hull art"
          git push
