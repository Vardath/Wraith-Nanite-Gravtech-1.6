name: D120 Gravship Linked-Art and Door Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  gravship-linked-art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Validate family doors, barriers and linked-atlas ordering
        shell: python
        run: |
          from pathlib import Path
          import xml.etree.ElementTree as ET
          from PIL import Image

          failures = []

          def defs_from(path):
              root = ET.parse(path).getroot()
              return {n.findtext("defName"): n for n in list(root) if n.findtext("defName")}

          family = defs_from("Defs/Gravships/Gravship_FamilySystems.xml")
          support = defs_from("Defs/Gravships/Gravship_FamilySupport.xml")
          goauld = defs_from("Defs/Gravships/Gravship_Goauld.xml")
          parity = defs_from("Defs/Gravships/Gravship_VanillaParity.xml")
          ancient = defs_from("Defs/Gravships/Gravship_AncientVacuumShield.xml")
          wraith_engine_defs = defs_from("Defs/ThingDefs/Things_WraithGravEngine.xml")
          wraith_settlement = defs_from("Defs/ThingDefs/Things_WraithPlayerInfrastructure.xml")
          precursor_settlement = defs_from("Defs/ThingDefs/Things_PrecursorStructures.xml")

          door_sets = [
              ("WNG_WraithGravshipDoor", family),
              ("WNG_AsuranGravshipDoor", family),
              ("WNG_GoauldGravshipDoor", goauld),
              ("WNG_WraithVacuumMembrane", parity),
              ("WNG_AsuranVacBarrier", parity),
              ("WNG_GoauldVacBarrier", parity),
          ]

          door_workers = {
              "WNG_WraithGravshipDoor": "WraithNaniteGravtech.PlaceWorker_RequireWraithGravshipSubstructure",
              "WNG_AsuranGravshipDoor": "WraithNaniteGravtech.PlaceWorker_RequireAsuranGravshipSubstructure",
              "WNG_GoauldGravshipDoor": "WraithNaniteGravtech.PlaceWorker_RequireGoauldGravshipSubstructure",
              "WNG_WraithVacuumMembrane": "WraithNaniteGravtech.PlaceWorker_RequireWraithGravshipSubstructure",
              "WNG_AsuranVacBarrier": "WraithNaniteGravtech.PlaceWorker_RequireAsuranGravshipSubstructure",
              "WNG_GoauldVacBarrier": "WraithNaniteGravtech.PlaceWorker_RequireGoauldGravshipSubstructure",
          }

          for name, defs in door_sets:
              node = defs.get(name)
              if node is None:
                  failures.append(f"{name} missing")
                  continue
              if node.find("stuffCategories") is None or node.find("stuffCategories").attrib.get("Inherit") != "False":
                  failures.append(f"{name} is still stuffable and can inherit a Medium terrain requirement")
              if node.findtext("costStuffCount") != "0":
                  failures.append(f"{name} still inherits stuff cost")
              if node.findtext("useStuffTerrainAffordance") != "false":
                  failures.append(f"{name} still inherits stuff terrain affordance")
              if node.findtext("terrainAffordanceNeeded") != "Substructure":
                  failures.append(f"{name} no longer explicitly requires Odyssey Substructure")
              workers = [x.text for x in node.findall("./placeWorkers/li")]
              if door_workers[name] not in workers:
                  failures.append(f"{name} lost its same-family gravship-substructure placement worker")

          
          linked_defs = [
              ("WNG_GoauldGravshipHull", goauld, "Graphic_Single", "Things/Building/Goauld/Gravship/WNG_GoauldHull_Atlas", "WraithNaniteGravtech.PlaceWorker_RequireGoauldGravshipSubstructure"),
              ("WNG_PrecursorGravshipHull", family, "Graphic_Single", "Things/Building/Precursor/Gravship/WNG_PrecursorHull_Atlas", "WraithNaniteGravtech.PlaceWorker_RequireAsuranGravshipSubstructure"),
              ("WNG_OrganicGravshipHull", family, "Graphic_Single", "Things/Building/Wraith/Gravship/WNG_OrganicHull_Atlas", "WraithNaniteGravtech.PlaceWorker_RequireWraithGravshipSubstructure"),
              ("WNG_GoauldPowerConduit", goauld, "WraithNaniteGravtech.Graphic_LinkedGoauldFamilyPower", "Things/Building/Goauld/Gravship/WNG_GoauldPowerConduit_Atlas", "WraithNaniteGravtech.PlaceWorker_RequireGoauldGravshipSubstructure"),
              ("WNG_GoauldFuelConduit", goauld, "WraithNaniteGravtech.Graphic_LinkedGoauldFuelConduit", "Things/Building/Goauld/Gravship/WNG_GoauldFuelConduit_Atlas", "WraithNaniteGravtech.PlaceWorker_RequireGoauldGravshipSubstructure"),
              ("WNG_AsuranPowerConduit", family, "WraithNaniteGravtech.Graphic_LinkedAsuranFamilyPower", "Things/Building/Precursor/Gravship/WNG_AsuranPowerConduit_Atlas", "WraithNaniteGravtech.PlaceWorker_RequireAsuranGravshipSubstructure"),
              ("WNG_AsuranFuelConduit", family, "WraithNaniteGravtech.Graphic_LinkedAsuranFuelConduit", "Things/Building/Precursor/Gravship/WNG_AsuranFuelConduit_Atlas", "WraithNaniteGravtech.PlaceWorker_RequireAsuranGravshipSubstructure"),
              ("WNG_WraithNeuralConduit", family, "WraithNaniteGravtech.Graphic_LinkedWraithFamilyPower", "Things/Building/Wraith/Gravship/WNG_WraithNeuralConduit_Atlas", "WraithNaniteGravtech.PlaceWorker_RequireWraithGravshipSubstructure"),
              ("WNG_WraithFuelConduit", family, "WraithNaniteGravtech.Graphic_LinkedWraithFuelConduit", "Things/Building/Wraith/Gravship/WNG_WraithFuelConduit_Atlas", "WraithNaniteGravtech.PlaceWorker_RequireWraithGravshipSubstructure"),
          ]
          for name, defs, graphic_class, tex_path, worker in linked_defs:
              node = defs.get(name)
              if node is None:
                  failures.append(f"{name} missing")
                  continue
              if node.findtext("./graphicData/graphicClass") != graphic_class:
                  failures.append(f"{name} lost its intended linked rendering class")
              if node.findtext("./graphicData/texPath") != tex_path:
                  failures.append(f"{name} no longer points at the approved linked atlas")
              if node.findtext("./graphicData/drawSize") != "(1,1)":
                  failures.append(f"{name} drawSize is no longer tile-aligned at (1,1)")
              if name in {"WNG_GoauldGravshipHull", "WNG_PrecursorGravshipHull", "WNG_OrganicGravshipHull"}:
                  if node.findtext("./graphicData/linkType") != "CornerFiller":
                      failures.append(f"{name} no longer uses vanilla CornerFiller wall linking")
                  flags = {x.text for x in node.findall("./graphicData/linkFlags/li")}
                  if not {"Wall", "Rock"}.issubset(flags):
                      failures.append(f"{name} lost vanilla Wall/Rock link flags")
              workers = [x.text for x in node.findall("./placeWorkers/li")]
              if worker not in workers:
                  failures.append(f"{name} lost its same-family gravship-substructure placement worker")

          # Ordinary settlement walls must use the same correctly ordered family linked
          # atlas topology as the straight gravship hull tiles so runs/corners join like vanilla walls.
          settlement_walls = (
              ("WNG_WraithLivingWall", wraith_settlement, "Things/Building/Wraith/Gravship/WNG_OrganicHull_Atlas"),
              ("WNG_PrecursorWall", precursor_settlement, "Things/Building/Precursor/Gravship/WNG_PrecursorHull_Atlas"),
          )
          for name, defs, tex_path in settlement_walls:
              node = defs.get(name)
              if node is None:
                  failures.append(f"{name} settlement wall missing")
                  continue
              if node.findtext("./graphicData/texPath") != tex_path:
                  failures.append(f"{name} does not use the approved linked family wall atlas")
              if node.findtext("./graphicData/graphicClass") != "Graphic_Single":
                  failures.append(f"{name} lost vanilla linked-wall inner graphic class")
              if node.findtext("./graphicData/linkType") != "CornerFiller":
                  failures.append(f"{name} no longer uses vanilla CornerFiller linking")
              flags = {x.text for x in node.findall("./graphicData/linkFlags/li")}
              if not {"Wall", "Rock"}.issubset(flags):
                  failures.append(f"{name} lost vanilla Wall/Rock link flags")

          family_source = Path("Source/WraithNaniteGravtech/Gravships/GravshipFamilySystems.cs").read_text(encoding="utf-8")
          for token in (
              "entityDefToBuild as ThingDef",
              "GetCompProperties<CompProperties_WNGFamilyPowerNode>",
              "GetCompProperties<CompProperties_WNGFuelEndpoint>",
          ):
              if token not in family_source:
                  failures.append(f"family conduit blueprint/frame linking regressed: {token}")

          # Architect conduit buttons use a single-piece vanilla-style conduit icon,
          # never the 4x4 linked world atlas.
          conduit_icon_defs = (
              ("WNG_WraithNeuralConduit", family),
              ("WNG_WraithFuelConduit", family),
              ("WNG_AsuranPowerConduit", family),
              ("WNG_AsuranFuelConduit", family),
              ("WNG_GoauldPowerConduit", goauld),
              ("WNG_GoauldFuelConduit", goauld),
          )
          for name, defs in conduit_icon_defs:
              node = defs.get(name)
              if node is None:
                  failures.append(f"{name} missing for conduit icon validation")
                  continue
              if node.findtext("uiIconPath") != "Things/Building/Linked/PowerConduit_MenuIcon":
                  failures.append(f"{name} Architect icon regressed to the linked atlas instead of a single conduit piece")
              if node.findtext("uiIconScale") != "0.7":
                  failures.append(f"{name} no longer matches vanilla conduit icon scale")

          # Family doors and thrusters must advertise Wall/Rock flags into RimWorld's LinkGrid
          # so CornerFiller hull walls visibly terminate into them instead of leaving a gap.
          gravship_wall_neighbors = (
              ("WNG_WraithGravshipDoor", family),
              ("WNG_AsuranGravshipDoor", family),
              ("WNG_GoauldGravshipDoor", goauld),
              ("WNG_OrganicThruster", family),
              ("WNG_WraithHeavyDriveOrgan", family),
              ("WNG_PrecursorVectorThruster", family),
              ("WNG_AsuranHeavyVectorDrive", family),
              ("WNG_GoauldSmallSublightDrive", goauld),
              ("WNG_GoauldLargeSublightDrive", goauld),
          )
          for name, defs in gravship_wall_neighbors:
              node = defs.get(name)
              if node is None:
                  failures.append(f"{name} missing for hull-wall adjacency validation")
                  continue
              flags = {x.text for x in node.findall("./graphicData/linkFlags/li")}
              if not {"Wall", "Rock"}.issubset(flags):
                  failures.append(f"{name} no longer advertises Wall/Rock LinkGrid flags to adjacent gravship hull")

          # Family gravship equipment must use Odyssey's native facility link path:
          # equipment has a gravship-facility comp, the matching engine lists that Def,
          # and ordinary ship systems use long-range/no-LOS linkage across connected substructure.
          all_gravship_defs = {}
          for defs in (family, support, goauld, parity, ancient):
              all_gravship_defs.update(defs)

          engine_defs = {
              "Wraith": wraith_engine_defs["WNG_WraithGravEngine"],
              "Asuran": family["WNG_AsuranGravEngine"],
              "Goauld": goauld["WNG_GoauldGravEngine"],
          }
          facility_classes = {
              "WraithNaniteGravtech.CompProperties_WNGPilotConsole",
              "WraithNaniteGravtech.CompProperties_WNGGravshipFacility",
              "WraithNaniteGravtech.CompProperties_WNGFuelTankFacility",
              "WraithNaniteGravtech.CompProperties_WNGThruster",
          }
          network_classes = facility_classes | {
              "WraithNaniteGravtech.CompProperties_WNGFamilyPowerNode",
              "WraithNaniteGravtech.CompProperties_WNGFuelEndpoint",
          }

          engine_links = {
              family_name: {li.text for li in node.findall(".//linkableFacilities/li") if li.text}
              for family_name, node in engine_defs.items()
          }

          for name, node in all_gravship_defs.items():
              comps = node.findall("./comps/li")
              classes = {comp.attrib.get("Class", "") for comp in comps}
              if not (classes & network_classes):
                  continue

              family_name = None
              for comp in comps:
                  candidate = comp.findtext("family")
                  if candidate in engine_defs:
                      family_name = candidate
                      break
              if family_name is None:
                  failures.append(f"{name} is gravship-network equipment but has no Wraith/Asuran/Goauld family")
                  continue

              facility = next((comp for comp in comps if comp.attrib.get("Class", "") in facility_classes), None)
              if facility is None:
                  failures.append(f"{name} is {family_name} gravship equipment but has no native gravship facility comp")
                  continue

              if name not in engine_links[family_name]:
                  failures.append(f"{name} is not registered in the {family_name} grav engine linkableFacilities list")

              if "GravField" not in name:
                  if facility.findtext("requiresLOS", "true").lower() != "false":
                      failures.append(f"{name} grav-engine link incorrectly requires line of sight")
                  try:
                      if float(facility.findtext("maxDistance", "8")) < 500:
                          failures.append(f"{name} grav-engine link range is below the full-ship 500-tile facility range")
                  except ValueError:
                      failures.append(f"{name} has an invalid grav-engine maxDistance")

          vanilla_thruster_limits = {
              "WNG_OrganicThruster": 4,
              "WNG_WraithHeavyDriveOrgan": 6,
              "WNG_PrecursorVectorThruster": 4,
              "WNG_AsuranHeavyVectorDrive": 6,
              "WNG_GoauldSmallSublightDrive": 4,
              "WNG_GoauldLargeSublightDrive": 6,
          }
          for name, expected_max in vanilla_thruster_limits.items():
              node = all_gravship_defs.get(name)
              if node is None:
                  failures.append(f"{name} missing from gravship defs")
                  continue
              facility = next(
                  (comp for comp in node.findall("./comps/li")
                   if comp.attrib.get("Class") == "WraithNaniteGravtech.CompProperties_WNGThruster"),
                  None,
              )
              if facility is None:
                  failures.append(f"{name} lost its WNG gravship-thruster comp")
                  continue
              if facility.findtext("requiresLOS") != "false":
                  failures.append(f"{name} must use vanilla-style no-LOS grav-engine linking")
              if facility.findtext("maxDistance") != "500":
                  failures.append(f"{name} must use vanilla-style 500-tile grav-engine facility range")
              if facility.findtext("maxSimultaneous") != str(expected_max):
                  failures.append(
                      f"{name} maxSimultaneous is {facility.findtext('maxSimultaneous')}, expected {expected_max}"
                  )

          atlases = [
              "Textures/Things/Building/Goauld/Gravship/WNG_GoauldHull_Atlas.png",
              "Textures/Things/Building/Precursor/Gravship/WNG_PrecursorHull_Atlas.png",
              "Textures/Things/Building/Wraith/Gravship/WNG_OrganicHull_Atlas.png",
              "Textures/Things/Building/Goauld/Gravship/WNG_GoauldPowerConduit_Atlas.png",
              "Textures/Things/Building/Goauld/Gravship/WNG_GoauldFuelConduit_Atlas.png",
              "Textures/Things/Building/Precursor/Gravship/WNG_AsuranPowerConduit_Atlas.png",
              "Textures/Things/Building/Precursor/Gravship/WNG_AsuranFuelConduit_Atlas.png",
              "Textures/Things/Building/Wraith/Gravship/WNG_WraithNeuralConduit_Atlas.png",
              "Textures/Things/Building/Wraith/Gravship/WNG_WraithFuelConduit_Atlas.png",
          ]

          # MaterialAtlasPool indexes 0..15 from the image BOTTOM row upward; the repair is direction-aware:
          # Up=1, Right=2, Down=4, Left=8.  Check the four one-direction
          # variants and the all-directions variant against the actual alpha at the
          # cropped submaterial boundaries used by RimWorld.
          direction_bits = (
              (1, "up"),
              (2, "right"),
              (4, "down"),
              (8, "left"),
          )
          expected = {
              index: {name for bit, name in direction_bits if index & bit}
              for index in range(16)
          }

          def edge_links(image, index):
              w, h = image.size
              if w % 4 or h % 4:
                  raise ValueError(f"atlas dimensions are not divisible by 4: {image.size}")
              cw, ch = w // 4, h // 4
              col = index % 4
              # Unity texture row 0 is bottom; PIL row 0 is top.
              row_from_top = 3 - (index // 4)

              # MaterialAtlasPool: each 1/4 cell has 1/32 full-texture padding,
              # leaving 3/16 texture = 3/4 of one cell as the sampled submaterial.
              px, py = cw // 8, ch // 8
              x0 = col * cw + px
              x1 = (col + 1) * cw - px
              y0 = row_from_top * ch + py
              y1 = (row_from_top + 1) * ch - py

              alpha = image.getchannel("A")
              band = max(2, min(cw, ch) // 48)

              boxes = {
                  "up":    (x0, y0, x1, min(y1, y0 + band)),
                  "right": (max(x0, x1 - band), y0, x1, y1),
                  "down":  (x0, max(y0, y1 - band), x1, y1),
                  "left":  (x0, y0, min(x1, x0 + band), y1),
              }
              result = set()
              for direction, box in boxes.items():
                  crop = alpha.crop(box)
                  active = sum(1 for a in crop.getdata() if a > 24)
                  if active >= max(2, band):
                      result.add(direction)
              return result

          for atlas_path in atlases:
              path = Path(atlas_path)
              if not path.exists():
                  failures.append(f"linked atlas missing: {atlas_path}")
                  continue
              with Image.open(path) as im:
                  image = im.convert("RGBA")
                  for index, expected_links in expected.items():
                      actual = edge_links(image, index)
                      if actual != expected_links:
                          failures.append(
                              f"{path.name} atlas index {index} has links {sorted(actual)}, "
                              f"expected {sorted(expected_links)}; linked row/direction alignment regressed"
                          )

          repair_script = Path(".github/artfix/reorder_linked_atlas_rows.py")
          if not repair_script.exists():
              failures.append("linked-atlas row-order repair script missing")

          corner_layer = Path("Source/WraithNaniteGravtech/Gravships/SectionLayer_WNGFamilyGravshipHull.cs").read_text(encoding="utf-8")
          if "public override bool Visible => ModsConfig.OdysseyActive;" not in corner_layer:
              failures.append("family angled gravship-corner layer is not active with Odyssey")
          for required in (
              "HullCornerScale = 2f",
              "GetOffset",
              "IsCornerSubstructure",
              "ShaderDatabase.GravshipMaskMasked",
              "ShaderDatabase.IndoorMaskMasked",
          ):
              if required not in corner_layer:
                  failures.append(f"family angled gravship-corner layer lost vanilla geometry/mask contract: {required}")

          if failures:
              print("GRAVSHIP LINKED-ART / DOOR VALIDATION FAILURES:")
              for failure in failures:
                  print(" -", failure)
              raise SystemExit(1)

          print("Gravship linked art and substructure-native doors/barriers validated.")
