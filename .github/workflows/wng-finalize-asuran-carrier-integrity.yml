name: WNG Finalize Asuran Carrier Integrity

on:
  push:
    branches: [main]
    paths:
      - ".github/artqa/finalize_asuran_carrier_integrity.py"
      - ".github/workflows/wng-finalize-asuran-carrier-integrity.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m pip install --disable-pip-version-check pillow
      - run: python .github/artqa/finalize_asuran_carrier_integrity.py
      - name: Commit centered carrier sprites
        shell: bash
        run: |
          git add Textures/Things/Building/Precursor/Shuttle/WNG_AsuranQueenRecoveryCarrier*.png
          if git diff --cached --quiet; then
            echo "Carrier sprites already centered and valid."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Center and verify Asuran recovery carrier sprites"
          git push
