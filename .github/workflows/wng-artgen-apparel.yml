name: WNG Apparel Studio

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wng-artgen-apparel.yml'
      - 'Tools/ArtStudio/wng_apparel_studio.py'
      - 'Tools/ArtStudio/profiles/**'
  workflow_dispatch:
    inputs:
      profile:
        description: 'Exactly one Tools/ArtStudio profile id'
        required: true
        default: 'wraith_commander_carapace'

permissions:
  contents: write

jobs:
  apparel-studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install studio dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy scipy requests beautifulsoup4 cairosvg

      - name: Compile and validate studio
        run: |
          python -m py_compile Tools/ArtStudio/wng_apparel_studio.py
          python Tools/ArtStudio/wng_apparel_studio.py --validate-profiles-only

      - name: Select one profile
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PROFILE="${{ github.event.inputs.profile }}"
            test -f "Tools/ArtStudio/profiles/${PROFILE}.json"
            echo "HAS_PROFILE=true" >> "$GITHUB_ENV"
            echo "PROFILE=${PROFILE}" >> "$GITHUB_ENV"
            exit 0
          fi
          mapfile -t CHANGED < <(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | sed -n 's#^Tools/ArtStudio/profiles/\(.*\)\.json$#\1#p')
          if [ "${#CHANGED[@]}" -eq 0 ]; then
            echo "HAS_PROFILE=false" >> "$GITHUB_ENV"
          elif [ "${#CHANGED[@]}" -eq 1 ]; then
            echo "HAS_PROFILE=true" >> "$GITHUB_ENV"
            echo "PROFILE=${CHANGED[0]}" >> "$GITHUB_ENV"
          else
            echo "One item at a time." >&2
            exit 1
          fi

      - name: Fetch vanilla RimWorld geometry
        if: env.HAS_PROFILE == 'true'
        run: |
          git clone --depth 1 https://github.com/SamuelBucher/Madness-Pawns.git /tmp/madness
          git clone --depth 1 https://github.com/DaLongZhuaZi/RWonVela.git /tmp/rwvela

      - name: Paint one apparel item
        if: env.HAS_PROFILE == 'true'
        run: |
          python Tools/ArtStudio/wng_apparel_studio.py "$PROFILE" \
            --vanilla-dir "/tmp/madness/Raw sprites/apparel" \
            --body-dir "/tmp/rwvela/src/common/human/bodies" \
            --workdir /tmp/wng-artstudio

      - name: Validate live RimWorld apparel
        if: env.HAS_PROFILE == 'true'
        run: python .github/artqa/apparel_art_audit.py

      - name: Commit live apparel only
        if: env.HAS_PROFILE == 'true'
        shell: bash
        run: |
          ITEM="$(python -c "import json; p=json.load(open('Tools/ArtStudio/profiles/'+'$PROFILE'+'.json')); print(p['item'])")"
          OUTDIR="$(python -c "import json; p=json.load(open('Tools/ArtStudio/profiles/'+'$PROFILE'+'.json')); print(p.get('output_dir','Wraith'))")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Textures/Things/Pawn/Humanlike/Apparel/$OUTDIR/${ITEM}"*.png
          if git diff --cached --quiet; then
            echo "No live art changes."
            exit 0
          fi
          git commit -m "Paint ${ITEM} with WNG Apparel Studio [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
