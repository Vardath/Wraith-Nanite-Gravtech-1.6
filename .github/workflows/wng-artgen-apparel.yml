name: WNG Apparel ArtGen

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wng-artgen-apparel.yml'
      - 'Tools/ArtGen/wng_apparel_generator.py'
      - 'Tools/ArtGen/profiles/**'
  workflow_dispatch:
    inputs:
      profile:
        description: 'Exactly one Tools/ArtGen/profiles profile id to generate'
        required: true
        default: 'wraith_hunter_coat'

permissions:
  contents: write

concurrency:
  group: wng-apparel-artgen
  cancel-in-progress: false

jobs:
  apparel-artgen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ArtGen dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy scipy requests beautifulsoup4 cairosvg

      - name: Compile and validate permanent ArtGen
        run: |
          python -m py_compile Tools/ArtGen/wng_apparel_generator.py
          python Tools/ArtGen/wng_apparel_generator.py --validate-profiles-only

      - name: Select exactly one apparel profile
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PROFILE="${{ github.event.inputs.profile }}"
            test -f "Tools/ArtGen/profiles/${PROFILE}.json"
            echo "HAS_PROFILE=true" >> "$GITHUB_ENV"
            echo "PROFILE=${PROFILE}" >> "$GITHUB_ENV"
            exit 0
          fi

          mapfile -t CHANGED < <(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | sed -n 's#^Tools/ArtGen/profiles/\(.*\)\.json$#\1#p')
          if [ "${#CHANGED[@]}" -eq 0 ]; then
            echo "Generator/tooling-only change: validate architecture, do not regenerate clothing."
            echo "HAS_PROFILE=false" >> "$GITHUB_ENV"
          elif [ "${#CHANGED[@]}" -eq 1 ]; then
            echo "HAS_PROFILE=true" >> "$GITHUB_ENV"
            echo "PROFILE=${CHANGED[0]}" >> "$GITHUB_ENV"
          else
            echo "One clothing item at a time: found ${#CHANGED[@]} changed profiles." >&2
            printf '%s\n' "${CHANGED[@]}" >&2
            exit 1
          fi

      - name: Fetch vanilla RimWorld implementation references
        if: env.HAS_PROFILE == 'true'
        run: |
          git clone --depth 1 https://github.com/SamuelBucher/Madness-Pawns.git /tmp/madness
          git clone --depth 1 https://github.com/DaLongZhuaZi/RWonVela.git /tmp/rwvela

      - name: Run Stargate-first apparel pipeline
        if: env.HAS_PROFILE == 'true'
        shell: bash
        run: |
          python Tools/ArtGen/wng_apparel_generator.py "$PROFILE" \
            --vanilla-dir "/tmp/madness/Raw sprites/apparel" \
            --body-dir "/tmp/rwvela/src/common/human/bodies" \
            --workdir /tmp/wng-artgen-runtime \
            --preview /tmp/wng-apparel-contact-sheet.png

      - name: Validate RimWorld apparel implementation
        if: env.HAS_PROFILE == 'true'
        run: python .github/artqa/apparel_art_audit.py

      - name: Commit live apparel assets only
        if: env.HAS_PROFILE == 'true'
        shell: bash
        run: |
          ITEM="$(python -c "import json; p=json.load(open('Tools/ArtGen/profiles/'+'$PROFILE'+'.json')); print(p['item'])")"
          OUTDIR="$(python -c "import json; p=json.load(open('Tools/ArtGen/profiles/'+'$PROFILE'+'.json')); print(p.get('output_dir','Wraith'))")"
          TARGET="Textures/Things/Pawn/Humanlike/Apparel/$OUTDIR"
          TMP="/tmp/wng-final-assets"
          mkdir -p "$TMP"
          cp "$TARGET/${ITEM}"*.png "$TMP/"

          # Other WNG validation/build workflows may update main while ArtGen is rendering.
          # Rebase-by-replay caused generated-art conflicts. Instead, anchor to the latest
          # main and copy only the already-QA'd live PNGs back onto that snapshot.
          git fetch origin main
          git reset --hard origin/main
          cp "$TMP/${ITEM}"*.png "$TARGET/"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$TARGET/${ITEM}"*.png
          if git diff --cached --quiet; then
            echo "No live apparel asset changes."
            exit 0
          fi
          git commit -m "Generate ${ITEM} with Stargate-first WNG ArtGen [skip ci]"
          git push origin HEAD:main
