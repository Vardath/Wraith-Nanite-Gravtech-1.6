name: WNG Step 5 Final Import

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wng-step5-final-import.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install fitting dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy scipy cairosvg

      - name: Import finished Step 5 masters
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/step5
          curl -fL --retry 4 --retry-delay 2 'https://sdmntpraustraliaeast.oaiusercontent.com/files/00000000-7160-81fa-b01e-82ded7f6c7e1/raw?se=2026-10-03T05%3A14%3A57Z&sp=r&sv=2026-02-06&sr=b&scid=cb66dcc1-1494-5923-9912-5209d83fab5d&skoid=cb94e22a-e3df-4e6a-9e17-1696f40fa435&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-03T03%3A42%3A29Z&ske=2026-10-04T03%3A42%3A29Z&sks=b&skv=2026-02-06&sig=%2B9UpTRY/qSPZMXa3QZJjel/ytqVi8UvCyahhHXCbFmw%3D' -o /tmp/step5/masters.zip
          test "$(sha256sum /tmp/step5/masters.zip | awk '{print $1}')" = "147e12108be2a3662eaac7e17061c94678d080531d100a52b8b66ba8944b917a"
          unzip -o /tmp/step5/masters.zip -d /tmp/step5/masters
          install -m 0644 /tmp/step5/masters/master_south.png ArtSource/Apparel/human_form_uniform/master_south.png
          install -m 0644 /tmp/step5/masters/master_north.png ArtSource/Apparel/human_form_uniform/master_north.png
          install -m 0644 /tmp/step5/masters/master_east.png ArtSource/Apparel/human_form_uniform/master_east.png

      - name: Validate ApparelForge
        run: |
          python -m py_compile Tools/ApparelForge/apparel_forge.py
          python Tools/ApparelForge/apparel_forge.py --validate-profiles-only

      - name: Fetch vanilla RimWorld geometry
        run: |
          git clone --depth 1 https://github.com/SamuelBucher/Madness-Pawns.git /tmp/madness
          git clone --depth 1 https://github.com/DaLongZhuaZi/RWonVela.git /tmp/rwvela

      - name: Fit Step 5 masters and build fresh tile
        run: |
          python Tools/ApparelForge/apparel_forge.py human_form_uniform \
            --vanilla-dir "/tmp/madness/Raw sprites/apparel" \
            --body-dir "/tmp/rwvela/src/common/human/bodies" \
            --workdir /tmp/wng-step5-final

      - name: Validate live apparel
        run: python .github/artqa/apparel_art_audit.py

      - name: Commit finished Step 5 to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ArtSource/Apparel/human_form_uniform/master_south.png \
                  ArtSource/Apparel/human_form_uniform/master_north.png \
                  ArtSource/Apparel/human_form_uniform/master_east.png \
                  "Textures/Things/Pawn/Humanlike/Apparel/Precursor/WNG_HumanFormUniform"*.png
          git diff --cached --quiet && exit 0
          git commit -m "Finish Step 5 Human Form Uniform from finished master art [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
