name: WNG native backstory validation

on:
  push:
    branches:
      - rebuild/native-backstories-20260911

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild/native-backstories-20260911
          fetch-depth: 0

      - name: Wire WNG backstory categories
        run: |
          echo '' | base64 -d > /tmp/wng-wire-backstories.py
          python /tmp/wng-wire-backstories.py

      - name: Build WNG
        run: dotnet build Source/WNG/WNG.csproj -c Release

      - name: Parse Def and Patch XML
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          files = list(Path('Defs').rglob('*.xml')) + list(Path('Patches').rglob('*.xml'))
          for p in files:
              ET.parse(p)
          print(f'Parsed {len(files)} XML files')
          PY

      - name: Verify native backstory schema and role wiring
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          root = ET.parse('Defs/BackstoryDefs/Backstories_WNG.xml').getroot()
          stories = root.findall('BackstoryDef')
          if len(stories) < 25:
              raise SystemExit(f'Expected substantial WNG backstory pool, found {len(stories)}')

          categories = set()
          for story in stories:
              if story.findtext('requiresSpawnCategory') != 'true':
                  raise SystemExit('Every WNG backstory must require its WNG spawn category')
              categories.update(li.text for li in story.findall('./spawnCategories/li'))
              for gain in story.findall('./skillGains/li'):
                  if gain.find('skill') is None or gain.find('amount') is None:
                      raise SystemExit('Backstory skillGains must use current list schema')
              skills = story.find('skillGains')
              if skills is not None and any(child.tag != 'li' for child in list(skills)):
                  raise SystemExit('Legacy dictionary-style skill gain found')

          required = {'WNG_WraithOrigin','WNG_WraithHunterAdult','WNG_WraithWarriorAdult','WNG_WraithCommanderAdult','WNG_WraithKeeperAdult','WNG_WraithQueenAdult','WNG_WraithPlayerAdult','WNG_AsuranOrigin','WNG_AsuranOperativeAdult','WNG_SyntheticEngineerAdult','WNG_SyntheticSoldierAdult','WNG_SyntheticCoordinatorAdult','WNG_AsuranInfiltratorAdult','WNG_QuietLatticeAdult','WNG_AsuranPlayerAdult'}
          missing = sorted(required - categories)
          if missing:
              raise SystemExit('Missing WNG backstory categories: ' + ', '.join(missing))

          files = ['Defs/PawnKindDefs/PawnKinds_Wraith.xml','Defs/PawnKindDefs/PawnKinds_Asuran.xml','Defs/PawnKindDefs/PawnKinds_HumanFormSocieties.xml','Defs/PawnKindDefs/PawnKinds_ReplicatorQueen.xml']
          for filename in files:
              text = Path(filename).read_text()
              if '<backstoryFiltersOverride>' not in text:
                  raise SystemExit(filename + ': backstory filters not wired')
          PY

      - name: Commit validated wiring and remove validator
        run: |
          rm .github/workflows/wng-native-backstories.yml
          git config user.name "Vardath"
          git config user.email "59270526+Vardath@users.noreply.github.com"
          git add Defs/BackstoryDefs/Backstories_WNG.xml Defs/PawnKindDefs/PawnKinds_Wraith.xml Defs/PawnKindDefs/PawnKinds_Asuran.xml Defs/PawnKindDefs/PawnKinds_HumanFormSocieties.xml Defs/PawnKindDefs/PawnKinds_ReplicatorQueen.xml .github/workflows/wng-native-backstories.yml
          git commit -m "rebuild: wire native WNG backstories to current roles"
          git push origin HEAD:rebuild/native-backstories-20260911
