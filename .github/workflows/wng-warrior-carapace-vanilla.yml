name: WNG Warrior Carapace Vanilla Template
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wng-warrior-carapace-vanilla.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch vanilla implementation references
        shell: bash
        run: |
          git clone --depth 1 https://github.com/SamuelBucher/Madness-Pawns.git /tmp/madness
          git clone --depth 1 https://github.com/DaLongZhuaZi/RWonVela.git /tmp/rwvela
      - name: Install renderer
        run: python -m pip install --disable-pip-version-check pillow numpy scipy cairosvg
      - name: Build Warrior Carapace from vanilla PowerArmor contour
        run: python .github/artgen/wraith_warrior_carapace_vanilla.py
      - name: Validate apparel family
        run: python .github/artqa/apparel_art_audit.py
      - name: Commit Warrior Carapace textures only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Textures/Things/Pawn/Humanlike/Apparel/Wraith/WNG_WarriorCarapace*.png
          git commit -m "Rebuild Warrior Carapace on vanilla RimWorld armor template [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

# fresh run after canvas-safety correction
