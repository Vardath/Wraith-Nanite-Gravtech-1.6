name: Temporary recurring Queen recovery validation

on:
  push:
    branches:
      - rebuild/recurring-queen-recovery-20260911

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build WNG
        run: dotnet build Source/WNG/WNG.csproj -c Release
      - name: Parse Def and patch XML
        run: |
          python3 - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET
          files = list(pathlib.Path('Defs').rglob('*.xml')) + list(pathlib.Path('Patches').rglob('*.xml'))
          for path in files:
              ET.parse(path)
          print(f'Parsed {len(files)} XML files')
          PY
