name: WNG Generate Replicator Resource Art

on:
  push:
    branches: [main]
    paths:
      - ".github/artgen/generate_replicator_resources.py"
      - ".github/workflows/wng-generate-replicator-resources.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m pip install --disable-pip-version-check pillow
      - name: Generate professional Replicator resource pair
        run: python .github/artgen/generate_replicator_resources.py
      - name: Commit generated resources
        shell: bash
        run: |
          git add Textures/Things/Item/Resource/Replicator/WNG_ReplicatorMatter.png
          git add Textures/Things/Item/Resource/Replicator/WNG_ReplicatorCoreFragment.png
          if git diff --cached --quiet; then
            echo "Replicator resource art already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Upgrade Replicator blocks and core fragment art"
          git push
