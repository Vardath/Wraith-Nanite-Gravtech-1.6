name: WNG art generator

on:
  push:
    branches: [main]
    paths:
      - '.github/artgen/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-art:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Generate WNG art
        run: |
          set -euo pipefail
          for script in .github/artgen/*.py; do
            echo "Running $script"
            python "$script"
          done

      - name: Validate changed PNGs
        run: |
          set -euo pipefail
          git diff --name-only -- '*.png' > /tmp/wng_changed_pngs.txt
          cat /tmp/wng_changed_pngs.txt
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          changed=[Path(x.strip()) for x in Path('/tmp/wng_changed_pngs.txt').read_text().splitlines() if x.strip()]
          if not changed:
              print('No PNG changes; generators are already current.')
          for p in changed:
              im=Image.open(p)
              im.verify()
              im=Image.open(p).convert('RGBA')
              alpha=im.getchannel('A')
              assert alpha.getbbox(), f'empty alpha: {p}'
              assert alpha.getextrema()[0] == 0, f'no transparency: {p}'
              print(p, im.size, alpha.getbbox())

          gliders=list(Path('Textures/Things/Building/Goauld/Shuttle').glob('WNG_GoauldDeathGlider*.png'))
          assert len(gliders) >= 5, f'Expected Death Glider family, got {len(gliders)}'
          for p in gliders:
              assert Image.open(p).size == (512,512), (p, Image.open(p).size)

          field=list(Path('Textures/Things/Pawn/Humanlike/Apparel/Precursor').glob('WNG_PrecursorFieldArmor*.png'))
          if field:
              assert len(field) == 26, f'Expected 26 Precursor Field Armour PNGs, got {len(field)}'
              for p in field:
                  assert Image.open(p).size == (192,192), (p, Image.open(p).size)
          PY

      - name: Build review artifact
        run: |
          set -euo pipefail
          rm -rf /tmp/wng-art-review
          mkdir -p /tmp/wng-art-review
          if [ -s /tmp/wng_changed_pngs.txt ]; then
            while IFS= read -r p; do
              mkdir -p "/tmp/wng-art-review/$(dirname "$p")"
              cp "$p" "/tmp/wng-art-review/$p"
            done < /tmp/wng_changed_pngs.txt
          else
            cp Textures/Things/Building/Goauld/Shuttle/WNG_GoauldDeathGlider*.png /tmp/wng-art-review/
          fi

      - name: Upload generated art for review
        uses: actions/upload-artifact@v4
        with:
          name: wng-generated-art
          path: /tmp/wng-art-review
          if-no-files-found: error
          retention-days: 14

      - name: Commit generated art
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Textures
          if git diff --cached --quiet; then
            echo "Generated art already current."
            exit 0
          fi
          git commit -m "Generate professional WNG art upgrades"
          git push origin HEAD:main
