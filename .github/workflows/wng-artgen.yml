name: WNG art generator

on:
  push:
    branches: [main]
    paths:
      - '.github/artgen/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-art:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Generate WNG art
        run: |
          set -euo pipefail
          for script in .github/artgen/*.py; do
            echo "Running $script"
            python "$script"
          done

      - name: Validate generated PNGs
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          paths = [
              *Path("Textures/Things/Building/Goauld/Shuttle").glob("WNG_GoauldDeathGlider*.png"),
          ]
          assert len(paths) >= 5, f"Expected Death Glider family, got {len(paths)}"
          for p in paths:
              im=Image.open(p)
              im.verify()
              im=Image.open(p).convert("RGBA")
              assert im.size == (512,512), (p, im.size)
              alpha=im.getchannel("A")
              assert alpha.getbbox(), f"empty alpha: {p}"
              assert alpha.getextrema()[0] == 0, f"no transparency: {p}"
              print(p, im.size, alpha.getbbox())
          PY

      - name: Upload generated art for review
        uses: actions/upload-artifact@v4
        with:
          name: wng-generated-art
          path: |
            Textures/Things/Building/Goauld/Shuttle/WNG_GoauldDeathGlider*.png
          if-no-files-found: error
          retention-days: 14

      - name: Commit generated art
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Textures/Things/Building/Goauld/Shuttle/WNG_GoauldDeathGlider*.png
          if git diff --cached --quiet; then
            echo "Generated art already current."
            exit 0
          fi
          git commit -m "Upgrade Goa'uld Death Glider art"
          git push origin HEAD:main
