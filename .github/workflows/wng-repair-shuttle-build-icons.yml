name: WNG Repair Shuttle Build Icons

on:
  push:
    branches: [main]
    paths:
      - ".github/artqa/repair_shuttle_build_icons.py"
      - ".github/workflows/wng-repair-shuttle-build-icons.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m pip install --disable-pip-version-check pillow
      - run: python .github/artqa/repair_shuttle_build_icons.py
      - name: Commit repaired icons
        shell: bash
        run: |
          git add Textures/UI/WNG/Build/WNG_PuddleJumper.png Textures/UI/WNG/Build/WNG_AsuranQueenRecoveryCarrier.png
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Repair and center shuttle build icons"
          git push
