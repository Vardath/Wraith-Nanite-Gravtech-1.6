name: D108 Release Gap Audit

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run D108 release-gap audit
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from collections import Counter, defaultdict
          import json, re, subprocess, sys
          import xml.etree.ElementTree as ET

          root = Path('.')
          sealed_d107 = '283f0e218e2273e961c8c0005599ee5247667f83'
          xml_files = sorted(root.rglob('*.xml'))
          cs_files = sorted(root.rglob('*.cs'))
          source_text = '\n'.join(p.read_text(encoding='utf-8', errors='replace') for p in cs_files)
          searchable = [p for p in root.rglob('*') if p.is_file() and p.suffix.lower() in {'.xml', '.cs', '.md'}]
          all_text = '\n'.join(p.read_text(encoding='utf-8', errors='replace') for p in searchable)
          usage_text = '\n'.join(p.read_text(encoding='utf-8', errors='replace') for p in (xml_files + cs_files))

          hard_errors, parse_errors, defs = [], [], []
          def_counts, duplicate_index = Counter(), defaultdict(list)
          tex_refs, sound_defs = [], []
          typed_root_nodes = raw_defname_count = 0

          for path in xml_files:
              try:
                  doc = ET.parse(path).getroot()
              except Exception as exc:
                  parse_errors.append([str(path), str(exc)])
                  continue
              raw_defname_count += sum(1 for _ in doc.iter('defName'))
              if doc.tag == 'Defs':
                  typed_root_nodes += len(list(doc))
                  for node in list(doc):
                      name = node.findtext('defName')
                      if name:
                          defs.append((node.tag, name, str(path)))
                          def_counts[node.tag] += 1
                          duplicate_index[(node.tag, name)].append(str(path))
                          if node.tag == 'SoundDef':
                              sound_defs.append(name)
              for elem in doc.iter('texPath'):
                  if elem.text and elem.text.strip():
                      tex_refs.append((str(path), elem.text.strip()))

          duplicates = [[kind, name, paths] for (kind, name), paths in sorted(duplicate_index.items()) if len(paths) > 1]
          if parse_errors: hard_errors.append(f'{len(parse_errors)} XML parse errors')
          if len(xml_files) < 183: hard_errors.append(f'XML inventory regressed below sealed D107: {len(xml_files)} < 183')
          if len(cs_files) < 79: hard_errors.append(f'C# inventory regressed below sealed D107: {len(cs_files)} < 79')
          if duplicates: hard_errors.append(f'duplicate named typed Defs: {len(duplicates)}')

          changed = subprocess.check_output(['git', 'diff', '--name-only', sealed_d107 + '..HEAD'], text=True).splitlines()
          # D108 remains an open production branch. Changed paths are reported for review,
          # but no path allowlist may block legitimate master-plan, playtest, balance,
          # graphics, audio, integration, or bug-fix work.
          provenance_review_only = sorted(set(changed))

          custom_class_refs = set()
          class_pattern = re.compile(r'WraithNaniteGravtech(?:\.[A-Za-z_][A-Za-z0-9_]*)+')
          for path in xml_files:
              for match in class_pattern.finditer(path.read_text(encoding='utf-8', errors='replace')):
                  custom_class_refs.add(match.group(0).split('.')[-1])
          unresolved_classes = [short for short in sorted(custom_class_refs) if not re.search(r'\b(?:class|struct|enum|interface)\s+' + re.escape(short) + r'\b', source_text)]
          if unresolved_classes:
              hard_errors.append('unresolved WNG XML class refs: ' + ', '.join(unresolved_classes))

          declaration_only = {}
          for kind in ('ResearchProjectDef', 'PawnKindDef', 'FactionDef'):
              names = [name for k, name, _ in defs if k == kind]
              declaration_only[kind] = [name for name in names if all_text.count(name) <= 1]
              if declaration_only[kind]:
                  hard_errors.append(f'orphan {kind} candidates: ' + ', '.join(declaration_only[kind]))

          universal = ET.parse('Defs/RecipeDefs/Recipes_UniversalCrafting.xml').getroot()
          universal_defs = [n.findtext('defName') for n in list(universal) if n.findtext('defName')]
          worker_refs = sum(1 for n in list(universal) if n.findtext('workerClass') == 'WraithNaniteGravtech.RecipeWorker_UniversalCraftOnly')
          if 'enableUniversalCrafting' not in source_text or 'RecipeWorker_UniversalCraftOnly' not in source_text or len(universal_defs) != 11 or worker_refs != 11:
              hard_errors.append('universal-crafting baseline drift')

          texture_stems = set()
          for p in Path('Textures').rglob('*.png'):
              stem = p.relative_to('Textures').as_posix()[:-4]
              texture_stems.add(stem)
              for suffix in ('_north','_south','_east','_west'):
                  if stem.endswith(suffix): texture_stems.add(stem[:-len(suffix)])
          missing_custom_texture_refs = []
          for path, tex in tex_refs:
              if tex in texture_stems: continue
              if tex.startswith('WNG/') or '/WNG_' in tex or tex.startswith('WraithNaniteGravtech/'):
                  missing_custom_texture_refs.append([path, tex])
          if missing_custom_texture_refs:
              hard_errors.append(f'missing custom texture refs: {len(missing_custom_texture_refs)}')

          about = ET.parse('About/About.xml').getroot()
          package_ids = {x.text.strip().lower() for x in about.findall('.//modDependencies/li/packageId') if x.text}
          required = {'ludeon.rimworld.royalty','ludeon.rimworld.ideology','ludeon.rimworld.biotech','ludeon.rimworld.anomaly','ludeon.rimworld.odyssey'}
          missing = sorted(required - package_ids)
          if missing: hard_errors.append('About.xml missing required DLC package IDs: ' + ', '.join(missing))

          sound_usage = {}
          for sound in sorted(sound_defs):
              token = re.compile(r'(?<![A-Za-z0-9_])' + re.escape(sound) + r'(?![A-Za-z0-9_])')
              sound_usage[sound] = max(0, len(token.findall(usage_text)) - 1)
          unused_sounddefs = [name for name,count in sound_usage.items() if count == 0]

          audit = {
              'stage':'D108 master-plan correction regression',
              'baseline_commit':sealed_d107,
              'inventory':{'xml_files':len(xml_files),'csharp_files':len(cs_files),'named_root_defs':len(defs),'root_nodes':typed_root_nodes,'raw_defname_count':raw_defname_count,'def_counts':dict(sorted(def_counts.items()))},
              'changed_paths_since_d107':changed,
              'provenance_review_only':provenance_review_only,
              'unresolved_custom_class_refs':unresolved_classes,
              'missing_custom_texture_refs':missing_custom_texture_refs,
              'unused_sounddefs':unused_sounddefs,
              'hard_errors':hard_errors,
              'proof_boundary':'Static/source/Git checks only; managed compilation, native Def load, live gameplay and save/reload remain unproven.'
          }
          Path('d108-release-gap-audit.json').write_text(json.dumps(audit,indent=2),encoding='utf-8')
          print(f'D108 release-gap: XML={len(xml_files)} C#={len(cs_files)} changed={len(changed)} hard_errors={len(hard_errors)}')
          for err in hard_errors: print(' - '+err)
          if hard_errors: sys.exit(1)
          print('D108 release-gap/provenance audit: PASS')
          PY

      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d108-release-gap-audit
          path: d108-release-gap-audit.json
          if-no-files-found: error
