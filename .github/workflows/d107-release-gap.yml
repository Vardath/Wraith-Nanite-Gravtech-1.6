name: D107 Release Gap Audit

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run D107 release-gap audit
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from collections import Counter, defaultdict
          import json
          import re
          import subprocess
          import sys
          import xml.etree.ElementTree as ET

          root = Path('.')
          import_commit = '8d5dfbe0f53845f054dd4125048034b9de71c85d'
          xml_files = sorted(root.rglob('*.xml'))
          cs_files = sorted(root.rglob('*.cs'))
          source_text = '\n'.join(p.read_text(encoding='utf-8', errors='replace') for p in cs_files)
          searchable = [p for p in root.rglob('*') if p.is_file() and p.suffix.lower() in {'.xml', '.cs', '.md'}]
          all_text = '\n'.join(p.read_text(encoding='utf-8', errors='replace') for p in searchable)
          usage_text = '\n'.join(p.read_text(encoding='utf-8', errors='replace') for p in (xml_files + cs_files))

          hard_errors = []
          parse_errors = []
          defs = []
          def_counts = Counter()
          duplicate_index = defaultdict(list)
          typed_root_nodes = 0
          raw_defname_count = 0
          tex_refs = []
          sound_defs = []

          for path in xml_files:
              try:
                  doc = ET.parse(path).getroot()
              except Exception as exc:
                  parse_errors.append([str(path), str(exc)])
                  continue
              raw_defname_count += sum(1 for _ in doc.iter('defName'))
              if doc.tag == 'Defs':
                  typed_root_nodes += len(list(doc))
                  for node in list(doc):
                      name = node.findtext('defName')
                      if name:
                          defs.append((node.tag, name, str(path)))
                          def_counts[node.tag] += 1
                          duplicate_index[(node.tag, name)].append(str(path))
                          if node.tag == 'SoundDef':
                              sound_defs.append(name)
              for elem in doc.iter('texPath'):
                  if elem.text and elem.text.strip():
                      tex_refs.append((str(path), elem.text.strip()))

          named_root_defs = len(defs)
          duplicates = [[kind, name, paths] for (kind, name), paths in sorted(duplicate_index.items()) if len(paths) > 1]

          if parse_errors:
              hard_errors.append(f'{len(parse_errors)} XML parse errors')
          if len(xml_files) != 183:
              hard_errors.append(f'XML inventory drift: expected 183, got {len(xml_files)}')
          if len(cs_files) != 79:
              hard_errors.append(f'C# inventory drift: expected 79, got {len(cs_files)}')
          if duplicates:
              hard_errors.append(f'duplicate named typed Defs: {len(duplicates)}')

          # Exact import provenance. D107 closure deliberately permits only the already-audited
          # Quiet-Lattice transaction repair plus two CE ammo presentation fixes uncovered by the
          # GitHub release-gap audit. No other mod path may drift from the uploaded emergency WIP.
          changed = subprocess.check_output(['git', 'diff', '--name-only', import_commit + '..HEAD'], text=True).splitlines()
          approved_mod_changes = {
              'Source/WraithNaniteGravtech/Compatibility/QuietLatticeStargateVisit.cs',
              'Compatibility/CombatExtended/Defs/Ammo_WNG.xml',
              'Compatibility/CombatExtended/Defs/Ammo_Precursor.xml',
          }
          audit_paths = {
              '.github/workflows/d107-static-validation.yml',
              '.github/workflows/d107-release-gap.yml',
          }
          allowed_changes = approved_mod_changes | audit_paths
          provenance_violations = sorted(set(changed) - allowed_changes)
          xml_changes_since_import = sorted(p for p in changed if p.lower().endswith('.xml'))
          approved_xml_changes = {
              'Compatibility/CombatExtended/Defs/Ammo_WNG.xml',
              'Compatibility/CombatExtended/Defs/Ammo_Precursor.xml',
          }
          if provenance_violations:
              hard_errors.append('D107 provenance violation: ' + ', '.join(provenance_violations))
          if set(xml_changes_since_import) != approved_xml_changes:
              hard_errors.append('D107 XML change set differs from the two approved CE texture repairs: ' + ', '.join(xml_changes_since_import))

          # WNG XML class references: resolve the final type segment, not namespace segments.
          custom_class_refs = set()
          class_pattern = re.compile(r'WraithNaniteGravtech(?:\.[A-Za-z_][A-Za-z0-9_]*)+')
          for path in xml_files:
              for match in class_pattern.finditer(path.read_text(encoding='utf-8', errors='replace')):
                  custom_class_refs.add(match.group(0).split('.')[-1])
          unresolved_classes = []
          for short in sorted(custom_class_refs):
              if not re.search(r'\b(?:class|struct|enum|interface)\s+' + re.escape(short) + r'\b', source_text):
                  unresolved_classes.append(short)
          if unresolved_classes:
              hard_errors.append('unresolved WNG XML class refs: ' + ', '.join(unresolved_classes))

          declaration_only = {}
          for kind in ('ResearchProjectDef', 'PawnKindDef', 'FactionDef'):
              names = [name for k, name, _ in defs if k == kind]
              declaration_only[kind] = [name for name in names if all_text.count(name) <= 1]
          if declaration_only['ResearchProjectDef']:
              hard_errors.append('orphan research candidates: ' + ', '.join(declaration_only['ResearchProjectDef']))
          if declaration_only['PawnKindDef']:
              hard_errors.append('orphan PawnKind candidates: ' + ', '.join(declaration_only['PawnKindDef']))
          if declaration_only['FactionDef']:
              hard_errors.append('orphan faction candidates: ' + ', '.join(declaration_only['FactionDef']))

          universal = Path('Defs/RecipeDefs/Recipes_UniversalCrafting.xml')
          universal_root = ET.parse(universal).getroot()
          universal_defs = [n.findtext('defName') for n in list(universal_root) if n.findtext('defName')]
          worker_refs = sum(1 for n in list(universal_root) if n.findtext('workerClass') == 'WraithNaniteGravtech.RecipeWorker_UniversalCraftOnly')
          setting_present = 'enableUniversalCrafting' in source_text and 'Enable universal WNG crafting' in source_text
          worker_present = re.search(r'\bclass\s+RecipeWorker_UniversalCraftOnly\b', source_text) is not None
          if not setting_present or not worker_present or len(universal_defs) != 11 or worker_refs != 11:
              hard_errors.append(f'universal-crafting contract drift: setting={setting_present}, worker={worker_present}, defs={len(universal_defs)}, workerRefs={worker_refs}')

          texture_files = list(Path('Textures').rglob('*.png')) if Path('Textures').exists() else []
          texture_stems = set()
          for p in texture_files:
              stem = p.relative_to('Textures').as_posix()[:-4]
              texture_stems.add(stem)
              for suffix in ('_north', '_south', '_east', '_west'):
                  if stem.endswith(suffix):
                      texture_stems.add(stem[:-len(suffix)])
          missing_custom_texture_refs = []
          generic_vanilla_graphic_refs = []
          for path, tex in tex_refs:
              if tex in texture_stems:
                  continue
              if tex.startswith('WNG/') or '/WNG_' in tex or tex.startswith('WraithNaniteGravtech/'):
                  missing_custom_texture_refs.append([path, tex])
              elif tex.startswith('Things/') or tex.startswith('UI/'):
                  generic_vanilla_graphic_refs.append([path, tex])
          if missing_custom_texture_refs:
              hard_errors.append(f'missing custom texture refs: {len(missing_custom_texture_refs)}')

          sound_usage = {}
          for sound in sorted(sound_defs):
              token = re.compile(r'(?<![A-Za-z0-9_])' + re.escape(sound) + r'(?![A-Za-z0-9_])')
              sound_usage[sound] = max(0, len(token.findall(usage_text)) - 1)
          unused_sounddefs = [name for name, count in sound_usage.items() if count == 0]

          about = ET.parse('About/About.xml').getroot()
          package_ids = [x.text.strip() for x in about.findall('.//modDependencies/li/packageId') if x.text]
          required_packages = {
              'ludeon.rimworld.royalty', 'ludeon.rimworld.ideology', 'ludeon.rimworld.biotech',
              'ludeon.rimworld.anomaly', 'ludeon.rimworld.odyssey'
          }
          missing_packages = sorted(required_packages - {x.lower() for x in package_ids})
          if missing_packages:
              hard_errors.append('About.xml missing required DLC package IDs: ' + ', '.join(missing_packages))

          audit = {
              'stage': 'D107 GitHub release-gap/provenance regression',
              'inventory': {
                  'xml_files': len(xml_files), 'csharp_files': len(cs_files),
                  'historical_handoff_typed_xml_defs': 566,
                  'recreated_root_element_count': typed_root_nodes,
                  'named_root_defs': named_root_defs,
                  'raw_defname_count': raw_defname_count,
                  'def_counts': dict(sorted(def_counts.items())),
                  'duplicates': duplicates, 'parse_errors': parse_errors,
                  'custom_class_refs_checked': len(custom_class_refs),
                  'unresolved_custom_class_refs': unresolved_classes,
                  'counter_note': 'The original local typed-Def counting implementation is unavailable. Exact bounded path provenance from the uploaded D107 authority is enforced instead.'
              },
              'reachability_candidates': declaration_only,
              'universal_crafting': {
                  'setting_present': setting_present, 'worker_present': worker_present,
                  'coverage_count': len(universal_defs), 'worker_ref_count': worker_refs,
                  'fallback_recipe_defs': universal_defs,
              },
              'presentation': {
                  'generic_vanilla_graphic_ref_count': len(generic_vanilla_graphic_refs),
                  'missing_custom_texture_refs': missing_custom_texture_refs,
                  'note': 'Generic vanilla-looking refs are review candidates; this GitHub heuristic is not numerically comparable to the old Data-oracle script.'
              },
              'audio': {
                  'sounddef_count': len(sound_defs), 'unused_sounddefs': unused_sounddefs,
                  'unused_sounddef_count': len(unused_sounddefs), 'usage_counts': sound_usage,
              },
              'about': {'required_package_ids': package_ids, 'missing_expected_dlc_ids': missing_packages},
              'provenance': {
                  'import_authority_commit': import_commit,
                  'approved_mod_changes': sorted(approved_mod_changes),
                  'changed_paths_since_import': changed,
                  'xml_changes_since_import': xml_changes_since_import,
                  'violations': provenance_violations,
              },
              'summary': {
                  'hard_error_count': len(hard_errors), 'hard_errors': hard_errors,
                  'proof_boundary': 'Static XML/source/Git provenance audit only. Managed compilation, native Def load, live CatCraft/CE/Odyssey behavior and save/reload are not proven.'
              }
          }
          Path('d107-release-gap-audit.json').write_text(json.dumps(audit, indent=2), encoding='utf-8')

          print('D107 release-gap/provenance audit')
          print(f'  XML/C#: {len(xml_files)}/{len(cs_files)}')
          print(f'  approved XML repairs present: {xml_changes_since_import}')
          print(f'  named root Defs: {named_root_defs}; root nodes: {typed_root_nodes}; raw defName tags: {raw_defname_count}')
          print(f'  custom class refs: {len(custom_class_refs)} checked, {len(unresolved_classes)} unresolved')
          print(f'  universal crafting: {len(universal_defs)}/11')
          print(f'  orphan candidates: research={len(declaration_only["ResearchProjectDef"])}, pawnkind={len(declaration_only["PawnKindDef"])}, faction={len(declaration_only["FactionDef"])}')
          print(f'  missing custom texture refs: {len(missing_custom_texture_refs)}')
          print(f'  unused SoundDefs: {len(unused_sounddefs)} -> {unused_sounddefs}')
          print(f'  provenance changed paths: {changed}')
          print(f'  hard errors: {len(hard_errors)}')
          for err in hard_errors:
              print('   - ' + err)
          if hard_errors:
              sys.exit(1)
          PY

      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d107-release-gap-audit
          path: d107-release-gap-audit.json
          if-no-files-found: error
