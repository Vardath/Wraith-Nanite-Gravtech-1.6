name: D107 Release Gap Audit

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run D107 release-gap audit
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from collections import Counter, defaultdict
          import json
          import re
          import subprocess
          import sys
          import xml.etree.ElementTree as ET

          root = Path('.')
          xml_files = sorted(root.rglob('*.xml'))
          cs_files = sorted(root.rglob('*.cs'))
          source_text = '\n'.join(p.read_text(encoding='utf-8', errors='replace') for p in cs_files)
          searchable_files = [p for p in root.rglob('*') if p.is_file() and p.suffix.lower() in {'.xml', '.cs', '.md'}]
          all_text = '\n'.join(p.read_text(encoding='utf-8', errors='replace') for p in searchable_files)

          hard_errors = []
          parse_errors = []
          def_counts = Counter()
          defs = []
          duplicate_index = defaultdict(list)
          tex_refs = []
          sound_defs = []

          for path in xml_files:
              try:
                  tree = ET.parse(path)
              except Exception as exc:
                  parse_errors.append([str(path), str(exc)])
                  continue
              doc = tree.getroot()
              if doc.tag == 'Defs':
                  for node in list(doc):
                      defname = node.findtext('defName')
                      if defname:
                          def_counts[node.tag] += 1
                          defs.append((node.tag, defname, str(path)))
                          duplicate_index[(node.tag, defname)].append(str(path))
                          if node.tag == 'SoundDef':
                              sound_defs.append(defname)
              for elem in doc.iter('texPath'):
                  if elem.text and elem.text.strip():
                      tex_refs.append((str(path), elem.text.strip()))

          typed_defs = len(defs)
          duplicates = [
              [kind, name, paths]
              for (kind, name), paths in sorted(duplicate_index.items())
              if len(paths) > 1
          ]

          if parse_errors:
              hard_errors.append(f'{len(parse_errors)} XML parse errors')
          if len(xml_files) != 183:
              hard_errors.append(f'XML inventory drift: expected 183, got {len(xml_files)}')
          if len(cs_files) != 79:
              hard_errors.append(f'C# inventory drift: expected 79, got {len(cs_files)}')
          if typed_defs != 566:
              hard_errors.append(f'typed Def inventory drift: expected 566, got {typed_defs}')
          if duplicates:
              hard_errors.append(f'duplicate typed Defs: {len(duplicates)}')

          # WNG XML class references must resolve to a current C# type. External CE/CatCraft
          # classes are deliberately excluded because they are optional-mod API references.
          custom_class_refs = set()
          class_pattern = re.compile(r'WraithNaniteGravtech\.([A-Za-z_][A-Za-z0-9_]*)')
          for path in xml_files:
              text = path.read_text(encoding='utf-8', errors='replace')
              custom_class_refs.update(class_pattern.findall(text))
          unresolved_classes = []
          for short in sorted(custom_class_refs):
              type_pattern = re.compile(r'\b(?:class|struct|enum|interface)\s+' + re.escape(short) + r'\b')
              if not type_pattern.search(source_text):
                  unresolved_classes.append(short)
          if unresolved_classes:
              hard_errors.append('unresolved WNG XML class refs: ' + ', '.join(unresolved_classes))

          # Declaration-only heuristics mirror the old release-gap review category. They are
          # review candidates rather than automatic defects because some Defs can be discovered
          # by native systems without a literal second reference.
          declaration_only = {}
          for kind in ('ResearchProjectDef', 'PawnKindDef', 'FactionDef'):
              names = [name for k, name, _ in defs if k == kind]
              declaration_only[kind] = [name for name in names if all_text.count(name) <= 1]

          # Universal crafting is a hard release contract from D103-D106.
          universal_recipe = Path('Defs/RecipeDefs/Recipes_UniversalCrafting.xml')
          universal_text = universal_recipe.read_text(encoding='utf-8', errors='replace') if universal_recipe.exists() else ''
          universal_root = ET.parse(universal_recipe).getroot() if universal_recipe.exists() else None
          universal_defs = []
          universal_worker_refs = 0
          if universal_root is not None:
              for node in list(universal_root):
                  name = node.findtext('defName')
                  if name:
                      universal_defs.append(name)
                  if node.findtext('workerClass') == 'WraithNaniteGravtech.RecipeWorker_UniversalCraftOnly':
                      universal_worker_refs += 1
          setting_present = 'enableUniversalWngCrafting' in source_text
          worker_present = re.search(r'\bclass\s+RecipeWorker_UniversalCraftOnly\b', source_text) is not None
          if not setting_present:
              hard_errors.append('universal-crafting setting is missing')
          if not worker_present:
              hard_errors.append('universal-crafting worker is missing')
          if len(universal_defs) != 11 or universal_worker_refs != 11:
              hard_errors.append(f'universal-crafting coverage drift: defs={len(universal_defs)}, worker refs={universal_worker_refs}, expected 11/11')

          # Texture review: a texPath is custom if a matching PNG (including directional variants)
          # exists in this mod. Vanilla-looking paths without local art stay review candidates.
          texture_files = list(Path('Textures').rglob('*.png')) if Path('Textures').exists() else []
          texture_stems = set()
          for p in texture_files:
              rel = p.relative_to('Textures').as_posix()
              stem = rel[:-4]
              texture_stems.add(stem)
              for suffix in ('_north', '_south', '_east', '_west'):
                  if stem.endswith(suffix):
                      texture_stems.add(stem[:-len(suffix)])
          generic_vanilla_graphic_refs = []
          missing_custom_texture_refs = []
          for path, tex in tex_refs:
              if tex in texture_stems:
                  continue
              if tex.startswith('Things/') or tex.startswith('UI/'):
                  generic_vanilla_graphic_refs.append([path, tex])
              elif tex.startswith('WNG/') or '/WNG_' in tex or tex.startswith('WraithNaniteGravtech/'):
                  missing_custom_texture_refs.append([path, tex])
          if missing_custom_texture_refs:
              hard_errors.append(f'missing custom texture refs: {len(missing_custom_texture_refs)}')

          # Sound usage count excludes each SoundDef's own declaration occurrence.
          sound_usage = {}
          for sound in sorted(sound_defs):
              sound_usage[sound] = max(0, all_text.count(sound) - 1)
          unused_sounddefs = [name for name, count in sound_usage.items() if count == 0]

          # About.xml DLC/package contract.
          about = ET.parse('About/About.xml').getroot()
          package_ids = [x.text.strip() for x in about.findall('.//modDependencies/li/packageId') if x.text]
          required_packages = {
              'ludeon.rimworld.royalty',
              'ludeon.rimworld.ideology',
              'ludeon.rimworld.biotech',
              'ludeon.rimworld.anomaly',
              'ludeon.rimworld.odyssey',
          }
          package_lower = {x.lower() for x in package_ids}
          missing_packages = sorted(required_packages - package_lower)
          if missing_packages:
              hard_errors.append('About.xml missing required DLC package IDs: ' + ', '.join(missing_packages))

          # Provenance: the uploaded emergency WIP was imported at this exact commit. From that
          # authority forward, only the bounded Quiet-Lattice source repair and audit machinery
          # may differ during D107 closure.
          import_commit = '8d5dfbe0f53845f054dd4125048034b9de71c85d'
          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', import_commit + '..HEAD'], text=True
          ).splitlines()
          allowed_changes = {
              'Source/WraithNaniteGravtech/Compatibility/QuietLatticeStargateVisit.cs',
              '.github/workflows/d107-static-validation.yml',
              '.github/workflows/d107-release-gap.yml',
          }
          provenance_violations = sorted(set(changed) - allowed_changes)
          if provenance_violations:
              hard_errors.append('D107 provenance violation: ' + ', '.join(provenance_violations))

          audit = {
              'stage': 'D107 GitHub release-gap/provenance regression',
              'inventory': {
                  'xml_files': len(xml_files),
                  'csharp_files': len(cs_files),
                  'typed_xml_defs': typed_defs,
                  'def_counts': dict(sorted(def_counts.items())),
                  'duplicates': duplicates,
                  'parse_errors': parse_errors,
                  'custom_class_refs_checked': len(custom_class_refs),
                  'unresolved_custom_class_refs': unresolved_classes,
              },
              'reachability_candidates': {
                  'research_declaration_only': declaration_only['ResearchProjectDef'],
                  'pawnkind_declaration_only': declaration_only['PawnKindDef'],
                  'faction_declaration_only': declaration_only['FactionDef'],
              },
              'universal_crafting': {
                  'setting_present': setting_present,
                  'worker_present': worker_present,
                  'fallback_recipe_defs': universal_defs,
                  'coverage_count': len(universal_defs),
                  'worker_ref_count': universal_worker_refs,
              },
              'presentation': {
                  'generic_vanilla_graphic_ref_count': len(generic_vanilla_graphic_refs),
                  'generic_vanilla_graphic_refs': generic_vanilla_graphic_refs,
                  'missing_custom_texture_refs': missing_custom_texture_refs,
              },
              'audio': {
                  'sounddef_count': len(sound_defs),
                  'unused_sounddefs': unused_sounddefs,
                  'unused_sounddef_count': len(unused_sounddefs),
                  'usage_counts': sound_usage,
              },
              'about': {
                  'required_package_ids': package_ids,
                  'missing_expected_dlc_ids': missing_packages,
              },
              'provenance': {
                  'import_authority_commit': import_commit,
                  'changed_paths_since_import': changed,
                  'violations': provenance_violations,
              },
              'summary': {
                  'hard_error_count': len(hard_errors),
                  'hard_errors': hard_errors,
                  'proof_boundary': 'Static XML/source/Git provenance audit only. Managed compilation, native Def load, live CatCraft/CE/Odyssey behavior and save/reload are not proven.',
              },
          }
          Path('d107-release-gap-audit.json').write_text(json.dumps(audit, indent=2), encoding='utf-8')

          print('D107 release-gap/provenance audit')
          print(f'  XML/C#: {len(xml_files)}/{len(cs_files)}')
          print(f'  typed Defs: {typed_defs}')
          print(f'  custom class refs: {len(custom_class_refs)} checked, {len(unresolved_classes)} unresolved')
          print(f'  universal crafting: {len(universal_defs)}/11')
          print(f'  declaration-only review candidates: research={len(declaration_only["ResearchProjectDef"])}, pawnkind={len(declaration_only["PawnKindDef"])}, faction={len(declaration_only["FactionDef"])}')
          print(f'  generic vanilla graphic review refs: {len(generic_vanilla_graphic_refs)}')
          print(f'  missing custom texture refs: {len(missing_custom_texture_refs)}')
          print(f'  unused SoundDefs: {len(unused_sounddefs)} -> {unused_sounddefs}')
          print(f'  provenance changed paths: {changed}')
          print(f'  hard errors: {len(hard_errors)}')
          for err in hard_errors:
              print('   - ' + err)

          if hard_errors:
              sys.exit(1)
          PY

      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d107-release-gap-audit
          path: d107-release-gap-audit.json
          if-no-files-found: error
