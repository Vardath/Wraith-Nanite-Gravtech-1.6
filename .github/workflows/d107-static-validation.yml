              'WNG_PrecursorVectorThruster': ('Defs/Gravships/Gravship_FamilySystems.xml', '750', '4', '55'),
              'WNG_PrecursorShieldEmitter': ('Defs/Gravships/Gravship_FamilySupport.xml', '750', '4', '55'),
          }
          parsed_asuran_repair_files = {}
          for name, (path, interval, heal, radius) in asuran_repair_targets.items():
              if path not in parsed_asuran_repair_files:
                  parsed_asuran_repair_files[path] = ET.fromstring(Path(path).read_text(encoding='utf-8'))
              node = next((n for n in list(parsed_asuran_repair_files[path]) if n.findtext('defName') == name), None)
              if node is None:
                  failures.append(f'Asuran archive-repair target missing: {name}')
                  continue
              repair = next((n for n in node.findall('./comps/li') if n.get('Class') == 'WraithNaniteGravtech.CompProperties_AsuranArchiveRepair'), None)
              if repair is None:
                  failures.append(f'{name} lost archive-linked structural repair')
                  continue
              if repair.findtext('repairIntervalTicks') != interval:
                  failures.append(f'{name} archive-repair interval regressed')
              if repair.findtext('healPerPulse') != heal:
                  failures.append(f'{name} archive-repair amount regressed')
              if repair.findtext('archiveRadius') != radius:
                  failures.append(f'{name} archive-repair radius regressed')

          precursor_structures = parsed_asuran_repair_files['Defs/ThingDefs/Things_PrecursorStructures.xml']
          precursor_wall = next((n for n in list(precursor_structures) if n.findtext('defName') == 'WNG_PrecursorWall'), None)
          if precursor_wall is None or precursor_wall.findtext('tickerType') != 'Rare':
              failures.append('Precursor wall no longer ticks its archive-linked repair component')
          fabricator_root = parsed_asuran_repair_files['Defs/ThingDefs/Things_SovereignLattice.xml']
          fabricator = next((n for n in list(fabricator_root) if n.findtext('defName') == 'WNG_PrecursorFabricator'), None)
          if fabricator is None or fabricator.findtext('tickerType') != 'Normal':
              failures.append('Asuran fabricator no longer ticks its archive-linked repair component')

          all_asuran_repair_xml = '\n'.join(
              Path(path).read_text(encoding='utf-8') for path in sorted(set(v[0] for v in asuran_repair_targets.values()))
          )
          if 'WNG_PrecursorGravPowerCore' in all_asuran_repair_xml:
              failures.append('Asuran archive repair resurrected the obsolete PrecursorGravPowerCore identity')

          # Retained deceptive Ancient survey-annex warning trap (#90 archaeology recovery):
          # the annex must warn at a wider radius, preserve a minimum warning window, and only
          # then wake a finite threat-scaled Asuran cadre on closer approach.
          deceptive_annex_source = Path('Source/WraithNaniteGravtech/Ancient/AncientLegacySites.cs').read_text(encoding='utf-8')
          for label, needle in (
              ('saved warning state', 'Scribe_Values.Look(ref warningIssued, "wngDeceptiveAncientWarningIssued", false)'),
              ('saved warning tick', 'Scribe_Values.Look(ref warningTick, "wngDeceptiveAncientWarningTick", -1)'),
              ('current reveal-timer save compatibility', 'Scribe_Values.Look(ref revealReadyTick, "wngSurveyAnnexRevealReadyTick", -1)'),
              ('saved threat budget', 'Scribe_Values.Look(ref configuredThreatPoints, "wngDeceptiveAncientThreatPoints", 700f)'),
              ('wider warning boundary', 'AnyFreeColonistWithin(Props.warningRadius)'),
              ('minimum warning window', 'Math.Max(60, Props.minimumWarningTicks)'),
              ('closer activation boundary', 'AnyFreeColonistWithin(Props.activationRadius)'),
              ('site threat handoff', 'site.desiredThreatPoints'),
              ('threat configuration', 'ConfigureThreat(threatPoints)'),
              ('soldier threshold', 'configuredThreatPoints >= 900f'),
              ('commander threshold', 'configuredThreatPoints >= 1650f'),
              ('finite base cadre', 'new List<PawnKindDef> { baseKind, baseKind }'),
              ('one-shot physical commit', 'revealed = true;'),
              ('warning inspect state', 'Survey matrix: anomalous pattern harmonic detected'),
          ):
              if needle not in deceptive_annex_source:
                  failures.append(f'Deceptive survey-annex contract missing: {label}')

          deceptive_annex_defs = ET.fromstring(Path('Defs/ThingDefs/Things_AncientLegacy.xml').read_text(encoding='utf-8'))
          deceptive_core = next((n for n in list(deceptive_annex_defs) if n.findtext('defName') == 'WNG_DeceptiveSurveyAnnexCore'), None)
          if deceptive_core is None:
              failures.append('Deceptive survey-annex core Def is missing')
          else:
              if deceptive_core.findtext('tickerType') != 'Normal':
                  failures.append('Deceptive survey-annex core no longer checks its staged trigger on the retained cadence')
              props = next((n for n in deceptive_core.findall('./comps/li') if n.get('Class') == 'WraithNaniteGravtech.CompProperties_DeceptiveSurveyAnnexCore'), None)
              if props is None:
                  failures.append('Deceptive survey-annex core lost its staged trap component')
              else:
                  expected = {
                      'initialGraceTicks': '600',
                      'warningRadius': '14',
                      'activationRadius': '7',
                      'minimumWarningTicks': '600',
                      'checkIntervalTicks': '120',
                  }
                  for field, value in expected.items():
                      if props.findtext(field) != value:
                          failures.append(f'Deceptive survey-annex {field} regressed: {props.findtext(field)}')
                  for obsolete in ('graceTicks', 'triggerRadius', 'minimumDefenders', 'maximumDefenders'):
                      if props.find(obsolete) is not None:
                          failures.append(f'Deceptive survey-annex retained obsolete one-stage field: {obsolete}')

          if 'WNG_DeceptiveAncientSurveyMatrix' in deceptive_annex_source:
              failures.append('Deceptive survey-annex restoration resurrected the obsolete historical Def identity')

          # Retained implant-regeneration continuity: Regenerative Vesicle and Reconstruction
          # Microforge heal only existing non-permanent injuries. Vesicle retains its recovered
          # 2400-tick / 0.55 pulse without nanite-EMP pause; Microforge keeps the newer D108
          # 2500-tick / 0.75 retune but human-form nanite EMP disruption suspends its pulse.
          implant_regen_source = Path('Source/WraithNaniteGravtech/Implants/WNGImplantSystems.cs').read_text(encoding='utf-8')
          for label, needle in (
              ('shared repairable-injury selector', 'WorstRepairableInjury(Pawn pawn)'),
              ('permanent-injury exclusion', '!x.IsPermanent()'),
              ('Vesicle regeneration comp properties', 'HediffCompProperties_ImplantRegeneration'),
              ('Vesicle regeneration comp', 'HediffComp_ImplantRegeneration'),
              ('configurable EMP pause', 'pauseDuringNaniteEMP'),
              ('nanite EMP state check', 'WNG_NaniteEMPDisruption'),
              ('Microforge D108 interval', 'RepairIntervalTicks = 2500'),
              ('Microforge D108 heal amount', 'HealPerPulse = 0.75f'),
          ):
              if needle not in implant_regen_source:
                  failures.append(f'Implant regeneration contract missing: {label}')
          for forbidden in ('RestorePart(', 'Resurrect(', 'ResurrectionUtility'):
              if forbidden in implant_regen_source:
                  failures.append(f'Implant regeneration exceeded retained injury-only boundary: {forbidden}')

          implant_defs_root = ET.fromstring(Path('Defs/HediffDefs/Hediffs_ImplantsCore.xml').read_text(encoding='utf-8'))
          implant_defs = {n.findtext('defName'): n for n in list(implant_defs_root) if n.findtext('defName')}
          vesicle = implant_defs.get('WNG_RegenerativeVesicle')
          if vesicle is None:
              failures.append('Regenerative Vesicle Hediff is missing')
          else:
              if vesicle.findtext('./stages/li/naturalHealingFactor') != '1.45':
                  failures.append('Regenerative Vesicle lost the newer native healing-factor layer')
              if vesicle.findtext('./stages/li/totalBleedFactor') != '0.75':
                  failures.append('Regenerative Vesicle lost the newer bleed-control layer')
              regen = next((n for n in vesicle.findall('./comps/li') if n.get('Class') == 'WraithNaniteGravtech.HediffCompProperties_ImplantRegeneration'), None)
              if regen is None:
                  failures.append('Regenerative Vesicle lost its retained active injury-repair pulse')
              else:
                  if regen.findtext('intervalTicks') != '2400':
                      failures.append('Regenerative Vesicle active repair interval regressed')
                  if regen.findtext('healAmount') != '0.55':
                      failures.append('Regenerative Vesicle active repair amount regressed')
                  if regen.findtext('pauseDuringNaniteEMP') != 'false':
                      failures.append('Regenerative Vesicle incorrectly became dependent on nanite EMP state')

          microforge = implant_defs.get('WNG_ReconstructionMicroforge')
          if microforge is None or microforge.findtext('hediffClass') != 'WraithNaniteGravtech.Hediff_ReconstructionMicroforge':
              failures.append('Reconstruction Microforge lost its current D108 repair owner')
          microforge_block = implant_regen_source.split('public sealed class Hediff_ReconstructionMicroforge', 1)[1] if 'public sealed class Hediff_ReconstructionMicroforge' in implant_regen_source else ''
          if 'WNGImplantRegenerationUtility.HasNaniteEmpDisruption(pawn)' not in microforge_block:
              failures.append('Reconstruction Microforge no longer pauses under human-form nanite EMP disruption')
          if 'WorstRepairableInjury(pawn)?.Heal(HealPerPulse)' not in microforge_block:
              failures.append('Reconstruction Microforge no longer uses the bounded shared injury-repair path')

          # Historical dormant Child's Toy artifact: rare physical acquisition must unfold into
          # the current dedicated Toy, not the obsolete ordinary Drone product. The artifact owns
          # only one-shot activation; native Mechanitor control and the existing Toy feral timer remain separate.
          dormant_toy_source = Path('Source/WraithNaniteGravtech/Replicators/DormantChildsToyArtifact.cs').read_text(encoding='utf-8')
          for label, needle in (
              ('artifact activation comp', 'CompDormantChildsToyArtifact'),
              ('save-persistent one-shot latch', 'Scribe_Values.Look(ref activationCommitted, "wngDormantChildsToyActivationCommitted", false)'),
              ('current Toy definition guard', 'toyKind.defName != "WNG_ChildsToy"'),
              ('player-faction Toy generation', 'PawnGenerator.GeneratePawn(toyKind, Faction.OfPlayer)'),
              ('physical placement before source cleanup', 'GenPlace.TryPlaceThing(toy, origin, map, ThingPlaceMode.Near)'),
              ('activation commit latch', 'activationCommitted = true;'),
              ('spent casing cleanup', 'parent.Destroy(DestroyMode.Vanish);'),
              ('rare artifact stock generator', 'StockGenerator_WNGRareChildsToyArtifact'),
              ('single-item trader stock', 'item.stackCount = 1;'),
          ):
              if needle not in dormant_toy_source:
                  failures.append(f'Dormant Child\'s Toy artifact contract missing: {label}')

          placement_i = dormant_toy_source.find('GenPlace.TryPlaceThing(toy, origin, map, ThingPlaceMode.Near)')
          latch_i = dormant_toy_source.find('activationCommitted = true;', placement_i + 1)
          cleanup_i = dormant_toy_source.find('parent.Destroy(DestroyMode.Vanish);', latch_i + 1)
          if not (placement_i >= 0 and latch_i > placement_i and cleanup_i > latch_i):
              failures.append('Dormant Child\'s Toy activation transaction no longer commits placement -> latch -> casing cleanup in order')
          for forbidden in (
              'PawnRelationDefOf.Overseer',
              'AssignPawnControlGroup',
              'WNG_ReplicatorDrone"',
          ):
              if forbidden in dormant_toy_source:
                  failures.append(f'Dormant Child\'s Toy artifact bypasses current Toy/Mechanitor semantics: {forbidden}')

          dormant_toy_defs = Path('Defs/ThingDefs/Things_DormantChildsToy.xml').read_text(encoding='utf-8')
          dormant_toy_root = ET.fromstring(dormant_toy_defs)
          dormant_toy = next((n for n in list(dormant_toy_root) if n.findtext('defName') == 'WNG_DormantChildsToy'), None)
          if dormant_toy is None:
              failures.append('Dormant Child\'s Toy ThingDef is missing')
          else:
              if dormant_toy.findtext('./comps/li/pawnKindDef') != 'WNG_ChildsToy':
                  failures.append('Dormant Child\'s Toy no longer activates into the current dedicated Toy')
              if dormant_toy.findtext('tradeability') != 'All':
                  failures.append('Dormant Child\'s Toy is no longer trader-sellable')
              if dormant_toy.findtext('stackLimit') != '1':
                  failures.append('Dormant Child\'s Toy is no longer a singular artifact')
              if dormant_toy.findtext('./statBases/MarketValue') != '950':
                  failures.append('Dormant Child\'s Toy historical provisional market value regressed')
              comp = dormant_toy.find('./comps/li')
              if comp is None or comp.get('Class') != 'WraithNaniteGravtech.CompProperties_DormantChildsToyArtifact':
                  failures.append('Dormant Child\'s Toy lost its current activation component')

          dormant_toy_patch = Path('Patches/WNG_RareChildsToyTraders.xml').read_text(encoding='utf-8')
          for label, needle in (
              ('Exotic orbital route', 'defName="Orbital_Exotic"'),
              ('Exotic caravan route', 'defName="Caravan_Outlander_Exotic"'),
              ('current artifact stock generator', 'StockGenerator_WNGRareChildsToyArtifact'),
              ('current artifact identity', '<thingDef>WNG_DormantChildsToy</thingDef>'),
              ('retained seven-percent chance', '<chance>0.07</chance>'),
          ):
              if needle not in dormant_toy_patch:
                  failures.append(f'Dormant Child\'s Toy rare-trader route missing: {label}')

          current_toy_defs = Path('Defs/ThingDefs/Race_ChildsToy.xml').read_text(encoding='utf-8')
          current_toy_source = Path('Source/WraithNaniteGravtech/Replicators/ChildsToy.cs').read_text(encoding='utf-8')
          current_toy_recipe = Path('Defs/RecipeDefs/Recipes_ChildsToy.xml').read_text(encoding='utf-8')
          for label, haystack, needle in (
              ('dedicated Toy PawnKind', current_toy_defs, '<defName>WNG_ChildsToy</defName>'),
              ('native Overseer state remains authority', current_toy_source, 'State == OverseerSubjectState.Overseen'),
              ('existing Toy feral conversion remains authority', current_toy_source, 'TryConvertToHostileDrone(false)'),
              ('normal gestation still produces the Toy', current_toy_recipe, '<WNG_ChildsToy>1</WNG_ChildsToy>'),
          ):
              if needle not in haystack:
                  failures.append(f'Dormant artifact restoration displaced current Child\'s Toy contract: {label}')

          # Existing ranged CE coverage must not regress. New ranged weapons may extend this list later.
          ce_text = '\n'.join(p.read_text(encoding='utf-8', errors='replace') for p in Path('Compatibility/CombatExtended').rglob('*.xml'))
          ranged = [
              'WNG_WraithStunStaff',
              'WNG_WraithStunner',
              'WNG_WraithCarbine',
              'WNG_WraithHeavyBioWeapon',
              'WNG_ReplicatorPulseCaster',
              'WNG_ReplicatorShieldDisruptor',
              'WNG_ReplicatorArtilleryCaster',
              'WNG_PrecursorPulseRifle',
              'WNG_RecoveredPrecursorPulseRifle',
              'WNG_NishtaCanister',
              'WNG_Gun_GoauldHeavyPlasmaCannon',
          ]
          missing = [name for name in ranged if name not in ce_text]
          if missing:
              failures.append('Missing inherited CE coverage: ' + ', '.join(missing))
          print(f'Inherited CE ranged coverage: {len(ranged) - len(missing)}/{len(ranged)}')

          # Restored hostile Asuran gate-strike lifecycle must remain bounded and exact-gate only.
          gate_strike = Path('Source/WraithNaniteGravtech/Asurans/AsuranGateStrikeMission.cs').read_text(encoding='utf-8')
          for label, needle in (
              ('map-level strike owner', 'MapComponent_AsuranGateStrikeMission'),
              ('exact deployed crew source', 'ingress.DeployedCrew'),
              ('bounded extraction deadline', 'ExtractionStartTicks = 3600'),
              ('high-value technology attack', 'JobDefOf.AttackStatic'),
              ('exact source-gate usability', 'WraithStargateHuntUtility.IsExactGateUsable'),
              ('world-pawn exact retreat', 'Find.WorldPawns.PassToWorld'),
              ('technology-theft ownership boundary', 'IsTechnologyTheftJob(pawn)'),
              ('module-carrier ownership boundary', 'if (HasVacuumModule(pawn))'),
          ):
              if needle not in gate_strike:
                  failures.append(f'Asuran gate-strike lifecycle contract missing: {label}')
          if 'TryFindRandomPawnExitCell' in gate_strike or 'OnEdge(map)' in gate_strike:
              failures.append('Asuran gate-strike lifecycle gained a forbidden map-edge extraction fallback')
          if 'GeneratePawn' in gate_strike:
              failures.append('Asuran gate-strike lifecycle creates replacement pawns instead of preserving exact deployed crew')

          # WNG family gravship hulls must recover Odyssey-style angled/corner topology.
          family_hull_layer = Path('Source/WraithNaniteGravtech/Gravships/SectionLayer_WNGFamilyGravshipHull.cs').read_text(encoding='utf-8')
          family_hull_defs = Path('Defs/Gravships/Gravship_FamilySystems.xml').read_text(encoding='utf-8')
          goauld_hull_defs = Path('Defs/Gravships/Gravship_Goauld.xml').read_text(encoding='utf-8')
          for label, haystack, needle in (
              ('family section layer', family_hull_layer, 'SectionLayer_WNGFamilyGravshipHull : SectionLayer'),
              ('Wraith hull recognition', family_hull_layer, 'WNG_OrganicGravshipHull'),
              ('Asuran hull recognition', family_hull_layer, 'WNG_PrecursorGravshipHull'),
              ('Goauld hull recognition', family_hull_layer, 'WNG_GoauldGravshipHull'),
              ('native full corner mask', family_hull_layer, 'AngledGravshipHull_northwest'),
              ('native partial diagonal mask', family_hull_layer, 'AngledGravshipHull_Partial_northwest'),
              ('gravship mask parity', family_hull_layer, 'ShaderDatabase.GravshipMaskMasked'),
              ('indoor mask parity', family_hull_layer, 'ShaderDatabase.IndoorMaskMasked'),
              ('Wraith linked straight hull', family_hull_defs, '<defName>WNG_OrganicGravshipHull</defName>'),
              ('Asuran linked straight hull', family_hull_defs, '<defName>WNG_PrecursorGravshipHull</defName>'),
              ('Goauld hull Def', goauld_hull_defs, '<defName>WNG_GoauldGravshipHull</defName>'),
          ):
              if needle not in haystack:
                  failures.append(f'WNG family gravship hull topology contract missing: {label}')
          if 'Harmony' in family_hull_layer or '== ThingDefOf.GravshipHull' in family_hull_layer:
              failures.append('WNG family hull topology must remain a separate family-aware layer, not a native hull patch/hard-code')

          # Live RimWorld 1.6 Def-load regressions found by the first af251cf playtest.
          live_bad_tokens = {
              'Defs/HediffDefs/Hediffs_HumanForm.xml': ('<GlobalWorkSpeed>',),
              'Defs/ThingDefs/Apparel_PrecursorRecovered.xml': ('<li>Accessories</li>',),
              'Defs/ThingDefs/Things_VacuumEnergy.xml': ('<FuelValue>',),
              'Defs/ThingDefs/Things_AncientControl.xml': ('<FuelValue>',),
              'Defs/ThingDefs/Things_ReplicatorSuppression.xml': ('<designationCategory>WNG_Architect</designationCategory>',),
              'Defs/RecipeDefs/Recipes_AsuranPatternReconstruction.xml': ('Apparel_ArmorCataphractHelmet',),
          }
          for live_path, forbidden_tokens in live_bad_tokens.items():
              live_text = Path(live_path).read_text(encoding='utf-8')
              for forbidden in forbidden_tokens:
                  if forbidden in live_text:
                      failures.append(f'Live RimWorld 1.6 Def-load regression returned in {live_path}: {forbidden}')
          # Second live RimWorld 1.6 load regression set (0636cbdb playtest).
          for ability_path in Path('Defs/AbilityDefs').rglob('*.xml'):
              ability_text = ability_path.read_text(encoding='utf-8')
              if '<AbilityDef ParentName="AbilityBase">' in ability_text:
                  failures.append(f'Invalid RimWorld 1.6 AbilityBase inheritance returned in {ability_path}')
          for xml_path in Path('Defs').rglob('*.xml'):
              xml_text = xml_path.read_text(encoding='utf-8')
              if '<graphicClass>Graphic_Linked</graphicClass>' in xml_text:
                  failures.append(f'Bare Graphic_Linked returned in {xml_path}; declare the inner graphic and linkType instead')
          goauld_text = Path('Defs/Gravships/Gravship_Goauld.xml').read_text(encoding='utf-8')
          if '<turretTopGraphicPath>' in goauld_text:
              failures.append('Obsolete turretTopGraphicPath returned to Goauld gravship XML')
          xenotype_text = Path('Defs/XenotypeDefs/Xenotypes_HumanForm.xml').read_text(encoding='utf-8')
          for xenotype_name in ('WNG_NanitePrecursor', 'WNG_HumanFormReplicator'):
              start = xenotype_text.find(f'<defName>{xenotype_name}</defName>')
              end = xenotype_text.find('</XenotypeDef>', start)
              if start < 0 or end < 0 or '<iconPath>' not in xenotype_text[start:end]:
                  failures.append(f'{xenotype_name} is missing its required XenotypeDef iconPath')
          iratus_text = Path('Defs/ThingDefs/Race_Iratus.xml').read_text(encoding='utf-8')
          if '<anomalyKnowledge>1.25</anomalyKnowledge>' in iratus_text and '<minMonolithLevelForStudy>1</minMonolithLevelForStudy>' not in iratus_text:
              failures.append('Iratus anomalyKnowledge requires nonzero minMonolithLevelForStudy in RimWorld 1.6')
          # Live DrugPolicy safety: every WNG medical drug that enters DrugPolicy must own CompProperties_Drug.
          for live_drug_path, live_drug_name in (
              ('Defs/ThingDefs/Things_HoffanSerum.xml', 'WNG_HoffanSerum'),
              ('Defs/ThingDefs/Things_FeedingResistance.xml', 'WNG_VitalResistanceDose'),
          ):
              live_drug_text = Path(live_drug_path).read_text(encoding='utf-8')
              if '<drugCategory>' not in live_drug_text or 'CompProperties_Drug' not in live_drug_text:
                  failures.append(f'{live_drug_name} can enter DrugPolicy without CompProperties_Drug')
          if failures:
              print('\nVALIDATION FAILURES:')
              for failure in failures:
                  print(' - ' + failure)
              sys.exit(1)

          print('D108 static integration validation: PASS')
          PY
