              ('retained base chance', rep_gate_defs, '<baseChance>0.02</baseChance>'),
              ('retained earliest day', rep_gate_defs, '<earliestDay>22</earliestDay>'),
              ('primitive Drone entry', rep_gate_assault, 'WNG_ReplicatorDrone'),
              ('shared autonomous domain', rep_gate_assault, 'AssignAutonomousDomain(domainId)'),
              ('domain-prefixed identity', rep_gate_assault, '"gate:"'),
              ('live hostile cap', rep_gate_assault, 'HostilePopulationCap(ext)'),
              ('buffer reservation accounting', rep_gate_assault, 'corridorCommittedCount'),
              ('exact gate revalidation', rep_gate_assault, 'resolved == exactGate'),
              ('CatCraft-owned arrival commit', rep_gate_assault, 'mode.Worker.Arrive(pawns, arrivalParms)'),
              ('two follow-up waves', rep_gate_assault, 'public const int FollowupWaves = 2'),
              ('retained 9000-tick redial cadence', rep_gate_assault, 'public const int FollowupDelayTicks = 9000'),
              ('bounded retry window', rep_gate_assault, 'public const int FollowupRetryWindowTicks = 30000'),
              ('same-gate follow-up guard', rep_gate_assault, 'IsExactGateStillUsable'),
              ('save-persistent source gate', rep_gate_assault, 'wngReplicatorGateAssaultSourceGate'),
              ('save-persistent domain', rep_gate_assault, 'wngReplicatorGateAssaultDomain'),
          ):
              if needle not in haystack:
                  failures.append(f'Replicator Stargate-assault contract missing: {label}')
          for forbidden in (
              'receiveBuffer',
              'ReceiveBuffer',
              'ClearAndDestroyContents',
              'StargatesMod.',
              'SetFaction(',
              'WNG_ReplicatorHunter',
              'WNG_ReplicatorBulwark',
              'WNG_ReplicatorSiegeMass',
          ):
              if forbidden in rep_gate_assault:
                  failures.append(f'Replicator Stargate assault crossed current ownership/primitive-entry boundary: {forbidden}')

          # Ancient control-chair networking is retained gameplay: an occupied 72-cell chair
          # may command allied WNG shields and authorize Jumper drone armament, but cloak/sensors
          # still require a compatible pawn physically aboard the Jumper.
          ancient_network = Path('Source/WraithNaniteGravtech/Ancient/AncientControlNetwork.cs').read_text(encoding='utf-8')
          jumper_systems = Path('Source/WraithNaniteGravtech/Shuttles/PuddleJumperSystems.cs').read_text(encoding='utf-8')
          ancient_control_def = Path('Defs/ThingDefs/Things_AncientControl.xml').read_text(encoding='utf-8')
          jumper_def = Path('Defs/ThingDefs/Shuttle_PuddleJumper.xml').read_text(encoding='utf-8')
          armament_block = jumper_systems.split('public sealed class CompPuddleJumperDroneArmament', 1)[1].split('public sealed class CompProperties_PuddleJumperSystems', 1)[0] if 'public sealed class CompPuddleJumperDroneArmament' in jumper_systems else ''
          systems_block = jumper_systems.split('public sealed class CompPuddleJumperSystems', 1)[1] if 'public sealed class CompPuddleJumperSystems' in jumper_systems else ''
          for label, haystack, needle in (
              ('72-cell chair property', ancient_network, 'public float networkRadius = 72f;'),
              ('72-cell chair Def', ancient_control_def, '<networkRadius>72</networkRadius>'),
              ('active network query', ancient_network, 'public static bool HasActiveControlFor(Thing thing)'),
              ('same-faction chair requirement', ancient_network, 'candidate.Faction != thing.Faction'),
              ('active occupied chair requirement', ancient_network, '!chair.NetworkActive'),
              ('network Jumper discovery', ancient_network, '"WNG_PuddleJumper"'),
              ('standard Asuran shield network identity', ancient_network, '"WNG_PrecursorShieldEmitter"'),
              ('Ancient vacuum shield network identity', ancient_network, '"WNG_AncientVacuumShieldEmitter"'),
              ('native flick switching', ancient_network, 'flick.SwitchIsOn = enabled;'),
              ('Jumper dual neural-control path', armament_block, 'AncientControlNetworkUtility.HasActiveControlFor(parent)'),
              ('onboard armament path preserved', armament_block, 'PuddleJumperControlUtility.HasCompatiblePawnAboard(parent)'),
              ('armed-suite inspect state', armament_block, 'Jumper systems tier: armed command suite'),
              ('Jumper Def documents remote armament only', jumper_def, 'launcher can be commanded either by an ATA-compatible pawn aboard or by an occupied allied Ancient control chair'),
          ):
              if needle not in haystack:
                  failures.append(f'Ancient control-network contract missing: {label}')
          if 'HasNeuralControl()' in systems_block:
              failures.append('Puddle Jumper cloak/sensor systems incorrectly inherited remote chair authorization')
          if systems_block.count('PuddleJumperControlUtility.HasCompatiblePawnAboard(parent)') < 4:
              failures.append('Puddle Jumper cloak/sensor/hostile-ingress paths no longer consistently require a compatible pawn aboard')
          if 'AncientControlNetworkUtility.HasActiveControlFor(parent)' in systems_block:
              failures.append('Ancient control chair is authorizing cloak/sensors instead of only direct drone armament')

          # Child's Toy proximity thought: restore the historical +3 colony mood effect,
          # but bind it to the current real controlled Toy rather than the old ordinary-Drone mismatch.
          toy_thought = Path('Source/WraithNaniteGravtech/Replicators/ThoughtWorker_ChildsToyNearby.cs').read_text(encoding='utf-8')
          toy_thought_def = Path('Defs/ThoughtDefs/Thoughts_Replicator.xml').read_text(encoding='utf-8')
          for label, haystack, needle in (
              ('historical thought identity', toy_thought_def, '<defName>WNG_ChildsToyNearby</defName>'),
              ('thought worker', toy_thought_def, 'ThoughtWorker_ChildsToyNearby'),
              ('old +3 mood effect', toy_thought_def, '<baseMoodEffect>3</baseMoodEffect>'),
              ('current Toy identity', toy_thought, 'WNG_ChildsToy'),
              ('10-cell radius', toy_thought, 'RadiusSquared = 100f'),
              ('active Overseer state', toy_thought, 'OverseerSubjectState.Overseen'),
              ('real overseer requirement', toy_thought, 'toy.GetOverseer() == null'),
          ):
              if needle not in haystack:
                  failures.append(f"Child's Toy thought contract missing: {label}")
          if 'WNG_ReplicatorDrone' in toy_thought:
              failures.append("Child's Toy thought regressed to the historical ordinary-Drone mismatch")
          if 'IsColonyMechPlayerControlled' in toy_thought:
              failures.append("Child's Toy thought uses the obsolete generic mech check instead of the current Toy overseer contract")

          # Existing ranged CE coverage must not regress. New ranged weapons may extend this list later.
          ce_text = '\n'.join(p.read_text(encoding='utf-8', errors='replace') for p in Path('Compatibility/CombatExtended').rglob('*.xml'))
          ranged = [
              'WNG_WraithStunStaff',
              'WNG_WraithStunner',
              'WNG_WraithCarbine',
              'WNG_WraithHeavyBioWeapon',
              'WNG_ReplicatorPulseCaster',
              'WNG_ReplicatorShieldDisruptor',
              'WNG_ReplicatorArtilleryCaster',
              'WNG_PrecursorPulseRifle',
              'WNG_RecoveredPrecursorPulseRifle',
              'WNG_NishtaCanister',
              'WNG_Gun_GoauldHeavyPlasmaCannon',
          ]
          missing = [name for name in ranged if name not in ce_text]
          if missing:
              failures.append('Missing inherited CE coverage: ' + ', '.join(missing))
          print(f'Inherited CE ranged coverage: {len(ranged) - len(missing)}/{len(ranged)}')

          if failures:
              print('\nVALIDATION FAILURES:')
              for failure in failures:
                  print(' - ' + failure)
              sys.exit(1)

          print('D108 static integration validation: PASS')
          PY
