name: D108 Static Validation

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate current source contracts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys
          import xml.etree.ElementTree as ET

          root = Path('.')
          xml_files = sorted(root.rglob('*.xml'))
          cs_files = sorted(root.rglob('*.cs'))
          failures = []

          # Inventory is reported, not frozen. D107 was a checkpoint, not a ceiling.
          print(f'Current inventory: {len(xml_files)} XML, {len(cs_files)} C#')

          # Every XML document must remain well-formed.
          for path in xml_files:
              try:
                  ET.parse(path)
              except Exception as exc:
                  failures.append(f'XML parse failure {path}: {exc}')

          # Restored retained Wraith Enthrall: exact pawn -> native slave state, downed OR prisoner.
          wraith_source = Path('Source/WraithNaniteGravtech/Wraith/WraithLifeDrain.cs').read_text(encoding='utf-8')
          wraith_abilities = Path('Defs/AbilityDefs/Abilities_WraithLifeForce.xml').read_text(encoding='utf-8')
          wraith_genes = Path('Defs/GeneDefs/Genes_Wraith.xml').read_text(encoding='utf-8')
          for label, haystack, needle in (
              ('Enthrall comp', wraith_source, 'CompAbilityEffect_Enthrall'),
              ('native slave transition', wraith_source, 'GenGuest.TryEnslavePrisoner(caster, victim)'),
              ('downed-or-prisoner target rule', wraith_source, '(victim.Downed || victim.IsPrisoner)'),
              ('Enthrall AbilityDef', wraith_abilities, '<defName>WNG_Enthrall</defName>'),
              ('Wraith telepathy grants Enthrall', wraith_genes, '<li>WNG_Enthrall</li>'),
          ):
              if needle not in haystack:
                  failures.append(f'Wraith Enthrall contract missing: {label}')

          # D107 Quiet-Lattice/CatCraft transaction contracts must survive later growth.
          quiet_path = Path('Source/WraithNaniteGravtech/Compatibility/QuietLatticeStargateVisit.cs')
          quiet = quiet_path.read_text(encoding='utf-8')
          incident_part = quiet.split('public sealed class MapComponent_QuietLatticeStargateVisit', 1)[0]
          required_quiet = {
              'CatCraft class guard': 'StargatesMod.Building_Stargate',
              'home-map thing-grid verification': 'ThingsListAtFast(spawnCenter)',
              'delayed visit registration': 'TryBeginVisit(visitors, duration)',
              'native required-pawn contract': 'requiredPawns',
              'boarding failure check': 'TryTakeOrderedJob(board, JobTag.Misc)',
              'boarding rollback': 'shuttle.requiredPawns.Remove(pawn)',
              'native shuttle removal': 'info.RemoveShuttle()',
              'world-pawn duplicate guard': 'Find.WorldPawns.Contains(pawn)',
          }
          for label, needle in required_quiet.items():
              if needle not in quiet:
                  failures.append(f'Quiet-Lattice contract missing: {label}')
          if 'LordMaker.MakeNewLord' in incident_part:
              failures.append('Visitor Lord is still created in the incident before CatCraft emergence')
          if 'ClearAndDestroyContents' in quiet:
              failures.append('Quiet-Lattice departure still uses broad holder destruction')
          if 'EligibleForCourier(pawn) && !pawn.Downed' not in quiet:
              failures.append('Downed visitors can still become native shuttle requirements')
          if 'shuttle.requiredPawns.Any(p => p == null || !held.Contains(p))' not in quiet:
              failures.append('Courier launch lacks an exact required-pawn-in-holder boundary')

          # Hidden NPC Puddle Jumper remains a native non-player Odyssey shuttle sibling.
          shuttle_path = Path('Defs/ThingDefs/Shuttle_PuddleJumper_NPC.xml')
          shuttle_root = ET.parse(shuttle_path).getroot()
          ship = None
          npc = None
          for node in shuttle_root:
              dn = node.findtext('defName')
              if dn == 'WNG_Ship_PuddleJumperNPC':
                  ship = node
              elif dn == 'WNG_PuddleJumper_NPC':
                  npc = node
          if ship is None or ship.findtext('playerShuttle') != 'false':
              failures.append('NPC Puddle Jumper TransportShipDef is not playerShuttle=false')
          if npc is None or npc.findtext('thingClass') != 'Building_PassengerShuttle':
              failures.append('NPC Puddle Jumper is not a native Building_PassengerShuttle')
          if npc is None or npc.findtext('building/neverBuildable') != 'true':
              failures.append('NPC Puddle Jumper is not hidden/neverBuildable')
          npc_text = shuttle_path.read_text(encoding='utf-8')
          for comp in ('CompProperties_Shuttle', 'CompProperties_Launchable', 'CompProperties_Transporter', 'CompProperties_Refuelable'):
              if comp not in npc_text:
                  failures.append(f'NPC Puddle Jumper missing native component {comp}')
          if '<li>WNG_AsuranNaniteSlurry</li>' not in npc_text:
              failures.append('NPC Puddle Jumper no longer uses the retained Asuran nanite-slurry fuel family')
          if 'WNG_VacuumEnergyModule' in npc_text:
              failures.append('NPC Puddle Jumper has regressed to superseded vacuum-energy-module fuel')

          # Nish'ta bridge remains optional-CE and WNG-owned in vanilla.
          nishta = Path('Source/WraithNaniteGravtech/Goauld/NishtaConditioning.cs').read_text(encoding='utf-8')
          for needle in (
              'Projectile_NishtaCanister : Projectile_Explosive',
              'CompProperties_NishtaExposure',
              'MapComponent_NishtaExposureQueue',
              'ResolveOptionalProjectileLanded',
              'SumBlindSmoke(previousMap, center, radius)',
              'now + 1',
          ):
              if needle not in nishta:
                  failures.append(f"Nish'ta bridge contract missing: {needle}")

          # Ha'tak CE remains ONAC-guarded and ammo-less.
          goauld_patch = Path('Compatibility/CombatExtended/Patches/Weapons_Goauld.xml').read_text(encoding='utf-8')
          goauld_proj = Path('Compatibility/CombatExtended/Defs/Projectiles_Goauld.xml').read_text(encoding='utf-8')
          for needle in (
              '<mods><li>ONAC</li></mods>',
              '<defName>WNG_Gun_GoauldHeavyPlasmaCannon</defName>',
              '<verbClass>CombatExtended.Verb_ShootCE</verbClass>',
              '<defaultProjectile>WNG_CE_Projectile_GoauldHeavyPlasma</defaultProjectile>',
              '<thingClass>CombatExtended.Building_TurretGunCE</thingClass>',
          ):
              if needle not in goauld_patch:
                  failures.append(f"Ha'tak CE contract missing: {needle}")
          if '<AmmoUser>' in goauld_patch:
              failures.append("Ha'tak/Nish'ta patch unexpectedly introduces an AmmoUser economy")
          if 'WNG_CE_Projectile_GoauldHeavyPlasma' not in goauld_proj or 'CombatExtended.ProjectileCE_Explosive' not in goauld_proj:
              failures.append("Ha'tak CE projectile definition is incomplete")

          # Human-form starts retain stable combat equipment plus the damaged research specimen.
          scenarios = Path('Defs/ScenarioDefs/Scenarios_WNG.xml').read_text(encoding='utf-8')
          nanite_research = Path('Defs/ResearchProjectDefs/Research_AsuranSovereign.xml').read_text(encoding='utf-8')
          if scenarios.count('<thingDef>WNG_PrecursorPulseRifle</thingDef><count>2</count>') < 2:
              failures.append('Human-form starts no longer retain two stable precursor pulse rifles')
          if scenarios.count('<thingDef>WNG_RecoveredPrecursorPulseRifle</thingDef><count>1</count>') != 2:
              failures.append('Human-form starts must each carry exactly one recovered precursor-rifle analysis specimen')
          nanite_block = nanite_research.split('<defName>WNG_NaniteAnalysis</defName>', 1)[1].split('</ResearchProjectDef>', 1)[0] if '<defName>WNG_NaniteAnalysis</defName>' in nanite_research else ''
          if '<requiredAnalyzed>' not in nanite_block or '<li>WNG_RecoveredPrecursorPulseRifle</li>' not in nanite_block:
              failures.append('Nanite Analysis is no longer gated by the recovered precursor-rifle specimen')

          # Retained Asuran pattern library must preserve the broadened explicit military catalogue.
          pattern_source = Path('Source/WraithNaniteGravtech/Asurans/AsuranTechnologyPatternLibrary.cs').read_text(encoding='utf-8')
          pattern_recipes = Path('Defs/RecipeDefs/Recipes_AsuranPatternReconstruction.xml').read_text(encoding='utf-8')
          required_patterns = {
              'Gun_AssaultRifle': 'WNG_ReconstructAssaultRifle',
              'Gun_SniperRifle': 'WNG_ReconstructSniperRifle',
              'Gun_LMG': 'WNG_ReconstructLMG',
              'Gun_ChainShotgun': 'WNG_ReconstructChainShotgun',
              'Apparel_ArmorRecon': 'WNG_ReconstructReconArmor',
              'Apparel_ArmorCataphract': 'WNG_ReconstructCataphractArmor',
              'Apparel_ArmorHelmetCataphract': 'WNG_ReconstructCataphractHelmet',
          }
          for specimen, recipe in required_patterns.items():
              if specimen not in pattern_source or recipe not in pattern_source:
                  failures.append(f'Asuran pattern catalogue missing {specimen} -> {recipe}')
              if f'<defName>{recipe}</defName>' not in pattern_recipes:
                  failures.append(f'Asuran pattern reconstruction recipe missing: {recipe}')
          if pattern_recipes.count('<workerClass>WraithNaniteGravtech.RecipeWorker_AsuranPatternLocked</workerClass>') < len(required_patterns):
              failures.append('Expanded Asuran pattern recipes are not consistently archive-gated')

          # Quest-driven Wraith subfaction politics must alter native NPC-to-NPC goodwill,
          # exclude permanent-enemy Sable Brood, and require a real biomass commitment.
          politics_quest = Path('Source/WraithNaniteGravtech/Wraith/WraithInterHiveMediation.cs').read_text(encoding='utf-8')
          politics_def = Path('Defs/QuestScriptDefs/Quests_WraithPolitics.xml').read_text(encoding='utf-8')
          for label, needle in (
              ('mediation quest Def', '<defName>WNG_WraithInterHiveMediation</defName>'),
              ('mediation quest root', 'QuestNode_Root_WraithInterHiveMediation'),
          ):
              if needle not in politics_def:
                  failures.append(f'Wraith mediation contract missing: {label}')
          for label, needle in (
              ('Cinder Court participation', 'WraithLineageUtility.CinderCourtDefName'),
              ('Veiled Hive participation', 'WraithLineageUtility.VeiledHiveDefName'),
              ('Pale Covenant participation', 'WraithLineageUtility.PaleCovenantDefName'),
              ('Sable Brood exclusion', 'WraithLineageUtility.SableBroodDefName'),
              ('finite biomass cost', 'public const int BiomassCost = 60'),
              ('native goodwill mutation', 'TryAffectGoodwillWith'),
              ('biomass consumption', 'WraithHiveEcologyUtility.TryConsumeResource'),
              ('failed-commit refund', 'WraithHiveEcologyUtility.SpawnResource'),
              ('goodwill ceiling', 'public const int GoodwillCeiling = 80'),
          ):
              if needle not in politics_quest:
                  failures.append(f'Wraith mediation contract missing: {label}')

          # Optional CatCraft hostile Asuran gate-Jumper ingress must remain dependency-safe:
          # CatCraft resolves the exact gate, WNG stages only its own physical craft/crew beside it.
          hostile_gate = Path('Source/WraithNaniteGravtech/Compatibility/HostileAsuranGateJumper.cs').read_text(encoding='utf-8')
          hostile_gate_def = Path('Defs/IncidentDefs/Incidents_HostileAsuranStargate.xml').read_text(encoding='utf-8')
          jumper_systems = Path('Source/WraithNaniteGravtech/Shuttles/PuddleJumperSystems.cs').read_text(encoding='utf-8')
          for label, haystack, needle in (
              ('hostile gate-Jumper incident Def', hostile_gate_def, '<defName>WNG_HostileAsuranGateJumper</defName>'),
              ('hostile gate-Jumper worker', hostile_gate_def, 'IncidentWorker_HostileAsuranGateJumper'),
              ('CatCraft-owned arrival resolver', hostile_gate, 'mode.Worker.TryResolveRaidSpawnCenter(probe)'),
              ('resolved home-map gate class check', hostile_gate, 'QuietLatticeStargateVisitUtility.StargateThingClassName'),
              ('exact hostile commander', hostile_gate, 'WNG_PrecursorCommander'),
              ('exact hostile soldiers', hostile_gate, 'WNG_PrecursorSoldier'),
              ('real NPC Jumper craft', hostile_gate, 'WNG_PuddleJumper_NPC'),
              ('finite hostile cloak entry point', jumper_systems, 'BeginHostileIngressCloak'),
              ('bounded hostile cloak end tick', jumper_systems, 'hostileIngressCloakUntilTick'),
              ('transactional crew drop', hostile_gate, 'transporter.innerContainer.TryDrop'),
              ('crew deployment rollback', hostile_gate, 'transporter.innerContainer.TryAdd'),
              ('native hostile assault Lord', hostile_gate, 'LordJob_AssaultColony'),
          ):
              if needle not in haystack:
                  failures.append(f'Hostile Asuran gate-Jumper contract missing: {label}')
          if 'StargatesMod.' in hostile_gate:
              failures.append('Hostile Asuran gate-Jumper source has a compile-time CatCraft type/name dependency instead of using the existing string-guarded bridge')
          for forbidden in ('receiveBuffer', 'ReceiveBuffer', 'ClearAndDestroyContents'):
              if forbidden in hostile_gate:
                  failures.append(f'Hostile Asuran gate-Jumper source touches forbidden CatCraft/holder internals: {forbidden}')
          for comp in ('CompProperties_PuddleJumperSystems', 'CompProperties_HostileGateJumperIngress'):
              if comp not in npc_text:
                  failures.append(f'NPC Puddle Jumper missing hostile gate-ingress component {comp}')

          # Physical hostile-Asuran vacuum-module theft must end in a real carrier withdrawal.
          # Gate-arrived operatives remain bound to their exact source gate; ordinary raids use the edge.
          asuran_theft = Path('Source/WraithNaniteGravtech/Asurans/AsuranHostileTechnologyTheft.cs').read_text(encoding='utf-8')
          for label, haystack, needle in (
              ('exact deployed gate crew persistence', hostile_gate, 'wngHostileGateJumperDeployedCrew'),
              ('gate source exposure', hostile_gate, 'public Thing SourceGate => sourceGate'),
              ('deployed crew exposure', hostile_gate, 'public IEnumerable<Pawn> DeployedCrew'),
              ('save-safe ingress record', asuran_theft, 'AsuranGateIngressRecord'),
              ('module carrier detection', asuran_theft, 'FirstOrDefault(HasVacuumModule)'),
              ('carrier handled before other theft', asuran_theft, 'DirectModuleCarrierExtraction(map, moduleCarrier)'),
              ('exact gate-source capture', asuran_theft, 'ingress.DeployedCrew'),
              ('same-gate availability check', asuran_theft, 'WraithStargateHuntUtility.IsExactGateUsable'),
              ('ordinary edge retreat', asuran_theft, 'CellFinder.TryFindRandomPawnExitCell'),
              ('physical pawn despawn', asuran_theft, 'carrier.DeSpawn(DestroyMode.Vanish)'),
              ('exact world-pawn transfer', asuran_theft, 'Find.WorldPawns.PassToWorld'),
              ('failed withdrawal respawn rollback', asuran_theft, 'GenSpawn.Spawn'),
              ('gate ingress save state', asuran_theft, 'wngAsuranGateIngressRecords'),
              ('one-shot seizure latch', asuran_theft, '!moduleCompletedMapIds.Contains(map.uniqueID)'),
          ):
              if needle not in haystack:
                  failures.append(f'Asuran vacuum-module extraction contract missing: {label}')
          carrier_idx = asuran_theft.find('Pawn moduleCarrier = hostileAsurans.FirstOrDefault(HasVacuumModule)')
          loadout_idx = asuran_theft.find('PrepareLaterRaidLoadouts(map, hostileAsurans)')
          pattern_idx = asuran_theft.find('TryMaintainOrAssignPatternTheft(map, hostileAsurans)')
          if carrier_idx < 0 or loadout_idx < 0 or pattern_idx < 0 or carrier_idx > loadout_idx or carrier_idx > pattern_idx:
              failures.append('Asuran physical module carrier is no longer prioritised before stolen-pattern/loadout work')
          gate_route_block = asuran_theft.split('if (gateRecord != null)', 1)[1].split('// Ordinary hostile Asurans did not arrive', 1)[0] if 'if (gateRecord != null)' in asuran_theft else ''
          if 'TryFindRandomPawnExitCell' in gate_route_block:
              failures.append('Gate-arrived Asuran vacuum-module carrier gained a forbidden map-edge fallback instead of remaining bound to the exact source gate')
          for source_name, haystack in (('Asuran module extraction', asuran_theft), ('hostile Asuran gate ingress', hostile_gate)):
              if 'StargatesMod.' in haystack:
                  failures.append(f'{source_name} acquired a compile-time CatCraft dependency')
              for forbidden in ('receiveBuffer', 'ReceiveBuffer', 'ClearAndDestroyContents'):
                  if forbidden in haystack:
                      failures.append(f'{source_name} touches forbidden CatCraft/holder internals: {forbidden}')

          # Strategic Wraith Stargate hunt / exact-gate control objective (#105/#108).
          wraith_gate = Path('Source/WraithNaniteGravtech/Compatibility/WraithStargateHunt.cs').read_text(encoding='utf-8')
          gate_objective = Path('Source/WraithNaniteGravtech/Compatibility/WNGGateControlObjective.cs').read_text(encoding='utf-8')
          wraith_gate_def = Path('Defs/IncidentDefs/Incidents_WraithStargate.xml').read_text(encoding='utf-8')
          for label, haystack, needle in (
              ('Wraith Stargate hunt incident', wraith_gate_def, '<defName>WNG_WraithStargateHunt</defName>'),
              ('CatCraft-owned gate resolution', wraith_gate, 'mode.Worker.TryResolveRaidSpawnCenter'),
              ('exact gate identity', wraith_gate, 'resolved == exactGate'),
              ('existing Dart culling support', wraith_gate, 'MapComponent_WraithDartCulling'),
              ('bounded reinforcement redial', wraith_gate, 'ReinforcementWindowTicks'),
              ('same-gate reinforcement check', wraith_gate, 'IsExactGateUsable(map, sourceGate, faction)'),
              ('same-gate fast extraction', wraith_gate, 'DirectToGate()'),
              ('blocked-gate fallback delay', wraith_gate, 'BlockedGateFallbackTicks'),
              ('conventional edge fallback', wraith_gate, 'DirectToMapEdge()'),
              ('exact hostile pawn preservation on exit', wraith_gate, 'Find.WorldPawns.PassToWorld'),
              ('gate objective component', gate_objective, 'MapComponent_WNGGateControlObjective'),
              ('native alert surface', gate_objective, 'Alert_WNGGateControlObjective'),
              ('objective exact gate state', gate_objective, 'ExactGateUsable'),
              ('objective hunt capture progress', gate_objective, 'hunt?.Captures'),
              ('objective reinforcement state', gate_objective, 'ReinforcementPending'),
          ):
              if needle not in haystack:
                  failures.append(f'Wraith Stargate hunt/control contract missing: {label}')
          for source_name, haystack in (('Wraith hunt', wraith_gate), ('gate objective', gate_objective)):
              if 'StargatesMod.' in haystack:
                  failures.append(f'{source_name} has a compile-time CatCraft dependency instead of using the current string-guarded bridge')
              for forbidden in ('receiveBuffer', 'ReceiveBuffer', 'ClearAndDestroyContents'):
                  if forbidden in haystack:
                      failures.append(f'{source_name} touches forbidden CatCraft/holder internals: {forbidden}')

          # Player same-gate Wraith pursuit (#126) must preserve exact pawns and current custody ownership.
          pursuit = Path('Source/WraithNaniteGravtech/Compatibility/WraithGatePursuit.cs').read_text(encoding='utf-8')
          custody = Path('Source/WraithNaniteGravtech/Wraith/WraithCullingCustody.cs').read_text(encoding='utf-8')
          for label, haystack, needle in (
              ('pursuit map component', pursuit, 'MapComponent_WraithGatePursuit'),
              ('current float-menu provider API', pursuit, 'public override IEnumerable<FloatMenuOption> GetOptionsFor'),
              ('two-person minimum', pursuit, 'MinimumTeamSize = 2'),
              ('four-person maximum', pursuit, 'MaximumTeamSize = 4'),
              ('exact off-map player pawn transfer', pursuit, 'Find.WorldPawns.PassToWorld'),
              ('exact player pawn return', pursuit, 'Find.WorldPawns.RemovePawn'),
              ('same-gate return check', pursuit, 'WraithStargateHuntUtility.IsExactGateUsable'),
              ('conventional fallback return', pursuit, 'ReturnFallbackDelayTicks'),
              ('current custody release seam', pursuit, 'TryReleasePursuitCaptive'),
              ('transactional custody release', custody, 'public bool TryReleasePursuitCaptive'),
              ('rescue-site exclusion', custody, 'r.rescueSiteId < 0'),
              ('custody rollback', custody, 'custody.TryAdd(pawn, false)'),
              ('hunt opens pursuit on real gate exit', wraith_gate, 'TryOpenPursuitWindow();'),
              ('single pursuit latch', wraith_gate, 'pursuitWindowOpened'),
              ('physical Dart captive IDs', wraith_gate, 'transporter.innerContainer.OfType<Pawn>()'),
              ('current custody captive IDs', wraith_gate, 'WraithCullingCustodyRegistry'),
          ):
              if needle not in haystack:
                  failures.append(f'Wraith same-gate pursuit contract missing: {label}')
          if 'StargatesMod.' in pursuit:
              failures.append('Wraith pursuit has a compile-time CatCraft dependency')
          for forbidden in ('receiveBuffer', 'ReceiveBuffer', 'ClearAndDestroyContents'):
              if forbidden in pursuit:
                  failures.append(f'Wraith pursuit touches forbidden CatCraft/holder internals: {forbidden}')

          # Neutral Wraith Stargate diplomatic traffic (#129) must use CatCraft's own buffered
          # arrival and delay Lord creation until every surviving exact envoy has emerged.
          wraith_envoy = Path('Source/WraithNaniteGravtech/Compatibility/WraithStargateDiplomacy.cs').read_text(encoding='utf-8')
          wraith_envoy_def = Path('Defs/IncidentDefs/Incidents_WraithStargateDiplomacy.xml').read_text(encoding='utf-8')
          envoy_incident = wraith_envoy.split('public sealed class IncidentWorker_WraithStargateDiplomaticEnvoy', 1)[1] if 'public sealed class IncidentWorker_WraithStargateDiplomaticEnvoy' in wraith_envoy else ''
          for label, haystack, needle in (
              ('envoy incident Def', wraith_envoy_def, '<defName>WNG_WraithStargateDiplomaticEnvoy</defName>'),
              ('Veiled Hive eligibility', wraith_envoy, 'WNG_WraithVeiledHive'),
              ('Pale Covenant eligibility', wraith_envoy, 'WNG_WraithPaleCovenant'),
              ('CatCraft arrival worker', wraith_envoy, 'mode.Worker.Arrive(visitors, parms)'),
              ('pre-arrival exact pawn tracking', wraith_envoy, 'component.TryPrepare('),
              ('home-map gate verification', wraith_envoy, 'IsResolvedHomeMapStargate'),
              ('delayed emergence boundary', wraith_envoy, 'emerged.Count != visitors.Count'),
              ('native visitor Lord', wraith_envoy, 'LordJob_VisitColony'),
              ('hostility-change reuse of same envoys', wraith_envoy, 'LordJob_AssaultColony'),
              ('no free reward statement', wraith_envoy, 'arrival grants no goodwill'),
          ):
              if needle not in haystack:
                  failures.append(f'Wraith Stargate envoy contract missing: {label}')
          if wraith_envoy.find('component.TryPrepare(') > wraith_envoy.find('mode.Worker.Arrive(visitors, parms)'):
              failures.append('Wraith Stargate envoy no longer registers exact pawns before CatCraft arrival ownership')
          if 'TryAffectGoodwillWith' in wraith_envoy or 'ChangeGoodwill' in wraith_envoy:
              failures.append('Wraith Stargate envoy grants/mutates goodwill instead of leaving ordinary diplomacy authoritative')
          eligible_block = wraith_envoy.split('private static readonly string[] EligibleFactionDefNames', 1)[1].split('};', 1)[0] if 'private static readonly string[] EligibleFactionDefNames' in wraith_envoy else ''
          if 'WNG_WraithSableBrood' in eligible_block or 'WNG_WraithCinderCourt' in eligible_block:
              failures.append('Wraith Stargate envoy eligibility has expanded beyond the retained Veiled/Pale peaceful envoy pool')
          for forbidden in ('receiveBuffer', 'ReceiveBuffer', 'ClearAndDestroyContents'):
              if forbidden in wraith_envoy:
                  failures.append(f'Wraith Stargate envoy touches forbidden CatCraft/holder internals: {forbidden}')

          # Optional ONAC/RimGate policies (#132/#133) must remain dependency-safe and bounded.
          onac_policy = Path('Source/WraithNaniteGravtech/Compatibility/OnacThreatAndRivalry.cs').read_text(encoding='utf-8')
          onac_interop = Path('Source/WraithNaniteGravtech/Compatibility/GoauldOptionalInterop.cs').read_text(encoding='utf-8')
          glider_mission = Path('Source/WraithNaniteGravtech/Goauld/DeathGliderMission.cs').read_text(encoding='utf-8')
          onac_response_def = Path('Defs/IncidentDefs/Incidents_OnacReplicatorResponse.xml').read_text(encoding='utf-8')
          for label, haystack, needle in (
              ('optional response incident', onac_response_def, '<defName>WNG_OnacReplicatorThreatResponse</defName>'),
              ('optional ONAC load guard', onac_response_def, 'MayRequire="idolord.ONAC"'),
              ('verified ecosystem faction surface', onac_interop, 'IsOnacEcosystemFaction'),
              ('all verified ecosystem factions', onac_interop, 'ActiveOnacEcosystemFactions'),
              ('current Cinder rivalry', onac_policy, 'WraithLineageUtility.CinderCourtDefName'),
              ('current Veiled rivalry', onac_policy, 'WraithLineageUtility.VeiledHiveDefName'),
              ('current Pale Covenant rivalry', onac_policy, 'WraithLineageUtility.PaleCovenantDefName'),
              ('Sable native authority exclusion', onac_policy, 'Sable Brood already uses RimWorld'),
              ('ally preservation', onac_policy, 'FactionRelationKind.Ally'),
              ('one-time pair registry', onac_policy, 'processedPairKeys'),
              ('replicator faction identity', onac_policy, 'WNG_ReplicatorSwarm'),
              ('exact Jaffa generation', onac_policy, 'GoauldOptionalInterop.GenerateExactJaffa'),
              ('priority target configuration', onac_policy, 'mission.ConfigurePriorityTarget(replicators, focus.Position)'),
              ('no goodwill reward for intervention', onac_policy, 'does not change the faction\'s goodwill'),
              ('save-safe priority target faction', glider_mission, 'priorityTargetFaction'),
              ('save-safe priority target cell', glider_mission, 'priorityTargetCell'),
              ('priority-only target filter', glider_mission, 'return thing.Faction == priorityTargetFaction;'),
              ('priority pass focus', glider_mission, 'FindAttackPassCellNear'),
          ):
              if needle not in haystack:
                  failures.append(f'ONAC threat/rivalry contract missing: {label}')
          if 'WNG_WraithExiles' in onac_policy:
