name: WNG Generate Ancient Control Art

on:
  push:
    branches: [main]
    paths:
      - ".github/artgen/generate_ancient_control_art.py"
      - ".github/workflows/wng-generate-ancient-control-art.yml"
      - "Defs/ThingDefs/Things_AsuranDormantFacility.xml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m pip install --disable-pip-version-check pillow
      - name: Render chair, build icon and plinth
        run: python .github/artgen/generate_ancient_control_art.py
      - name: Validate generated art
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          chair=Path("Textures/Things/Building/Precursor/Control")
          icon=Path("Textures/UI/WNG/Build/WNG_AncientControlChair.png")
          files=[]
          for base in ["WNG_AncientControlChair","WNG_AsuranDormantReconstructionPlinth"]:
              files += [chair/f"{base}.png"] + [chair/f"{base}_{d}.png" for d in ("north","east","south","west")]
          for p in files:
              with Image.open(p) as im:
                  im.load()
                  assert im.size==(512,512), (p,im.size)
                  assert im.mode=="RGBA", (p,im.mode)
                  a=im.getchannel("A"); bbox=a.getbbox()
                  assert bbox is not None, p
                  assert bbox[0]>=18 and bbox[1]>=18 and bbox[2]<=494 and bbox[3]<=494, (p,bbox)
                  edges=[a.crop((0,0,512,1)).getextrema()[1],a.crop((0,511,512,512)).getextrema()[1],
                         a.crop((0,0,1,512)).getextrema()[1],a.crop((511,0,512,512)).getextrema()[1]]
                  assert not any(edges),(p,edges)
          with Image.open(icon) as im:
              im.load()
              assert im.size==(256,256), im.size
              assert im.mode=="RGBA", im.mode
              assert im.getchannel("A").getbbox() is not None
          print("Ancient control art validation passed")
          PY
      - name: Commit generated art
        shell: bash
        run: |
          git add Textures/Things/Building/Precursor/Control/WNG_AncientControlChair*.png
          git add Textures/Things/Building/Precursor/Control/WNG_AsuranDormantReconstructionPlinth*.png
          git add Textures/UI/WNG/Build/WNG_AncientControlChair.png
          if git diff --cached --quiet; then
            echo "Ancient control art already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Replace Ancient chair and separate Asuran plinth art"
          git push
