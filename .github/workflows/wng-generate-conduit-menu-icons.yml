name: WNG Generate Conduit Menu Icons

on:
  push:
    branches: [main]
    paths:
      - ".github/artgen/generate_conduit_menu_icons.py"
      - ".github/workflows/wng-generate-conduit-menu-icons.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m pip install --disable-pip-version-check pillow
      - name: Generate single-piece conduit menu icons
        run: python .github/artgen/generate_conduit_menu_icons.py
      - name: Commit conduit menu icons
        shell: bash
        run: |
          git add Textures/UI/WNG/Conduits/*.png
          if git diff --cached --quiet; then
            echo "Conduit menu icons already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+Vardath@users.noreply.github.com"
          git commit -m "Install single-piece WNG conduit menu icons"
          git push
