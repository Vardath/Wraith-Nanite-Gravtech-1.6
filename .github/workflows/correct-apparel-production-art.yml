name: Correct WNG apparel production art

on:
  push:
    paths:
      - '.github/workflows/correct-apparel-production-art.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install pillow
      - name: Correct production apparel art
        shell: bash
        run: |
          cat > /tmp/correct_art.py <<'PY'
          from PIL import Image, ImageFilter, ImageChops
          from pathlib import Path

          ROOT=Path('.')
          APP=ROOT/'Textures/Things/Pawn/Humanlike/Apparel/Precursor'
          WRAITH=ROOT/'Textures/Things/Pawn/Humanlike/Apparel/Wraith'

          def clamp(v): return max(0,min(255,int(v)))

          def render(src_path,dst_path,family):
              src=Image.open(src_path).convert('RGBA')
              w,h=src.size
              out=Image.new('RGBA',(w,h),(0,0,0,0))
              sp=src.load(); op=out.load()
              cyan=Image.new('L',(w,h),0); cp=cyan.load()

              for y in range(h):
                  for x in range(w):
                      r,g,b,a=sp[x,y]
                      if not a: continue
                      lum=.2126*r+.7152*g+.0722*b
                      is_c=(b>120 and g>100 and b>r*1.12 and g>r*1.02) or (b>165 and g>135 and r<130)
                      if is_c:
                          cp[x,y]=a
                          k=max(.55,min(1.25,lum/165))
                          rr,gg,bb=18*k,200*k+25,240*k+14
                      elif lum<70:
                          k=lum/70
                          rr,gg,bb=16+38*k,20+43*k,27+49*k
                      elif family=='uniform':
                          k=(lum-70)/185
                          rr,gg,bb=76+166*k,81+162*k,84+150*k
                      else:
                          k=(lum-70)/185
                          rr,gg,bb=67+172*k,74+174*k,83+172*k
                      op[x,y]=(clamp(rr),clamp(gg),clamp(bb),a)

              alpha=src.getchannel('A')
              boundary=ImageChops.subtract(alpha,alpha.filter(ImageFilter.MinFilter(5)))
              bp=boundary.load()
              for y in range(h):
                  for x in range(w):
                      if not op[x,y][3]: continue
                      e=bp[x,y]/255
                      if e:
                          r,g,b,a=op[x,y]
                          f=1-.25*e
                          op[x,y]=(clamp(r*f),clamp(g*f),clamp(b*f),a)

              if family=='command':
                  dil=cyan.filter(ImageFilter.MaxFilter(3))
                  ring=ImageChops.subtract(dil,cyan)
                  rp=ring.load()
                  for y in range(h):
                      for x in range(w):
                          if not op[x,y][3]: continue
                          t=min(.50,rp[x,y]/255*.50)
                          if t>.01:
                              r,g,b,a=op[x,y]
                              op[x,y]=(clamp(r*(1-t)+220*t),clamp(g*(1-t)+173*t),clamp(b*(1-t)+72*t),a)

              out.putalpha(alpha)

              # The earlier generated north files were physically upside-down.
              # Rotate the target north sprite 180 degrees so neck/collar remains at top,
              # matching RimWorld's actual worn-apparel convention.
              if dst_path.stem.lower().endswith('_north'):
                  out=out.rotate(180,resample=Image.Resampling.BICUBIC,expand=False)

              out.save(dst_path,optimize=True)

          # Rebuild Precursor item + worn assets from the already polished HumanForm production geometry.
          for target,source,family in [
              ('WNG_PrecursorUniform','WNG_HumanFormUniform','uniform'),
              ('WNG_PrecursorFieldArmor','WNG_HumanFormCombatArmor','field'),
              ('WNG_PrecursorCommandArmor','WNG_HumanFormCombatArmor','command'),
          ]:
              for src in sorted(APP.glob(source+'*.png')):
                  suffix=src.name[len(source):]
                  render(src,APP/(target+suffix),family)

          # Correct the same upside-down north error in the Asuran/HumanForm sources themselves.
          for prefix in ['WNG_HumanFormUniform','WNG_HumanFormCombatArmor']:
              for p in sorted(APP.glob(prefix+'*_north.png')):
                  im=Image.open(p).convert('RGBA').rotate(180,resample=Image.Resampling.BICUBIC,expand=False)
                  im.save(p,optimize=True)

          # Correct north orientation in the Wraith apparel pass too.
          for p in sorted(WRAITH.glob('*_north.png')):
              im=Image.open(p).convert('RGBA').rotate(180,resample=Image.Resampling.BICUBIC,expand=False)
              im.save(p,optimize=True)

          print('Precursor uniform',len(list(APP.glob('WNG_PrecursorUniform*.png'))))
          print('Precursor field',len(list(APP.glob('WNG_PrecursorFieldArmor*.png'))))
          print('Precursor command',len(list(APP.glob('WNG_PrecursorCommandArmor*.png'))))
          print('HumanForm north corrected',len(list(APP.glob('WNG_HumanForm*_north.png'))))
          print('Wraith north corrected',len(list(WRAITH.glob('*_north.png'))))
          PY
          python /tmp/correct_art.py

      - name: Commit corrected production art
        shell: bash
        run: |
          git config user.name "Vardath WNG Art"
          git config user.email "59270526+Vardath@users.noreply.github.com"
          git add Textures/Things/Pawn/Humanlike/Apparel/Precursor/
          git add Textures/Things/Pawn/Humanlike/Apparel/Wraith/
          git commit -m "Correct apparel orientation and production art consistency"
          git push
