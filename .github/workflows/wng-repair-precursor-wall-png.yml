name: WNG Repair Precursor Wall PNG

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Repair PNG CRC/chunks
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFile

          src = Path("Textures/Things/Building/Precursor/Structure/WNG_PrecursorWall.png")
          tmp = src.with_suffix(".fixed.png")

          ImageFile.LOAD_TRUNCATED_IMAGES = True
          with Image.open(src) as im:
              im.load()
              rgba = im.convert("RGBA")
              rgba.save(tmp, format="PNG")

          with Image.open(tmp) as check:
              check.verify()

          tmp.replace(src)
          print("Re-encoded and strictly verified", src)
          PY
      - name: Commit repaired asset
        shell: bash
        run: |
          if git diff --quiet -- Textures/Things/Building/Precursor/Structure/WNG_PrecursorWall.png; then
            echo "Precursor wall PNG already clean."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Textures/Things/Building/Precursor/Structure/WNG_PrecursorWall.png
          git commit -m "Repair Precursor wall PNG integrity"
          git push
