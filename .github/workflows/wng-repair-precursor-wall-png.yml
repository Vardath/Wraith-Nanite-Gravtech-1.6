name: WNG Repair Precursor Wall PNG

on:
  push:
    branches: [ main ]
    paths:
      - '.github/artfix/repair_precursor_wall_original.py'
      - '.github/workflows/wng-repair-precursor-wall-png.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Restore original Precursor settlement-wall PNG
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check pillow
          python .github/artfix/repair_precursor_wall_original.py
      - name: Commit only repaired source PNG
        shell: bash
        run: |
          set -euo pipefail
          git add Textures/Things/Building/Precursor/Structure/WNG_PrecursorWall.png
          if git diff --cached --quiet; then
            echo "Precursor wall texture already repaired."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Repair original Precursor wall lower pixel rows, preserving linked wall atlas"
          git push origin HEAD:main
