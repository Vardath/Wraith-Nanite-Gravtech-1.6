name: Temporary Wraith flight evidence-gate validation

on:
  push:
    branches:
      - rebuild/wraith-flight-evidence-gate-20260912

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build WNG
        run: dotnet build Source/WNG/WNG.csproj -c Release
      - name: Parse Def and patch XML
        shell: pwsh
        run: |
          $files = @(Get-ChildItem Defs -Recurse -Filter *.xml) + @(Get-ChildItem Patches -Recurse -Filter *.xml)
          foreach ($file in $files) { [xml](Get-Content $file.FullName -Raw) | Out-Null }
          Write-Host "Parsed $($files.Count) XML files"
      - name: Check Wraith evidence progression
        shell: pwsh
        run: |
          $living = Get-Content 'Defs/ResearchProjectDefs/Research_WraithBootstrap.xml' -Raw
          $shuttles = Get-Content 'Defs/ResearchProjectDefs/Research_Shuttles.xml' -Raw
          if (-not $living.Contains('<requiredAnalyzed>')) { throw 'Wraith living technology is not evidence-gated' }
          if (-not $living.Contains('<li>WNG_WraithHiveHeart</li>')) { throw 'Wraith living technology does not require analyzed Hive Heart' }
          $wraithStart = $shuttles.IndexOf('<defName>WNG_WraithShuttles</defName>')
          $ancientStart = $shuttles.IndexOf('<defName>WNG_AncientShuttles</defName>')
          if ($wraithStart -lt 0 -or $ancientStart -le $wraithStart) { throw 'Could not isolate Wraith shuttle research block' }
          $wraithBlock = $shuttles.Substring($wraithStart, $ancientStart - $wraithStart)
          if (-not $wraithBlock.Contains('<li>WNG_ShuttleEngineering</li>')) { throw 'Wraith flight lost generic shuttle-engineering prerequisite' }
          if (-not $wraithBlock.Contains('<li>WNG_WraithLivingTechnology</li>')) { throw 'Wraith flight can bypass analyzed Wraith living technology' }
          $gravStart = $shuttles.IndexOf('<defName>WNG_WraithGravships</defName>')
          $asuranStart = $shuttles.IndexOf('<defName>WNG_AsuranGravships</defName>')
          $gravBlock = $shuttles.Substring($gravStart, $asuranStart - $gravStart)
          if (-not $gravBlock.Contains('<li>WNG_WraithShuttles</li>')) { throw 'Wraith gravships no longer inherit Wraith flight evidence gate' }
          Write-Host 'Wraith flight evidence progression OK'
