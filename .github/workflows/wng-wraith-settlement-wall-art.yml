name: Wraith settlement wall artwork

on:
  push:
    branches: [ main ]
    paths:
      - "Tools/WallArt/generate_wraith_settlement_wall.py"
      - ".github/workflows/wng-wraith-settlement-wall-art.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wng-wraith-settlement-wall-art
  cancel-in-progress: false

jobs:
  generate-wall-art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install texture tooling
        run: python -m pip install --disable-pip-version-check pillow numpy
      - name: Paint and assemble sixteen native linked Wraith living wall tiles
        run: python Tools/WallArt/generate_wraith_settlement_wall.py --preview ArtSource/Walls/Wraith/QA/settlement-topology.png
      - name: Commit the generated art INSIDE the mod
        shell: bash
        run: |
          set -euo pipefail
          git add \
            Textures/Things/Building/Wraith/Structure/WNG_LivingWall_Atlas.png \
            Textures/Things/Building/Wraith/Structure/WNG_LivingWall.png \
            Textures/UI/WNG/Build/WNG_WraithLivingWall.png \
            Textures/UI/WNG/Build/WNG_WraithGravshipHull.png \
            ArtSource/Walls/Wraith/QA/settlement-topology.png
          if git diff --cached --quiet; then
            echo "Wall artwork already matches approved generator"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Build Wraith linked wall art and complete multi-tile architecture test"
          git pull --rebase origin main
          git push origin HEAD:main
