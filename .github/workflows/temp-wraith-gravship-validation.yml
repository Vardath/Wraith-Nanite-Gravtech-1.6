name: Temporary Wraith gravship validation
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build WNG
        run: dotnet build Source/WNG/WNG.csproj -c Release
      - name: Parse XML
        run: python -c "import pathlib,xml.etree.ElementTree as ET; files=list(pathlib.Path('Defs').rglob('*.xml'))+list(pathlib.Path('Patches').rglob('*.xml'))+[pathlib.Path('About/About.xml')]; [ET.parse(p) for p in files]; print('XML parse OK',len(files))"
      - name: Check Wraith gravship invariants
        run: python -c "from pathlib import Path; p=Path('Defs/ThingDefs/Buildings_WraithGravship.xml').read_text(); b=Path('Patches/WraithGravshipNativeBridge.xml').read_text(); s=Path('Source/WNG/Gravship/WNGGravshipParts.cs').read_text(); e=Path('Source/WNG/Gravship/WNGGravEngineTheme.cs').read_text(); assert 'Gravcore' not in p; assert 'CompPilotConsole' in p; assert 'CompProperties_GravshipThruster' in p; assert 'ThingDefOf.GravshipHull' in s; assert 'ThingDefOf.GravEngine' in e; assert 'WNG_WraithHullRegenerator' in b; assert 'GravshipShieldGenerator' not in p; print('Wraith gravship invariants OK')"
