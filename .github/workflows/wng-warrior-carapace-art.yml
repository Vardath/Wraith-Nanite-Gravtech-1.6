name: WNG Warrior Carapace Art
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wng-warrior-carapace-art.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install renderer dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy
      - name: Generate Warrior Carapace art
        run: python .github/artgen/wraith_warrior_carapace_professional.py
      - name: Validate apparel art
        run: python .github/artqa/apparel_art_audit.py
      - name: Commit Warrior Carapace PNG family
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Textures/Things/Pawn/Humanlike/Apparel/Wraith/WNG_WarriorCarapace*.png
          git commit -m "Replace Wraith Warrior Carapace art and tile [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
