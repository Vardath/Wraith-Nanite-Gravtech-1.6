name: WNG Generate Alkesh Art

on:
  push:
    branches: [main]
    paths:
      - ".github/artgen/generate_alkesh.py"
      - ".github/artgen/assets/alkesh_master.b64.part*"
      - ".github/workflows/wng-generate-alkesh.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m pip install --disable-pip-version-check pillow
      - name: Build verified Al'kesh directional family
        run: python .github/artgen/generate_alkesh.py
      - name: Commit Al'kesh art only
        shell: bash
        run: |
          git add .github/artgen/assets/alkesh_master.png
          git add Textures/Things/Building/Goauld/Shuttle/WNG_AlkeshTransport*.png
          if git diff --cached --quiet; then
            echo "Al'kesh art already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+Vardath@users.noreply.github.com"
          git commit -m "Install verified Al'kesh directional art"
          git pull --rebase origin main
          git push
