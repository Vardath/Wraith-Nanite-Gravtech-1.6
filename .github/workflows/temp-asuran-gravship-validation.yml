name: Temporary Asuran gravship validation

on:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build WNG
        run: dotnet build Source/WNG/WNG.csproj -c Release
      - name: Parse Def and patch XML
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          files = list(pathlib.Path('Defs').rglob('*.xml')) + list(pathlib.Path('Patches').rglob('*.xml'))
          for path in files:
              ET.parse(path)
          print(f'Parsed {len(files)} XML files')
          PY
      - name: Check gravship family invariants
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET

          asuran = ET.parse('Defs/ThingDefs/Buildings_AsuranGravship.xml').getroot()
          names = {n.findtext('defName') for n in asuran.findall('ThingDef')}
          required = {
              'WNG_AsuranGravEngineSeed','WNG_AsuranHullSeed','WNG_AsuranControlInterface',
              'WNG_AsuranNaniteSludgeTank','WNG_AsuranLargeNaniteSludgeTank',
              'WNG_AsuranSmallThruster','WNG_AsuranLargeThruster','WNG_AsuranFieldExtender',
              'WNG_AsuranSignalJammer','WNG_AsuranFuelOptimizer','WNG_AsuranShieldEmitter',
              'WNG_AsuranPowerCell'
          }
          assert required <= names, sorted(required - names)

          # Asuran fuel storage must accept only WNG nanite sludge.
          for name in ('WNG_AsuranNaniteSludgeTank','WNG_AsuranLargeNaniteSludgeTank'):
              node = next(n for n in asuran.findall('ThingDef') if n.findtext('defName') == name)
              filters = [x.text for x in node.findall('.//fuelFilter/thingDefs/li')]
              assert filters == ['WNG_NaniteSludge'], (name, filters)

          # Core launch facilities must all carry the Asuran theme marker.
          for name in required - {'WNG_AsuranGravEngineSeed','WNG_AsuranHullSeed','WNG_AsuranPowerCell'}:
              node = next(n for n in asuran.findall('ThingDef') if n.findtext('defName') == name)
              themes = [x.findtext('theme') for x in node.findall('./comps/li') if x.attrib.get('Class') == 'WraithNaniteGravtech.CompProperties_WNGGravshipPartTheme']
              assert themes == ['Asuran'], (name, themes)

          bridge = pathlib.Path('Patches/AsuranGravshipNativeBridge.xml').read_text()
          for name in required - {'WNG_AsuranGravEngineSeed','WNG_AsuranHullSeed','WNG_AsuranPowerCell'}:
              assert name in bridge, name
          assert 'WNG_AsuranHullSeed' in bridge and 'WNG_AsuranSubstructure' in bridge

          source = pathlib.Path('Source/WNG/Gravship/WNGGravEngineTheme.cs').read_text()
          assert 'TryGetComp<CompGravshipFacility>()' in source
          assert 'partTheme != null && partTheme.Theme == theme' in source

          wraith_safety = pathlib.Path('Patches/WraithPilotConsoleSafety.xml').read_text()
          assert 'WNG_WraithControlInterface' in wraith_safety and 'CompProperties_Breakdownable' in wraith_safety

          # Obsolete WNG Gravcore must not return as a Def/product.
          bad = []
          for p in list(pathlib.Path('Defs').rglob('*.xml')) + list(pathlib.Path('Source/WNG').rglob('*.cs')):
              text = p.read_text(errors='ignore')
              for token in ('<defName>WNG_Gravcore', '<defName>WNG_WraithGravcore', '<products><WNG_Gravcore'):
                  if token in text:
                      bad.append((str(p), token))
          assert not bad, bad
          print('Gravship family invariants passed')
          PY
