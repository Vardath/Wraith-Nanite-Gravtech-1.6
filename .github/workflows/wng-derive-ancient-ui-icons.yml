name: WNG Derive Ancient UI Icons

on:
  push:
    branches: [main]
    paths:
      - ".github/artqa/derive_ancient_ui_icons.py"
      - ".github/workflows/wng-derive-ancient-ui-icons.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  derive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m pip install --disable-pip-version-check pillow
      - run: python .github/artqa/derive_ancient_ui_icons.py
      - name: Commit derived UI icons
        shell: bash
        run: |
          git add Textures/UI/WNG/AncientDrone.png Textures/UI/WNG/RecoveredAncientDrone.png Textures/UI/WNG/RecoveredVacuumModule.png
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Replace opaque Ancient UI panels with transparent icons"
          git push
