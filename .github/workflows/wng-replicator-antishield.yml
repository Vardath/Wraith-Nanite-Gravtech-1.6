name: WNG Replicator AntiShield validation

on:
  push:
    branches:
      - rebuild/replicator-antishield-20260912

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild/replicator-antishield-20260912
          fetch-depth: 0

      - name: Patch adaptive ranged fire
        run: python .github/scripts/patch-replicator-antishield.py

      - name: Build WNG
        run: dotnet build Source/WNG/WNG.csproj -c Release

      - name: Validate XML and invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          files = list(Path('Defs').rglob('*.xml')) + list(Path('Patches').rglob('*.xml'))
          for f in files:
              ET.parse(f)
          e = Path('Source/WNG/Replicators/ReplicatorAdaptationEffects.cs').read_text(encoding='utf-8')
          p = Path('Source/WNG/Replicators/ReplicatorAdaptiveProjectile.cs').read_text(encoding='utf-8')
          x = Path('Defs/ThingDefs/Projectiles_Replicator.xml').read_text(encoding='utf-8')
          required = [
              'TryLaunchAdaptiveProjectile(pawn, target)',
              'ProjectileHitFlags.IntendedTarget | ProjectileHitFlags.NonTargetWorld',
              'AdaptiveProjectileBodyDamage',
              'class Projectile_ReplicatorAdaptiveBolt : Bullet',
              'public override int DamageAmount',
              'LauncherHasAntiShield',
              'targetHasWngAdaptiveShield',
          ]
          missing = [v for v in required if v not in e and v not in p]
          if missing:
              raise SystemExit('Missing AntiShield invariants: ' + ', '.join(missing))
          if 'target.TakeDamage(new DamageInfo' in e:
              raise SystemExit('Adaptive shot still bypasses native projectile interception')
          if 'ParentName="BaseBullet"' not in x or 'Projectile_ReplicatorAdaptiveBolt' not in x:
              raise SystemExit('Adaptive projectile Def wiring missing')
          if 'CompWraithHullRegenerator' in e or 'CompWraithHullRegenerator' in p:
              raise SystemExit('AntiShield must not target Wraith living-hull regeneration')
          print(f'Parsed {len(files)} XML files')
          PY

      - name: Commit validated patch and remove temp helpers
        run: |
          rm .github/workflows/wng-replicator-antishield.yml
          rm .github/scripts/patch-replicator-antishield.py
          git config user.name "Vardath"
          git config user.email "59270526+Vardath@users.noreply.github.com"
          git add Source/WNG/Replicators/ReplicatorAdaptationEffects.cs .github/workflows/wng-replicator-antishield.yml .github/scripts/patch-replicator-antishield.py
          git commit -m "rebuild: route Replicator adaptive fire through native shields"
          git push origin HEAD:rebuild/replicator-antishield-20260912
