name: D108 Release Build

permissions:
  contents: write

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore RimWorld 1.6 reference assemblies
        run: dotnet restore Source/WraithNaniteGravtech/WraithNaniteGravtech.csproj

      - name: Compute source fingerprint
        shell: bash
        run: |
          echo "WNG_SOURCE_FINGERPRINT=$(python .github/artqa/dll_source_parity.py fingerprint)" >> "$GITHUB_ENV"

      - name: Compile WNG managed assembly
        run: |
          dotnet build Source/WraithNaniteGravtech/WraithNaniteGravtech.csproj -c Release --no-restore \
            -p:WNGSourceCommit="${GITHUB_SHA}" \
            -p:WNGSourceFingerprint="${WNG_SOURCE_FINGERPRINT}"

      - name: Write and verify DLL/source build manifest
        shell: bash
        run: |
          test -f Assemblies/WraithNaniteGravtech.dll
          python .github/artqa/dll_source_parity.py write \
            --source-commit "${GITHUB_SHA}"
          python .github/artqa/dll_source_parity.py verify \
            --expected-source-commit "${GITHUB_SHA}" \
            --require-embedded
          echo "Managed assembly:"
          ls -lh Assemblies/WraithNaniteGravtech.dll Assemblies/WraithNaniteGravtech.buildinfo.json

      - name: Commit refreshed managed assembly
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          if git diff --quiet -- Assemblies/WraithNaniteGravtech.dll Assemblies/WraithNaniteGravtech.pdb Assemblies/WraithNaniteGravtech.buildinfo.json; then
            echo "Tracked managed assembly is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Assemblies/WraithNaniteGravtech.dll Assemblies/WraithNaniteGravtech.buildinfo.json
          if [ -f Assemblies/WraithNaniteGravtech.pdb ]; then
            git add Assemblies/WraithNaniteGravtech.pdb
          fi
          git commit -m "Refresh compiled WNG assembly [skip ci]"
          git push origin HEAD:main

      - name: Build installable release ZIP
        shell: bash
        run: |
          python .github/artqa/build_release_package.py \
            --zip Wraith-Nanite-Gravtech-1.6-release.zip \
            --stage release-stage
          unzip -l Wraith-Nanite-Gravtech-1.6-release.zip | grep 'Wraith-Nanite-Gravtech/Assemblies/WraithNaniteGravtech.dll'
          unzip -l Wraith-Nanite-Gravtech-1.6-release.zip | grep 'Wraith-Nanite-Gravtech/About/About.xml'
          unzip -l Wraith-Nanite-Gravtech-1.6-release.zip | grep 'Wraith-Nanite-Gravtech/PublishedFileId.txt'

      - name: Validate exact packaged artifact
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check pillow
          unzip -t Wraith-Nanite-Gravtech-1.6-release.zip >/dev/null
          rm -rf release-unpacked
          mkdir -p release-unpacked
          unzip -q Wraith-Nanite-Gravtech-1.6-release.zip -d release-unpacked

          test "$(find release-unpacked -mindepth 1 -maxdepth 1 -type d -printf '%f\n')" = "Wraith-Nanite-Gravtech"
          test ! -e release-unpacked/Wraith-Nanite-Gravtech/Assemblies/WraithNaniteGravtech.pdb

          python .github/artqa/release_package_integrity.py release-unpacked/Wraith-Nanite-Gravtech
          python .github/artqa/dll_source_parity.py verify \
            --dll release-unpacked/Wraith-Nanite-Gravtech/Assemblies/WraithNaniteGravtech.dll \
            --manifest release-unpacked/Wraith-Nanite-Gravtech/Assemblies/WraithNaniteGravtech.buildinfo.json \
            --expected-source-commit "${GITHUB_SHA}" \
            --require-embedded
          cmp -s Assemblies/WraithNaniteGravtech.dll release-unpacked/Wraith-Nanite-Gravtech/Assemblies/WraithNaniteGravtech.dll
          (
            cd release-unpacked/Wraith-Nanite-Gravtech
            python ../../.github/artqa/final_art_integrity.py
          )

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: Wraith-Nanite-Gravtech-1.6-release
          path: Wraith-Nanite-Gravtech-1.6-release.zip
          if-no-files-found: error
          retention-days: 14

      - name: Publish rolling GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f wng-latest-build "${GITHUB_SHA}"
          git push -f origin wng-latest-build

          if gh release view wng-latest-build >/dev/null 2>&1; then
            gh release upload wng-latest-build Wraith-Nanite-Gravtech-1.6-release.zip --clobber
            gh release edit wng-latest-build \
              --title "WNG 1.6 Latest Compiled Build" \
              --notes "Rolling compiled test build from main. Extract Wraith-Nanite-Gravtech directly into RimWorld/Mods." \
              --prerelease
          else
            gh release create wng-latest-build \
              Wraith-Nanite-Gravtech-1.6-release.zip \
              --title "WNG 1.6 Latest Compiled Build" \
              --notes "Rolling compiled test build from main. Extract Wraith-Nanite-Gravtech directly into RimWorld/Mods." \
              --prerelease
          fi
