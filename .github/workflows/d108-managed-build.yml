name: D108 Release Build

permissions:
  contents: write

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore RimWorld 1.6 reference assemblies
        run: dotnet restore Source/WraithNaniteGravtech/WraithNaniteGravtech.csproj

      - name: Compile WNG managed assembly
        run: dotnet build Source/WraithNaniteGravtech/WraithNaniteGravtech.csproj -c Release --no-restore

      - name: Verify managed output
        shell: bash
        run: |
          test -f Assemblies/WraithNaniteGravtech.dll
          echo "Managed assembly:"
          ls -lh Assemblies/WraithNaniteGravtech.dll

      - name: Build installable release ZIP
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil

          root = Path('.')
          stage = Path('release-stage/Wraith-Nanite-Gravtech')
          stage.mkdir(parents=True, exist_ok=True)

          runtime_dirs = [
              'About',
              'Assemblies',
              'Compatibility',
              'Defs',
              'Patches',
              'Sounds',
              'Textures',
          ]
          runtime_files = ['LoadFolders.xml', 'PublishedFileId.txt']

          for name in runtime_dirs:
              src = root / name
              if src.exists():
                  shutil.copytree(src, stage / name, dirs_exist_ok=True)

          for name in runtime_files:
              src = root / name
              if src.exists():
                  shutil.copy2(src, stage / name)
          PY
          cd release-stage
          zip -qr ../Wraith-Nanite-Gravtech-1.6-release.zip Wraith-Nanite-Gravtech
          cd ..
          unzip -l Wraith-Nanite-Gravtech-1.6-release.zip | grep 'Wraith-Nanite-Gravtech/Assemblies/WraithNaniteGravtech.dll'
          unzip -l Wraith-Nanite-Gravtech-1.6-release.zip | grep 'Wraith-Nanite-Gravtech/About/About.xml'
          unzip -l Wraith-Nanite-Gravtech-1.6-release.zip | grep 'Wraith-Nanite-Gravtech/PublishedFileId.txt'

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: Wraith-Nanite-Gravtech-1.6-release
          path: Wraith-Nanite-Gravtech-1.6-release.zip
          if-no-files-found: error
          retention-days: 14

      - name: Publish rolling GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f wng-latest-build "${GITHUB_SHA}"
          git push -f origin wng-latest-build

          if gh release view wng-latest-build >/dev/null 2>&1; then
            gh release upload wng-latest-build Wraith-Nanite-Gravtech-1.6-release.zip --clobber
            gh release edit wng-latest-build \
              --title "WNG 1.6 Latest Compiled Build" \
              --notes "Rolling compiled test build from main. Extract Wraith-Nanite-Gravtech directly into RimWorld/Mods." \
              --prerelease
          else
            gh release create wng-latest-build \
              Wraith-Nanite-Gravtech-1.6-release.zip \
              --title "WNG 1.6 Latest Compiled Build" \
              --notes "Rolling compiled test build from main. Extract Wraith-Nanite-Gravtech directly into RimWorld/Mods." \
              --prerelease
          fi
