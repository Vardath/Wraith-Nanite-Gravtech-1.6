name: Temporary shared pilot subpersona validation

on:
  push:
    branches:
      - rebuild/shared-pilot-subpersona-20260912

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build WNG
        run: dotnet build Source/WNG/WNG.csproj -c Release
      - name: Parse Def and patch XML
        shell: pwsh
        run: |
          $files = @(Get-ChildItem Defs -Recurse -Filter *.xml) + @(Get-ChildItem Patches -Recurse -Filter *.xml)
          foreach ($file in $files) { [xml](Get-Content $file.FullName -Raw) | Out-Null }
          Write-Host "Parsed $($files.Count) XML files"
      - name: Check shared pilot-core exception remains narrow
        shell: pwsh
        run: |
          $source = Get-Content 'Source/WNG/Gravship/WNGGravEngineTheme.cs' -Raw
          if (-not $source.Contains('SharedPilotSubpersonaCoreDefName = "PilotSubpersonaCore"')) { throw 'Native pilot subpersona core is not identified as the shared facility' }
          if (-not $source.Contains('if (IsSharedNativeFacility(facilityThing))')) { throw 'Shared facility exemption is not applied before unlinking' }
          if (-not $source.Contains('facilityThing?.def?.defName == SharedPilotSubpersonaCoreDefName')) { throw 'Shared facility exemption is broader than the explicit defName check' }
          if ($source.Contains('FuelOptimizerDefName') -or $source.Contains('SignalJammerDefName') -or $source.Contains('ChemfuelTankDefName')) { throw 'Unrequested vanilla technology families were whitelisted' }
          if (-not $source.Contains('facility.Notify_LinkRemoved(engine)')) { throw 'Family mismatch unlink enforcement was removed' }
          Write-Host 'Shared PilotSubpersonaCore exception is narrow and family enforcement remains present'
