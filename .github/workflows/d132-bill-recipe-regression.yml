name: D132 Bill and Recipe Regression Audit

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  bill-recipe-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run bill and recipe regression audit
        run: python3 .github/artqa/bill_recipe_regression.py

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore RimWorld 1.6 reference assemblies
        run: dotnet restore Source/WraithNaniteGravtech/WraithNaniteGravtech.csproj

      - name: Compile audited WNG assembly
        run: dotnet build Source/WraithNaniteGravtech/WraithNaniteGravtech.csproj -c Release --no-restore
