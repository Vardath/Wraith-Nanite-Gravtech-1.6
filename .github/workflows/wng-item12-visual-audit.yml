name: WNG Item 12 Visual Audit

on:
  push:
    branches: [main]
    paths:
      - ".github/artqa/item12_visual_audit.py"
      - ".github/workflows/wng-item12-visual-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m pip install --disable-pip-version-check pillow
      - run: python .github/artqa/item12_visual_audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: item12-contact-sheets
          path: qa/item12_contact_sheets/*.jpg
          if-no-files-found: error
