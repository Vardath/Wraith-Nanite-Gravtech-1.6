name: WNG Ship Alpha Audit

on:
  push:
    branches: [main]
    paths:
      - ".github/validation/audit_ship_alpha.py"
      - ".github/workflows/wng-ship-alpha-audit.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m pip install --disable-pip-version-check pillow
      - name: Audit shuttle and craft alpha
        run: python .github/validation/audit_ship_alpha.py
