name: WNG Ship Alpha Audit

on:
  push:
    branches: [main]
    paths:
      - ".github/artqa/ship_alpha_audit.py"
      - ".github/workflows/wng-ship-alpha-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m pip install --disable-pip-version-check pillow
      - run: python .github/artqa/ship_alpha_audit.py
