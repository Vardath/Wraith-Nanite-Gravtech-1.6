name: WNG Generate Goauld Ring Transporter Art

on:
  push:
    branches: [main]
    paths:
      - '.github/artgen/generate_goauld_ring_transport.py'
      - '.github/workflows/wng-generate-goauld-rings-art.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ring-art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Generate circular floor plate and rising ring sprite
        run: python .github/artgen/generate_goauld_ring_transport.py
      - name: Validate alpha and visual asset dimensions
        shell: bash
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          root=Path('Textures/Things/Building/Goauld')
          for name in ('WNG_GoauldTransportRings.png','WNG_GoauldRingEffect.png'):
              im=Image.open(root/name)
              im.load()
              assert im.mode=='RGBA' and im.size==(512,512),name
              assert im.getpixel((0,0))[3]==0,name
              print('Validated',name, (root/name).stat().st_size)
          PY
      - name: Commit new sprites inside WNG
        shell: bash
        run: |
          git add Textures/Things/Building/Goauld/WNG_GoauldTransportRings.png
          git add Textures/Things/Building/Goauld/WNG_GoauldRingEffect.png
          if git diff --cached --quiet; then
            echo "Ring artwork already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Generate recessed Goauld ring platform and five-ring VFX sprite"
          git push origin HEAD:main
