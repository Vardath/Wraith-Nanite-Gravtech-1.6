name: WNG Hunter Coat Art Pass

on:
  push:
    branches: [main]
    paths:
      - '.github/artgen/wraith_hunter_coat.py'
      - '.github/workflows/wng-hunter-coat-art.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Sync latest main
        run: git pull --rebase origin main
      - name: Repaint Hunter Coat
        run: python .github/artgen/wraith_hunter_coat.py
      - name: Validate apparel textures
        run: python .github/artqa/apparel_art_audit.py
      - name: Commit Hunter Coat textures only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Textures/Things/Pawn/Humanlike/Apparel/Wraith/WNG_HunterCoat*.png
          if git diff --cached --quiet; then
            echo "No Hunter Coat texture changes to commit"
            exit 0
          fi
          git commit -m "Rebuild Wraith Hunter Coat art [skip ci]"
          git push origin HEAD:main
