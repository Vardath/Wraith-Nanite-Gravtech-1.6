name: WNG Generate Iratus Pheromone Artwork

on:
  push:
    branches: [main]
    paths:
      - '.github/artgen/generate_iratus_pheromones.py'
      - '.github/workflows/wng-iratus-pheromones-art.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pheromone-art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Render professional Iratus resource texture
        run: python .github/artgen/generate_iratus_pheromones.py
      - name: Commit texture into WNG (not chat)
        shell: bash
        run: |
          git add Textures/Things/Item/Resource/WNG_IratusPheromones.png
          if git diff --cached --quiet; then
            echo "Pheromone art already up-to-date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Render Iratus pheromone item texture"
          git push origin HEAD:main
