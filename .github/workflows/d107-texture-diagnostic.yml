name: D107 Texture Diagnostic

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print unresolved custom texPaths
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import difflib, xml.etree.ElementTree as ET

          stems=[]
          for p in Path('Textures').rglob('*'):
              if p.is_file():
                  rel=p.relative_to('Textures').as_posix()
                  stem=rel.rsplit('.',1)[0]
                  stems.append(stem)
                  for suffix in ('_north','_south','_east','_west'):
                      if stem.endswith(suffix): stems.append(stem[:-len(suffix)])
          stemset=set(stems)
          missing=[]
          for p in Path('.').rglob('*.xml'):
              try: root=ET.parse(p).getroot()
              except Exception: continue
              for e in root.iter('texPath'):
                  if not e.text: continue
                  tex=e.text.strip()
                  if tex in stemset: continue
                  if tex.startswith('WNG/') or '/WNG_' in tex or tex.startswith('WraithNaniteGravtech/'):
                      missing.append((str(p),tex))
          print('UNRESOLVED CUSTOM TEXPATH CANDIDATES:',len(missing))
          for p,tex in missing:
              print('\nXML:',p)
              print('TEX:',tex)
              print('CLOSEST:')
              for x in difflib.get_close_matches(tex, sorted(stemset), n=6, cutoff=0.35): print(' ',x)
          PY
