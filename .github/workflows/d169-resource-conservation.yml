name: D169 Resource Conservation Exploit Audit

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  resource-conservation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit resource conservation and exploit loops
        run: python3 .github/artqa/resource_conservation.py
      - name: Recheck economy
        run: python3 .github/artqa/economy.py
      - name: Recheck Replicator state machine
        run: python3 .github/artqa/replicator_state_machine.py
      - name: Recheck Replicator death and split
        run: python3 .github/artqa/replicator_death_split.py
      - name: Recheck save-load transaction safety
        run: python3 .github/artqa/save_load_migration.py
