name: WNG Repair Shuttle Alpha

on:
  push:
    branches: [main]
    paths:
      - ".github/artgen/fix_ship_alpha.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m pip install --disable-pip-version-check pillow
      - name: Repair rotation-equivalent craft and transparent matte
        run: python .github/artgen/fix_ship_alpha.py
      - name: Commit repaired shuttle art
        shell: bash
        run: |
          git add Textures/Things/Building/Goauld/Shuttle
          git add Textures/Things/Building/Precursor/Shuttle
          git add Textures/Things/Building/Wraith/Shuttle
          if git diff --cached --quiet; then
            echo "No shuttle alpha changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Repair shuttle alpha and rotation-equivalent craft sprites"
          git push
