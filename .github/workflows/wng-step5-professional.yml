name: WNG Step 5 Professional Master Build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wng-step5-professional.yml'
      - 'Tools/ApparelForge/source_art/generate_human_form_uniform_diffusion.py'
      - 'Tools/ApparelForge/profiles/human_form_uniform.json'
      - 'Tools/ApparelForge/apparel_forge.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install image model and fitting dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            pillow numpy scipy cairosvg torch torchvision \
            diffusers transformers accelerate safetensors rembg onnxruntime

      - name: Generate finished Step 5 master paintings
        env:
          HF_HUB_DISABLE_XET: "1"
          WNG_STEP5_MODEL: "stabilityai/sd-turbo"
        run: python Tools/ApparelForge/source_art/generate_human_form_uniform_diffusion.py

      - name: Validate ApparelForge
        run: |
          python -m py_compile Tools/ApparelForge/apparel_forge.py
          python Tools/ApparelForge/apparel_forge.py --validate-profiles-only

      - name: Fetch vanilla RimWorld geometry
        run: |
          git clone --depth 1 https://github.com/SamuelBucher/Madness-Pawns.git /tmp/madness
          git clone --depth 1 https://github.com/DaLongZhuaZi/RWonVela.git /tmp/rwvela

      - name: Fit finished masters to pawn variants and build tile
        run: |
          python Tools/ApparelForge/apparel_forge.py human_form_uniform \
            --vanilla-dir "/tmp/madness/Raw sprites/apparel" \
            --body-dir "/tmp/rwvela/src/common/human/bodies" \
            --workdir /tmp/wng-step5-professional

      - name: Validate live apparel contract
        run: python .github/artqa/apparel_art_audit.py

      - name: Commit finished Step 5
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            ArtSource/Apparel/human_form_uniform/master_south.png \
            ArtSource/Apparel/human_form_uniform/master_north.png \
            ArtSource/Apparel/human_form_uniform/master_east.png \
            "Textures/Things/Pawn/Humanlike/Apparel/Precursor/WNG_HumanFormUniform"*.png
          git diff --cached --quiet && exit 0
          git commit -m "Finish Step 5 Human Form Uniform with professional generated masters [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
