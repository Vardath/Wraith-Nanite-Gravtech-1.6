name: Apply WNG art update
on:
  push:
    paths:
      - '.github/workflows/wng-art-sync.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - run: python -m pip install pillow

      - name: Apply professional art to existing WNG sprites
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageChops
          import base64, glob

          temp=Path('.tmp/wng-art')
          def load_src(name):
              s=''.join((temp/f'{name}.b64').read_text().split())
              s += '=' * (-len(s) % 4)
              raw=base64.b64decode(s)
              p=Path('/tmp')/f'{name}.png'
              p.write_bytes(raw)
              return Image.open(p).convert('RGBA')

          src={
            'alkesh': load_src('alkesh'),
            'queen': load_src('queen'),
            'commander': load_src('commander'),
            'asuran_uniform': load_src('asuran_uniform'),
            'asuran_armor': load_src('asuran_armor'),
          }

          def trim(im):
              bb=im.getchannel('A').getbbox()
              return im.crop(bb) if bb else im

          def fit(source,target,preserve_mask=True):
              target=Path(target)
              old=Image.open(target).convert('RGBA')
              old_alpha=old.getchannel('A')
              bb=old_alpha.getbbox() or (0,0,old.width,old.height)
              art=trim(source)
              bw,bh=bb[2]-bb[0],bb[3]-bb[1]
              scale=min(bw/art.width,bh/art.height)
              art=art.resize((max(1,round(art.width*scale)),max(1,round(art.height*scale))),Image.Resampling.LANCZOS)
              out=Image.new('RGBA',old.size,(0,0,0,0))
              x=bb[0]+(bw-art.width)//2
              y=bb[1]+(bh-art.height)//2
              out.alpha_composite(art,(x,y))
              if preserve_mask:
                  out.putalpha(ImageChops.multiply(out.getchannel('A'),old_alpha))
              out.save(target,optimize=True,compress_level=9)

          # Goa'uld Al'kesh: same existing footprint/path, new professional surface art.
          root=Path('Textures/Things/Building/Goauld/Shuttle')
          dirs={
            '':src['alkesh'],
            '_south':src['alkesh'],
            '_north':src['alkesh'].rotate(180,resample=Image.Resampling.BICUBIC,expand=False),
            '_east':src['alkesh'].rotate(90,resample=Image.Resampling.BICUBIC,expand=False),
            '_west':src['alkesh'].rotate(-90,resample=Image.Resampling.BICUBIC,expand=False),
          }
          for suf,im in dirs.items():
              p=root/f'WNG_AlkeshTransport{suf}.png'
              if not p.exists(): raise SystemExit(f'Missing {p}')
              fit(im,p,False)

          # RimWorld apparel overlays: preserve every existing body/direction alpha silhouette.
          families={
            'Textures/Things/Pawn/Humanlike/Apparel/Wraith/WNG_HunterCoat*.png':'queen',
            'Textures/Things/Pawn/Humanlike/Apparel/Wraith/WNG_QueenRaiment*.png':'queen',
            'Textures/Things/Pawn/Humanlike/Apparel/Wraith/WNG_WarriorCarapace*.png':'commander',
            'Textures/Things/Pawn/Humanlike/Apparel/Wraith/WNG_CommanderCarapace*.png':'commander',
            'Textures/Things/Pawn/Humanlike/Apparel/Precursor/WNG_HumanFormUniform*.png':'asuran_uniform',
            'Textures/Things/Pawn/Humanlike/Apparel/Precursor/WNG_HumanFormCombatArmor*.png':'asuran_armor',
          }
          total=5
          for pat,key in families.items():
              names=glob.glob(pat)
              if not names: raise SystemExit(f'No matches: {pat}')
              for name in names:
                  fit(src[key],name,True)
                  total += 1
          print('Updated',total,'production PNGs')
          PY

      - name: Commit only requested production art
        shell: bash
        run: |
          git config user.name "Vardath WNG Art"
          git config user.email "59270526+Vardath@users.noreply.github.com"
          git add Textures/Things/Building/Goauld/Shuttle/WNG_AlkeshTransport*.png
          git add Textures/Things/Pawn/Humanlike/Apparel/Wraith/WNG_HunterCoat*.png
          git add Textures/Things/Pawn/Humanlike/Apparel/Wraith/WNG_QueenRaiment*.png
          git add Textures/Things/Pawn/Humanlike/Apparel/Wraith/WNG_WarriorCarapace*.png
          git add Textures/Things/Pawn/Humanlike/Apparel/Wraith/WNG_CommanderCarapace*.png
          git add Textures/Things/Pawn/Humanlike/Apparel/Precursor/WNG_HumanFormUniform*.png
          git add Textures/Things/Pawn/Humanlike/Apparel/Precursor/WNG_HumanFormCombatArmor*.png
          if git diff --cached --quiet; then
            echo "No production art changes"
          else
            git commit -m "Professionalize Al'kesh, Wraith and Asuran apparel art [skip ci]"
            git push origin main
          fi
