name: WNG Step 5 Quality Candidates

on:
  push:
    branches: [step5-quality]
    paths:
      - '.github/workflows/wng-step5-quality-candidates.yml'
      - 'Tools/ApparelForge/source_art/generate_human_form_uniform_candidates.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: step5-quality
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image generation dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            pillow torch torchvision diffusers transformers accelerate safetensors rembg onnxruntime
      - name: Generate south master candidates
        env:
          HF_HUB_DISABLE_XET: "1"
        run: python Tools/ApparelForge/source_art/generate_human_form_uniform_candidates.py
      - name: Commit candidates to quality branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ArtSource/Apparel/human_form_uniform/candidates/south_*.png
          git diff --cached --quiet && exit 0
          git commit -m "Generate Step 5 south master candidates [skip ci]"
          git push origin HEAD:step5-quality
