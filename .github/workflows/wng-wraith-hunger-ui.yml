name: WNG strategic Wraith hunger UI validation

on:
  push:
    branches:
      - rebuild/wraith-hunger-request-ui-20260912

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild/wraith-hunger-request-ui-20260912
          fetch-depth: 0
      - name: Patch strategic hunger request flow
        run: python tools/wng_hunger_ui_patch.py
      - name: Build WNG
        run: dotnet build Source/WNG/WNG.csproj -c Release
      - name: Validate XML and request-flow invariants
        run: python tools/wng_hunger_ui_validate.py
      - name: Commit validated patch and remove temporary helpers
        run: |
          rm .github/workflows/wng-wraith-hunger-ui.yml
          rm tools/wng_hunger_ui_patch.py
          rm tools/wng_hunger_ui_validate.py
          git config user.name "Vardath"
          git config user.email "59270526+Vardath@users.noreply.github.com"
          git add Source/WNG/Wraith/WraithFactionHunger.cs .github/workflows/wng-wraith-hunger-ui.yml tools/wng_hunger_ui_patch.py tools/wng_hunger_ui_validate.py
          git commit -m "rebuild: complete paused strategic Wraith feeding request UI"
          git push origin HEAD:rebuild/wraith-hunger-request-ui-20260912
