name: Finalize Precursor apparel and shuttle art

on:
  push:
    paths:
      - '.github/workflows/finalize-precursor-apparel.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install pillow
      - name: Rebuild production art
        shell: bash
        run: |
          cat > /tmp/finalize.py <<'PY'
          from PIL import Image, ImageFilter, ImageChops, ImageDraw
          from pathlib import Path
          import shutil

          ROOT=Path('.')
          APP=ROOT/'Textures/Things/Pawn/Humanlike/Apparel/Precursor'
          WR=ROOT/'Textures/Things/Building/Wraith/Shuttle'
          UI=ROOT/'Textures/UI/WNG/Build'
          GOA=ROOT/'Textures/Things/Building/Goauld/Shuttle'

          def clamp(v): return max(0,min(255,int(v)))

          def recolor_source(src_path, dst_path, family):
              im=Image.open(src_path).convert('RGBA')
              px=im.load(); w,h=im.size
              out=Image.new('RGBA', im.size, (0,0,0,0)); op=out.load()
              cyan_mask=Image.new('L',im.size,0); cm=cyan_mask.load()
              for y in range(h):
                  for x in range(w):
                      r,g,b,a=px[x,y]
                      if a==0: continue
                      lum=(r*0.2126+g*0.7152+b*0.0722)
                      is_cyan=(b>120 and g>100 and b>r*1.15 and g>r*1.05) or (b>160 and g>140 and r<120)
                      if is_cyan:
                          cm[x,y]=a
                          k=max(0.45,min(1.15,lum/170))
                          nr,ng,nb=clamp(32*k),clamp(205*k+25),clamp(245*k+10)
                      elif lum>150:
                          scale=lum/255
                          if family=='uniform':
                              nr,ng,nb=clamp(242*scale+28),clamp(239*scale+28),clamp(225*scale+31)
                          else:
                              nr,ng,nb=clamp(235*scale+31),clamp(239*scale+31),clamp(238*scale+34)
                      elif lum>75:
                          scale=lum/160
                          nr,ng,nb=clamp(155*scale+30),clamp(162*scale+30),clamp(164*scale+34)
                      else:
                          scale=lum/90
                          nr,ng,nb=clamp(24+50*scale),clamp(30+54*scale),clamp(35+60*scale)
                      op[x,y]=(nr,ng,nb,a)

              dil=cyan_mask.filter(ImageFilter.MaxFilter(5 if family=='command' else 3))
              ring=ImageChops.subtract(dil, cyan_mask)
              rp=ring.load(); oa=out.load()
              for y in range(h):
                  for x in range(w):
                      ra=rp[x,y]
                      if ra<35 or oa[x,y][3]==0: continue
                      r,g,b,a=oa[x,y]
                      strength=min(0.78,ra/255*(0.72 if family=='command' else 0.45 if family=='field' else 0.28))
                      gr,gg,gb=(220,170,72) if family=='command' else (198,164,92)
                      oa[x,y]=(clamp(r*(1-strength)+gr*strength),clamp(g*(1-strength)+gg*strength),clamp(b*(1-strength)+gb*strength),a)

              alpha=im.getchannel('A')
              edge=alpha.filter(ImageFilter.FIND_EDGES).filter(ImageFilter.GaussianBlur(0.5))
              ep=edge.load(); oa=out.load()
              for y in range(h):
                  for x in range(w):
                      if oa[x,y][3]==0: continue
                      e=ep[x,y]/255
                      if e>0.10:
                          r,g,b,a=oa[x,y]
                          boost=20*e
                          oa[x,y]=(clamp(r+boost),clamp(g+boost),clamp(b+boost),a)

              name=dst_path.name.lower()
              if family=='command' and '_north' not in name:
                  bbox=alpha.getbbox()
                  if bbox:
                      x0,y0,x1,y1=bbox; cx=(x0+x1)//2; cy=y0+int((y1-y0)*0.38)
                      rr=max(2,int(min(x1-x0,y1-y0)*0.055))
                      d=ImageDraw.Draw(out,'RGBA')
                      d.polygon([(cx,cy-rr*2),(cx+rr*2,cy),(cx,cy+rr*2),(cx-rr*2,cy)],fill=(212,164,62,240),outline=(246,223,142,235))
                      d.polygon([(cx,cy-rr),(cx+rr,cy),(cx,cy+rr),(cx-rr,cy)],fill=(54,220,247,250))

              out.putalpha(alpha)
              out.save(dst_path,optimize=True)

          # The working HumanForm production art already follows RimWorld body/direction geometry.
          # Rebuild each Precursor family from those exact masks so inventory and worn art match.
          for target,source,family in [
              ('WNG_PrecursorUniform','WNG_HumanFormUniform','uniform'),
              ('WNG_PrecursorFieldArmor','WNG_HumanFormCombatArmor','field'),
              ('WNG_PrecursorCommandArmor','WNG_HumanFormCombatArmor','command'),
          ]:
              for sp in sorted(APP.glob(source+'*.png')):
                  suffix=sp.name[len(source):]
                  recolor_source(sp, APP/(target+suffix), family)

          # Correct the Al'kesh direction assignment: north and south were reversed.
          north=GOA/'WNG_AlkeshTransport_north.png'
          south=GOA/'WNG_AlkeshTransport_south.png'
          temp=GOA/'__alkesh_swap_tmp.png'
          shutil.copy2(north,temp); shutil.copy2(south,north); shutil.copy2(temp,south); temp.unlink()

          # The live Wraith shuttle production textures are the approved upgraded art.
          # Sync stale architect/UI tiles to those exact current production sprites.
          for stem in ['WNG_WraithDart','WNG_WraithStrikeCraft','WNG_WraithCruiser']:
              shutil.copy2(WR/(stem+'.png'), UI/(stem+'.png'))

          print('uniform',len(list(APP.glob('WNG_PrecursorUniform*.png'))))
          print('field',len(list(APP.glob('WNG_PrecursorFieldArmor*.png'))))
          print('command',len(list(APP.glob('WNG_PrecursorCommandArmor*.png'))))
          PY
          python /tmp/finalize.py

      - name: Commit
        shell: bash
        run: |
          git config user.name "Vardath WNG Art"
          git config user.email "59270526+Vardath@users.noreply.github.com"
          git add Textures/Things/Pawn/Humanlike/Apparel/Precursor/WNG_PrecursorUniform*.png
          git add Textures/Things/Pawn/Humanlike/Apparel/Precursor/WNG_PrecursorFieldArmor*.png
          git add Textures/Things/Pawn/Humanlike/Apparel/Precursor/WNG_PrecursorCommandArmor*.png
          git add Textures/Things/Building/Goauld/Shuttle/WNG_AlkeshTransport_north.png
          git add Textures/Things/Building/Goauld/Shuttle/WNG_AlkeshTransport_south.png
          git add Textures/UI/WNG/Build/WNG_WraithDart.png
          git add Textures/UI/WNG/Build/WNG_WraithStrikeCraft.png
          git add Textures/UI/WNG/Build/WNG_WraithCruiser.png
          git commit -m "Finalize Precursor apparel and shuttle art alignment"
          git push
