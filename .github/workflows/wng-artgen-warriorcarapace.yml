name: WNG ArtGen Warrior Carapace
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wng-artgen-warriorcarapace.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch vanilla PowerArmor contour
        run: git clone --depth 1 https://github.com/SamuelBucher/Madness-Pawns.git /tmp/madness
      - name: Fetch vanilla body references
        run: git clone --depth 1 https://github.com/DaLongZhuaZi/RWonVela.git /tmp/rwvela
      - name: Install ArtGen dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy scipy requests beautifulsoup4 cairosvg
      - name: Run Stargate-first Warrior Carapace ArtGen
        run: |
          python Tools/ArtGen/wng_apparel_generator.py wraith_warrior_carapace \
            --vanilla-dir "/tmp/madness/Raw sprites/apparel" \
            --body-dir "/tmp/rwvela/src/common/human/bodies" \
            --workdir .github/artgen/runtime-warrior \
            --preview .github/artgen/warriorcarapace_preview.png
      - name: Validate RimWorld apparel implementation
        run: python .github/artqa/apparel_art_audit.py
      - name: Commit Warrior Carapace result and QA evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Textures/Things/Pawn/Humanlike/Apparel/Wraith/WNG_WarriorCarapace*.png \
                  .github/artgen/warriorcarapace_preview.png \
                  .github/artgen/runtime-warrior/stargate_reference_report.json \
                  .github/artgen/runtime-warrior/synthesis_qa.json
          git commit -m "Generate Warrior Carapace with Stargate-first WNG ArtGen [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

