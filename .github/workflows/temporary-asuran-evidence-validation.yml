name: Temporary Asuran evidence validation

on:
  push:
    branches:
      - rebuild/asuran-evidence-analysis-20260912

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build WNG
        run: dotnet build Source/WNG/WNG.csproj -c Release
      - name: Parse Def and patch XML
        shell: pwsh
        run: |
          $files = @(Get-ChildItem Defs -Recurse -Filter *.xml) + @(Get-ChildItem Patches -Recurse -Filter *.xml)
          foreach ($file in $files) {
            [xml](Get-Content $file.FullName -Raw) | Out-Null
          }
          Write-Host "Parsed $($files.Count) XML files"
      - name: Check Asuran evidence bridge invariants
        shell: pwsh
        run: |
          $gene = Get-Content 'Defs/GeneDefs/Genes_AsuranEvidence.xml' -Raw
          $thing = Get-Content 'Defs/ThingDefs/Things_AsuranEvidence.xml' -Raw
          $xeno = Get-Content 'Defs/XenotypeDefs/Xenotypes_Asuran.xml' -Raw
          $research = Get-Content 'Defs/ResearchProjectDefs/Research_AsuranFabrication.xml' -Raw
          $source = Get-Content 'Source/WNG/Asuran/AsuranNaniteEvidence.cs' -Raw

          if (-not $gene.Contains('WNG_AsuranEvidenceTrace')) { throw 'Missing Asuran evidence trace gene' }
          if (-not $thing.Contains('<analysisID>160912003</analysisID>')) { throw 'Wrong/missing Asuran analysis ID' }
          if (-not $thing.Contains('<destroyedOnAnalyzed>false</destroyedOnAnalyzed>')) { throw 'Residue destruction behavior changed' }
          if (($xeno.Split('WNG_AsuranEvidenceTrace').Count - 1) -ne 2) { throw 'Evidence trace must be present in exactly two Asuran xenotype definitions' }
          if (-not $research.Contains('<analyzedThings><li>WNG_AsuranNaniteResidue</li></analyzedThings>')) { throw 'Research gate missing residue requirement' }
          if (-not $source.Contains('source.Faction?.def?.defName == "WNG_AsuranLattice"')) { throw 'Current hostile faction predicate missing' }
          if (-not $source.Contains('!infiltration.Revealed')) { throw 'Revealed infiltrator guard missing' }
          if (-not $source.Contains('infiltration.CovertPresence')) { throw 'Covert-presence guard missing' }
          if (-not $source.Contains('infiltration.TrueFaction?.def?.defName == "WNG_AsuranLattice"')) { throw 'Persisted hostile true-faction predicate missing' }

          $matches = @()
          foreach ($file in Get-ChildItem Defs -Recurse -Filter *.xml) {
            [xml]$doc = Get-Content $file.FullName -Raw
            foreach ($node in $doc.SelectNodes('//analysisID')) {
              if ($node.InnerText.Trim() -eq '160912003') { $matches += $file.FullName }
            }
          }
          if ($matches.Count -ne 1) { throw "analysisID 160912003 collision count: $($matches.Count)" }
          Write-Host 'Asuran evidence bridge invariants OK'
