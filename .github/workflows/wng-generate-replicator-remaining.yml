name: WNG Generate Remaining Replicator Art

on:
  push:
    branches: [main]
    paths:
      - ".github/artgen/generate_replicator_remaining.py"
      - ".github/workflows/wng-generate-replicator-remaining.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m pip install --disable-pip-version-check pillow
      - name: Generate remaining Replicator art families
        run: python .github/artgen/generate_replicator_remaining.py
      - name: Commit generated art
        shell: bash
        run: |
          git add Textures/Things/Building/Replicator/Containment/WNG_ReplicatorContainmentProjector*.png
          git add Textures/UI/WNG/Build/WNG_ReplicatorContainmentProjector.png
          git add Textures/Things/Building/Replicator/Ruins/*.png
          git add Textures/Things/Pawn/Replicator/Adaptation/*.png
          if git diff --cached --quiet; then
            echo "Remaining Replicator art already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Upgrade remaining Replicator art families"
          git push
