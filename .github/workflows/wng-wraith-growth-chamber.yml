name: WNG Wraith Growth Chamber validation

on:
  push:
    branches:
      - rebuild/wraith-growth-chamber-20260912

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild/wraith-growth-chamber-20260912
          fetch-depth: 0
      - name: Patch mature Hive population API
        run: python tools/wng_growth_patch.py
      - name: Build WNG
        run: dotnet build Source/WNG/WNG.csproj -c Release
      - name: Validate XML and invariants
        run: python tools/wng_growth_validate.py
      - name: Commit validated patch and remove temporary helpers
        run: |
          rm .github/workflows/wng-wraith-growth-chamber.yml
          rm tools/wng_growth_patch.py
          rm tools/wng_growth_validate.py
          git config user.name "Vardath"
          git config user.email "59270526+Vardath@users.noreply.github.com"
          git add Source/WNG/Wraith/WraithMatureHive.cs Defs/ThingDefs/Wraith_HiveHeart.xml .github/workflows/wng-wraith-growth-chamber.yml tools/wng_growth_patch.py tools/wng_growth_validate.py
          git commit -m "rebuild: bind Growth Chamber to Mature Hive demographic cap"
          git push origin HEAD:rebuild/wraith-growth-chamber-20260912
