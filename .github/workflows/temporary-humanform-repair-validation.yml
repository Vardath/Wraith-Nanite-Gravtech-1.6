name: Temporary human-form nanite repair validation

on:
  push:
    branches:
      - rebuild/humanform-repair-reconstruction-20260912

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build WNG
        run: dotnet build Source/WNG/WNG.csproj -c Release
      - name: Parse Def and patch XML
        shell: pwsh
        run: |
          $files = @(Get-ChildItem Defs -Recurse -Filter *.xml) + @(Get-ChildItem Patches -Recurse -Filter *.xml)
          foreach ($file in $files) { [xml](Get-Content $file.FullName -Raw) | Out-Null }
          Write-Host "Parsed $($files.Count) XML files"
      - name: Check canonical nanite repair contract
        shell: pwsh
        run: |
          [xml]$gene = Get-Content 'Defs/GeneDefs/Genes_AsuranFabrication.xml' -Raw
          $ext = $gene.Defs.GeneDef.modExtensions.li
          if ([int]$ext.healIntervalTicks -ne 450) { throw 'Normal injury repair is not 450 ticks' }
          if ([double]$ext.reserveFractionPerHealPulse -ne 0.015) { throw 'Normal injury repair is not fixed at 1.5 percent reserve per pulse' }
          if ([int]$ext.depletedHealIntervalTicks -ne 1800) { throw 'Emergency depleted repair is not 1800 ticks' }
          if ([int]$ext.missingPartIntervalTicks -ne 30000) { throw 'Normal missing-part reconstruction is not 30000 ticks' }
          if ([double]$ext.reserveFractionPerRestoredPart -ne 0.25) { throw 'Missing-part reconstruction is not 25 percent reserve per restored part' }
          if ([int]$ext.depletedMissingPartIntervalTicks -ne 90000) { throw 'Emergency missing-part reconstruction is not 90000 ticks' }

          $source = Get-Content 'Source/WNG/Asuran/AsuranNaniteFabrication.cs' -Raw
          if (-not $source.Contains('GetMissingPartsCommonAncestors()')) { throw 'Missing-part reconstruction does not use native missing-part ancestry' }
          if (-not $source.Contains('PartOrAnyAncestorHasDirectlyAddedParts')) { throw 'Reconstruction can overwrite installed artificial-part ancestry' }
          if (-not $source.Contains('pawn.health.RestorePart(part)')) { throw 'Reconstruction does not use native RestorePart' }
          if (-not $source.Contains('TrySpendFraction(pawn, reserveCost)')) { throw 'Fixed reserve transaction is missing from repair/reconstruction' }
          if (-not $source.Contains('nextMissingPartTick')) { throw 'Missing-part reconstruction timer is not save-persistent' }
          if (-not $source.Contains('Scribe_Values.Look(ref nextMissingPartTick')) { throw 'Missing-part timer is not serialized' }
          Write-Host 'Canonical human-form nanite repair/reconstruction contract OK'
