name: Temporary Asuran intrusion source patch

on:
  push:
    branches: [wng-temp-asuran-intrusion-candidate]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch sovereignty source
        run: python3 .github/scripts/temp_patch_asuran_intrusion.py
      - name: Commit source patch
        run: |
          if git diff --quiet; then
            echo "No source patch changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Source/WNG/Replicators/ReplicatorSovereignty.cs
          git commit -m "feat: preserve sovereignty through temporary Asuran intrusion"
          git push origin HEAD:wng-temp-asuran-intrusion-candidate
