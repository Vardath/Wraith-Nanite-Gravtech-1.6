name: WNG captured Queen sovereignty foundation

on:
  push:
    branches:
      - rebuild/captured-queen-sovereign-threats-20260911

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild/captured-queen-sovereign-threats-20260911
          fetch-depth: 0

      - name: Patch captured Queen sovereignty foundation
        run: python .github/scripts/wng-captured-queen-foundation.py

      - name: Build WNG
        run: dotnet build Source/WNG/WNG.csproj -c Release

      - name: Parse Def and Patch XML
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          files = list(Path('Defs').rglob('*.xml')) + list(Path('Patches').rglob('*.xml'))
          for p in files:
              ET.parse(p)
          print(f'Parsed {len(files)} XML files')
          PY

      - name: Verify captured Queen invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('Source/WNG/Replicators/ReplicatorSovereignty.cs').read_text(encoding='utf-8')
          a = Path('Source/WNG/Replicators/ReplicatorAssimilation.cs').read_text(encoding='utf-8')
          checks = [
              'IsExactQueenRetainedByAsuranLattice',
              'TryGetCapturedQueenAsuranFaction',
              'TryAssignCapturedQueen',
              'TryAcquireForCapturedQueen',
              'bool capturedQueenRemote',
              'KidnappedPawnsListForReading.Contains(queen)',
              'block.Faction != comp.ControlFaction',
          ]
          missing = [c for c in checks if c not in s]
          if missing:
              raise SystemExit('Missing captured Queen invariants: ' + ', '.join(missing))
          if 'CopyAuthorityFrom(parentPawn.TryGetComp<CompReplicatorSovereignty>())' not in a:
              raise SystemExit('Assimilation sovereignty inheritance missing')
          PY

      - name: Commit validated source and remove temporary helpers
        run: |
          rm .github/workflows/wng-captured-queen-foundation.yml
          rm .github/scripts/wng-captured-queen-foundation.py
          git config user.name "Vardath"
          git config user.email "59270526+Vardath@users.noreply.github.com"
          git add Source/WNG/Replicators/ReplicatorSovereignty.cs Source/WNG/Replicators/ReplicatorAssimilation.cs .github/workflows/wng-captured-queen-foundation.yml .github/scripts/wng-captured-queen-foundation.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "rebuild: add captured Queen remote sovereignty foundation"
          git push origin HEAD:rebuild/captured-queen-sovereign-threats-20260911
