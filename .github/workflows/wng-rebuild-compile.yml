name: WNG compile

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout rebuild
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Source/WNGR2/WNGR2.csproj

      - name: Compile RimWorld 1.6 assembly
        run: dotnet build Source/WNGR2/WNGR2.csproj -c Release --no-restore

      - name: Verify assembly output
        run: test -f Assemblies/WNGR2.dll
