name: WNG Hunter Coat Professional Replacement
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wng-hunter-coat-professional.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install renderer dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy scipy
      - name: Generate replacement Hunter Coat assets
        run: python .github/artgen/wraith_hunter_coat_professional.py
      - name: Validate apparel implementation
        run: python .github/artqa/apparel_art_audit.py
      - name: Commit exact Hunter Coat PNG family
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Textures/Things/Pawn/Humanlike/Apparel/Wraith/WNG_HunterCoat*.png
          git commit -m "Replace Hunter Coat art and tile professionally [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
