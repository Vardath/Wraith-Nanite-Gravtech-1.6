name: WNG Rebuild Validation

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit clean rebuild contract
        run: python Tools/rebuild_static_audit.py

  compile:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore portable RimWorld references
        run: dotnet restore Source/WraithNaniteGravtech/WraithNaniteGravtech.csproj
      - name: Compile WNG rebuild
        run: dotnet build Source/WraithNaniteGravtech/WraithNaniteGravtech.csproj -c Release --no-restore
      - name: Verify assembly exists
        shell: pwsh
        run: |
          if (-not (Test-Path Assemblies/WraithNaniteGravtech.dll)) {
            throw 'WraithNaniteGravtech.dll was not produced.'
          }
      - name: Upload compile-smoke assembly
        uses: actions/upload-artifact@v4
        with:
          name: wng-rebuild-compile-smoke
          path: Assemblies/WraithNaniteGravtech.dll
          if-no-files-found: error
