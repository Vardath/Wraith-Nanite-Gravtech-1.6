name: Temporary shuttle API probe
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore references
        run: dotnet restore Source/WNG/WNG.csproj
      - name: Locate RimWorld reference assembly
        run: |
          find "$HOME/.nuget/packages/krafs.rimworld.ref/1.6.4871" -type f | sort
          ASM=$(find "$HOME/.nuget/packages/krafs.rimworld.ref/1.6.4871" -type f -name 'Assembly-CSharp.dll' | head -n1)
          echo "ASM=$ASM" >> "$GITHUB_ENV"
      - name: Inspect shuttle and skyfaller symbols
        run: |
          echo "Assembly: $ASM"
          strings "$ASM" | grep -E 'SkyfallerMaker|Skyfaller|PassengerShuttle|CompShuttle|CompLaunchable|ShuttleIncoming|ShuttleLeaving' | sort -u | head -n 300
