name: Temporary shuttle API probe
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore references
        run: dotnet restore Source/WNG/WNG.csproj
      - name: Locate RimWorld reference assembly
        run: |
          ASM=$(find "$HOME/.nuget/packages/krafs.rimworld.ref/1.6.4871" -type f -name 'Assembly-CSharp.dll' | head -n1)
          echo "ASM=$ASM" >> "$GITHUB_ENV"
      - name: Install ILSpy command line
        run: dotnet tool install --global ilspycmd
      - name: Inspect shuttle and skyfaller APIs
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          for TYPE in Verse.Skyfaller Verse.SkyfallerMaker RimWorld.PassengerShuttleIncoming RimWorld.PassengerShuttleLeaving RimWorld.CompLaunchable RimWorld.CompShuttle; do
            echo "===== $TYPE ====="
            ilspycmd -t "$TYPE" "$ASM" | sed -n '1,260p'
          done
