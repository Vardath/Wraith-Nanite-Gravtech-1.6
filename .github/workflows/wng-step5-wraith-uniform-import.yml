name: WNG Step 5 Wraith Uniform Import

on:
  push:
    paths:
      - 'Tools/ApparelForge/wraith-uniform-runtime.zip'

permissions:
  contents: write

concurrency:
  group: wng-step5-wraith-uniform-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install finished Wraith Uniform art
        shell: bash
        run: |
          set -euo pipefail
          tmp=/tmp/wraith-uniform
          rm -rf "$tmp"
          mkdir -p "$tmp"
          unzip -q Tools/ApparelForge/wraith-uniform-runtime.zip -d "$tmp"
          dest="Textures/Things/Pawn/Humanlike/Apparel/Wraith"
          mkdir -p "$dest"
          install -m 0644 "$tmp"/WNG_WraithUniform*.png "$dest"/
          python - <<'PY'
          from pathlib import Path
          import struct
          root=Path("Textures/Things/Pawn/Humanlike/Apparel/Wraith")
          bodies=["Male","Female","Thin","Fat","Hulk"]
          dirs=["north","south","east","west"]
          expected=[root/"WNG_WraithUniform.png"]
          for b in bodies:
              expected.append(root/f"WNG_WraithUniform_{b}.png")
              expected.extend(root/f"WNG_WraithUniform_{b}_{d}.png" for d in dirs)
          assert len(expected)==26
          for p in expected:
              data=p.read_bytes()
              assert data[:8]==b"\x89PNG\r\n\x1a\n", p
              w,h=struct.unpack(">II",data[16:24])
              assert (w,h)==(192,192), (p,w,h)
          print("validated",len(expected),"Wraith Uniform textures")
          PY

      - name: Commit Step 5 directly to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Textures/Things/Pawn/Humanlike/Apparel/Wraith/WNG_WraithUniform*.png
          git rm -f Tools/ApparelForge/wraith-uniform-runtime.zip
          git rm -f .github/workflows/wng-step5-wraith-uniform-import.yml
          git commit -m "Finish Step 5 Wraith Uniform art and RimWorld fit [skip ci]"
          git push
