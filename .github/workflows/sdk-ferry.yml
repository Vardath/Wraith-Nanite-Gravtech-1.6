name: Temporary SDK Ferry

on:
  push:
    branches: [ci-sdk-ferry-20260905]

jobs:
  package-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Verify SDK
        run: dotnet --info
      - name: Package minimal portable SDK runtime
        run: |
          DOTNET_BIN="$(readlink -f "$(command -v dotnet)")"
          DOTNET_ROOT="$(dirname "$DOTNET_BIN")"
          SDK_VERSION="$(dotnet --version)"
          RUNTIME_VERSION="$(dotnet --list-runtimes | awk '/Microsoft.NETCore.App/{v=$2} END{print v}')"
          mkdir -p "$GITHUB_WORKSPACE/ferry/dotnet/sdk" "$GITHUB_WORKSPACE/ferry/dotnet/shared/Microsoft.NETCore.App" "$GITHUB_WORKSPACE/ferry/dotnet/host"
          cp "$DOTNET_ROOT/dotnet" "$GITHUB_WORKSPACE/ferry/dotnet/dotnet"
          cp -a "$DOTNET_ROOT/host/." "$GITHUB_WORKSPACE/ferry/dotnet/host/"
          cp -a "$DOTNET_ROOT/sdk/$SDK_VERSION" "$GITHUB_WORKSPACE/ferry/dotnet/sdk/"
          cp -a "$DOTNET_ROOT/shared/Microsoft.NETCore.App/$RUNTIME_VERSION" "$GITHUB_WORKSPACE/ferry/dotnet/shared/Microsoft.NETCore.App/"
          tar -czf "$GITHUB_WORKSPACE/dotnet-sdk-minimal.tar.gz" -C "$GITHUB_WORKSPACE/ferry" dotnet
          test -s "$GITHUB_WORKSPACE/dotnet-sdk-minimal.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: dotnet-sdk-minimal
          path: dotnet-sdk-minimal.tar.gz
          if-no-files-found: error
          retention-days: 1
