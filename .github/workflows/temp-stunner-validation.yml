name: Temporary Wraith stunner validation

on:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build WNG
        run: dotnet build Source/WNG/WNG.csproj -c Release
      - name: Parse XML
        run: |
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          files = list(pathlib.Path('Defs').rglob('*.xml')) + list(pathlib.Path('Patches').rglob('*.xml'))
          for p in files: ET.parse(p)
          print(f'Parsed {len(files)} XML files')
          PY
      - name: Stunner invariants
        run: |
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          root = ET.parse('Defs/ThingDefs/Weapons_Wraith.xml').getroot()
          defs = {x.findtext('defName'): x for x in root.findall('ThingDef')}
          weapon = defs['WNG_WraithStunStaff']
          projectile = defs['WNG_Projectile_WraithStun']
          assert weapon.attrib.get('ParentName') == 'BaseGun'
          assert weapon.findtext('./verbs/li/defaultProjectile') == 'WNG_Projectile_WraithStun'
          assert weapon.findtext('./weaponTags/li') == 'WNG_WraithStunner'
          assert projectile.findtext('thingClass') == 'WraithNaniteGravtech.Projectile_WraithStunner'
          assert projectile.findtext('./projectile/damageAmountBase') == '0'
          assert projectile.findtext('./modExtensions/li/stunTicks') == '1800'

          src = pathlib.Path('Source/WNG/Wraith/WraithStunWeapon.cs').read_text()
          assert 'class Projectile_WraithStunner : Projectile' in src
          assert '.StunFor(' in src
          assert 'TakeDamage' not in src.replace("never enters Bullet.TakeDamage", "")

          pawns = ET.parse('Defs/PawnKindDefs/PawnKinds_Wraith.xml').getroot()
          armed = {'WNG_WraithHunter','WNG_WraithWarrior','WNG_WraithCommander','WNG_WraithKeeper'}
          unarmed = {'WNG_WraithQueen','WNG_PlayerWraith'}
          by_name = {x.findtext('defName'): x for x in pawns.findall('PawnKindDef') if x.findtext('defName')}
          for name in armed:
              assert by_name[name].findtext('./weaponTags/li') == 'WNG_WraithStunner', name
              assert by_name[name].findtext('weaponMoney') == '700~1000', name
          for name in unarmed:
              assert by_name[name].find('weaponTags') is None, name
          print('Stunner invariants passed')
          PY
