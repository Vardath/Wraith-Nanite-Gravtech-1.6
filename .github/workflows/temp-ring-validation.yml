name: Temporary Goauld ring validation

on:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build WNG
        run: dotnet build Source/WNG/WNG.csproj -c Release
      - name: Parse XML
        run: |
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          files = list(pathlib.Path('Defs').rglob('*.xml')) + list(pathlib.Path('Patches').rglob('*.xml'))
          for p in files: ET.parse(p)
          print(f'Parsed {len(files)} XML files')
          PY
      - name: Ring invariants
        run: |
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          root = ET.parse('Defs/ThingDefs/Buildings_GoauldTransportRings.xml').getroot()
          ring = next(x for x in root.findall('ThingDef') if x.findtext('defName') == 'WNG_GoauldTransportRings')
          assert ring.findtext('designationCategory') == 'WNG'
          assert ring.findtext('researchPrerequisites/li') == 'WNG_GoauldRingTransport'
          classes = [x.attrib.get('Class') for x in ring.findall('./comps/li')]
          assert 'CompProperties_Transporter' in classes
          assert 'CompProperties_Power' in classes
          assert 'WraithNaniteGravtech.CompProperties_GoauldTransportRings' in classes
          ext = [x.attrib.get('Class') for x in ring.findall('./modExtensions/li')]
          assert 'WraithNaniteGravtech.WNGGoauldArchitectExtension' in ext
          src = pathlib.Path('Source/WNG/Goauld/GoauldTransportRings.cs').read_text()
          for needle in ('Find.Maps','FloatMenuOption','innerContainer.TryDrop','Notify_Teleported','destinationRoom','CancelLoad()'):
              assert needle in src, needle
          router = pathlib.Path('Source/WNG/Compatibility/WNGGoauldArchitectRouting.cs').read_text()
          assert 'ResolveOnacArchitectCategory' in router and 'WngCategoryDefName = "WNG"' in router
          print('Ring invariants passed')
          PY
