name: WNG Generate Goauld Power Coupler

on:
  push:
    branches: [main]
    paths:
      - ".github/artgen/generate_goauld_power_coupler.py"
      - ".github/workflows/wng-generate-goauld-power-coupler.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m pip install --disable-pip-version-check pillow
      - name: Render coupler
        run: python .github/artgen/generate_goauld_power_coupler.py
      - name: Validate PNG
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          p=Path("Textures/Things/Building/Goauld/Gravship/WNG_GoauldPowerCoupler.png")
          with Image.open(p) as im:
              im.load()
              assert im.size == (512,512), im.size
              assert im.mode == "RGBA", im.mode
              a=im.getchannel("A")
              bbox=a.getbbox()
              assert bbox is not None
              assert bbox[0] >= 18 and bbox[1] >= 18 and bbox[2] <= 494 and bbox[3] <= 494, bbox
              edges=[
                  a.crop((0,0,512,1)).getextrema()[1],
                  a.crop((0,511,512,512)).getextrema()[1],
                  a.crop((0,0,1,512)).getextrema()[1],
                  a.crop((511,0,512,512)).getextrema()[1],
              ]
              assert not any(edges), edges
          print("Goa'uld power coupler PNG validation passed")
          PY
      - name: Commit generated coupler
        shell: bash
        run: |
          git add Textures/Things/Building/Goauld/Gravship/WNG_GoauldPowerCoupler.png
          if git diff --cached --quiet; then
            echo "Coupler already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Replace Goa'uld power coupler art"
          git push
