name: WNG Generate Replicator Pawn Art

on:
  push:
    branches: [main]
    paths:
      - ".github/artgen/generate_replicator_drone.py"
      - ".github/artgen/generate_replicator_hunter.py"
      - ".github/artgen/generate_replicator_bulwark.py"
      - ".github/artgen/generate_replicator_titan.py"
      - ".github/artgen/generate_replicator_siege_mass.py"
      - ".github/artgen/generate_replicator_controller.py"
      - ".github/artgen/generate_replicator_repairer.py"
      - ".github/artgen/generate_replicator_burrower.py"
      - ".github/artgen/generate_replicator_artillery.py"
      - ".github/workflows/wng-generate-replicator-pawns.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m pip install --disable-pip-version-check pillow
      - name: Generate all differentiated Replicator pawn families
        run: |
          python .github/artgen/generate_replicator_drone.py
          python .github/artgen/generate_replicator_hunter.py
          python .github/artgen/generate_replicator_bulwark.py
          python .github/artgen/generate_replicator_titan.py
          python .github/artgen/generate_replicator_siege_mass.py
          python .github/artgen/generate_replicator_controller.py
          python .github/artgen/generate_replicator_repairer.py
          python .github/artgen/generate_replicator_burrower.py
          python .github/artgen/generate_replicator_artillery.py
      - name: Commit complete differentiated Replicator family
        shell: bash
        run: |
          git add Textures/Things/Pawn/Replicator/WNG_ReplicatorDrone*.png
          git add Textures/Things/Pawn/Replicator/WNG_ReplicatorHunter*.png
          git add Textures/Things/Pawn/Replicator/WNG_ReplicatorBulwark*.png
          git add Textures/Things/Pawn/Replicator/WNG_ReplicatorTitan*.png
          git add Textures/Things/Pawn/Replicator/WNG_ReplicatorSiegeMass*.png
          git add Textures/Things/Pawn/Replicator/WNG_ReplicatorController*.png
          git add Textures/Things/Pawn/Replicator/WNG_ReplicatorRepairer*.png
          git add Textures/Things/Pawn/Replicator/WNG_ReplicatorBurrower*.png
          git add Textures/Things/Pawn/Replicator/WNG_ReplicatorArtillery*.png
          if git diff --cached --quiet; then
            echo "Differentiated Replicator pawn art already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+Vardath@users.noreply.github.com"
          git commit -m "Rebuild complete differentiated Replicator pawn family"
          git push
