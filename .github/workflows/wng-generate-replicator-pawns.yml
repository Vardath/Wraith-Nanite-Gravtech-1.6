name: WNG Generate Replicator Pawn Art

on:
  push:
    branches: [main]
    paths:
      - ".github/artgen/generate_replicator_titan.py"
      - ".github/workflows/wng-generate-replicator-pawns.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m pip install --disable-pip-version-check pillow
      - name: Generate Replicator Titan only
        run: python .github/artgen/generate_replicator_titan.py
      - name: Commit Titan family only
        shell: bash
        run: |
          git add Textures/Things/Pawn/Replicator/WNG_ReplicatorTitan*.png
          if git diff --cached --quiet; then
            echo "Replicator Titan art already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+Vardath@users.noreply.github.com"
          git commit -m "Rebuild Replicator Titan art"
          git push
