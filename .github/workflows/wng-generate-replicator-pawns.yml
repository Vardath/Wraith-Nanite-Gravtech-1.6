name: WNG Generate Replicator Pawn Art

on:
  push:
    branches: [main]
    paths:
      - ".github/artgen/generate_replicator_pawns.py"
      - ".github/workflows/wng-generate-replicator-pawns.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m pip install --disable-pip-version-check pillow
      - name: Generate differentiated compound-form Replicator family
        run: python .github/artgen/generate_replicator_pawns.py
      - name: Commit complete Replicator pawn family
        shell: bash
        run: |
          git add Textures/Things/Pawn/Replicator/WNG_ReplicatorDrone*.png
          git add Textures/Things/Pawn/Replicator/WNG_ReplicatorHunter*.png
          git add Textures/Things/Pawn/Replicator/WNG_ReplicatorBulwark*.png
          git add Textures/Things/Pawn/Replicator/WNG_ReplicatorTitan*.png
          git add Textures/Things/Pawn/Replicator/WNG_ReplicatorSiegeMass*.png
          git add Textures/Things/Pawn/Replicator/WNG_ReplicatorController*.png
          git add Textures/Things/Pawn/Replicator/WNG_ReplicatorRepairer*.png
          git add Textures/Things/Pawn/Replicator/WNG_ReplicatorBurrower*.png
          git add Textures/Things/Pawn/Replicator/WNG_ReplicatorArtillery*.png
          if git diff --cached --quiet; then
            echo "Replicator compound-form art already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+Vardath@users.noreply.github.com"
          git commit -m "Install differentiated Replicator compound-form art"
          git push
