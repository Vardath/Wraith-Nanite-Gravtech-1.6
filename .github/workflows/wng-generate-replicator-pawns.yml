name: WNG Install Professional Replicator Art

on:
  push:
    branches: [main]
    paths:
      - ".github/artsrc/replicator_professional/**"
      - ".github/artgen/install_professional_replicator_sources.py"
      - ".github/workflows/wng-generate-replicator-pawns.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m pip install --disable-pip-version-check pillow
      - name: Install professional differentiated compound-form Replicators
        run: python .github/artgen/install_professional_replicator_sources.py
      - name: Commit professional Replicator sprite family
        shell: bash
        run: |
          git add Textures/Things/Pawn/Replicator/WNG_ReplicatorDrone*.png
          git add Textures/Things/Pawn/Replicator/WNG_ReplicatorHunter*.png
          git add Textures/Things/Pawn/Replicator/WNG_ReplicatorBulwark*.png
          git add Textures/Things/Pawn/Replicator/WNG_ReplicatorTitan*.png
          git add Textures/Things/Pawn/Replicator/WNG_ReplicatorSiegeMass*.png
          git add Textures/Things/Pawn/Replicator/WNG_ReplicatorController*.png
          git add Textures/Things/Pawn/Replicator/WNG_ReplicatorRepairer*.png
          git add Textures/Things/Pawn/Replicator/WNG_ReplicatorBurrower*.png
          git add Textures/Things/Pawn/Replicator/WNG_ReplicatorArtillery*.png

          if git diff --cached --quiet; then
            echo "Professional Replicator art is already installed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+Vardath@users.noreply.github.com"
          git commit -m "Install professional Replicator compound-form art"

          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin main; then
              exit 0
            fi
            echo "Push raced another main update; retrying ($attempt/5)..."
            sleep 2
          done

          echo "Unable to publish professional Replicator art after five retries."
          exit 1
