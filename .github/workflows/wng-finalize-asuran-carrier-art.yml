name: WNG Finalize Asuran Recovery Carrier Art

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m pip install --disable-pip-version-check pillow
      - name: Generate directional carrier art and build icon
        run: python .github/artgen/finalize_asuran_recovery_carrier.py
      - name: Commit generated carrier art
        shell: bash
        run: |
          git add Textures/Things/Building/Precursor/Shuttle/WNG_AsuranQueenRecoveryCarrier*.png
          git add Textures/UI/WNG/Build/WNG_AsuranQueenRecoveryCarrier.png
          if git diff --cached --quiet; then
            echo "Carrier art already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Finalize professional Asuran recovery carrier art"
          git push
