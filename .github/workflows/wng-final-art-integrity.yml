name: WNG Final Art Integrity

on:
  push:
    branches: [main]
    paths:
      - ".github/artqa/final_art_integrity.py"
      - ".github/workflows/wng-final-art-integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m pip install --disable-pip-version-check pillow
      - run: python .github/artqa/final_art_integrity.py
