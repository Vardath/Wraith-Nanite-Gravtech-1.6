name: Temporary gravship API probe
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore RimWorld reference
        run: dotnet restore Source/WNG/WNG.csproj
      - name: Decompile gravship API
        run: |
          ASM=$(find "$HOME/.nuget/packages/krafs.rimworld.ref/1.6.4871" -type f -name 'Assembly-CSharp.dll' | head -n1)
          dotnet tool install --global ilspycmd
          export PATH="$PATH:$HOME/.dotnet/tools"
          for T in RimWorld.Building_GravEngine RimWorld.CompGravshipFacility RimWorld.CompPilotConsole RimWorld.CompGravshipThruster RimWorld.CompSubstructureFootprint RimWorld.GravshipUtility RimWorld.Gravship; do
            echo "===== $T ====="
            ilspycmd -t "$T" "$ASM" || true
          done
