name: WNG Replicator Grav adaptation validation

on:
  push:
    branches:
      - rebuild/replicator-grav-adaptation-20260912

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild/replicator-grav-adaptation-20260912
          fetch-depth: 0

      - name: Add Def-tunable Grav values
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('Defs/ThingDefs/Races_Replicator.xml')
          s = p.read_text(encoding='utf-8')
          old = '<antiShieldDamageMultiplier>1.5</antiShieldDamageMultiplier><overlayScalePerBodySize>1.05</overlayScalePerBodySize>'
          new = '<antiShieldDamageMultiplier>1.5</antiShieldDamageMultiplier><gravRange>7</gravRange><gravMinDistance>3</gravMinDistance><gravCooldownTicks>360</gravCooldownTicks><gravLandingRadius>2</gravLandingRadius><overlayScalePerBodySize>1.05</overlayScalePerBodySize>'
          if new not in s:
              if old not in s:
                  raise SystemExit('Adaptation comp insertion point not found')
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Build WNG
        run: dotnet build Source/WNG/WNG.csproj -c Release

      - name: Parse Def and Patch XML
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          files = list(Path('Defs').rglob('*.xml')) + list(Path('Patches').rglob('*.xml'))
          for p in files:
              ET.parse(p)
          print(f'Parsed {len(files)} XML files')
          PY

      - name: Verify Grav invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('Source/WNG/Replicators/ReplicatorAdaptationEffects.cs').read_text(encoding='utf-8')
          x = Path('Defs/ThingDefs/Races_Replicator.xml').read_text(encoding='utf-8')
          required = [
              'JumpUtility.DoJump',
              'JumpUtility.ValidJumpTarget',
              'ReplicatorAdaptation.Grav',
              'ReplicatorEMP.IsSuppressed',
              'ReplicatorContainmentUtility.IsContained',
              'Command_Target',
              'TryAutonomousGravReposition',
              'Scribe_Values.Look(ref nextGravTick',
              'GenSight.LineOfSight',
          ]
          missing = [v for v in required if v not in s]
          if missing:
              raise SystemExit('Missing Grav source invariants: ' + ', '.join(missing))
          for v in ['<gravRange>7</gravRange>', '<gravMinDistance>3</gravMinDistance>', '<gravCooldownTicks>360</gravCooldownTicks>', '<gravLandingRadius>2</gravLandingRadius>']:
              if v not in x:
                  raise SystemExit('Missing Def tuning: ' + v)
          if '<MoveSpeed>' not in x:
              raise SystemExit('Unexpected race Def shape')
          if 'MoveSpeed' in s:
              raise SystemExit('Grav implementation must not be a generic MoveSpeed source effect')
          PY

      - name: Commit validated Def and remove validator
        run: |
          rm .github/workflows/wng-replicator-grav-adaptation.yml
          git config user.name "Vardath"
          git config user.email "59270526+Vardath@users.noreply.github.com"
          git add Defs/ThingDefs/Races_Replicator.xml .github/workflows/wng-replicator-grav-adaptation.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "rebuild: wire Def-tunable Replicator Grav maneuver"
          git push origin HEAD:rebuild/replicator-grav-adaptation-20260912
