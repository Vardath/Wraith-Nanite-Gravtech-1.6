name: WNG Step 12 Precursor Uniform Import

on:
  push:
    paths:
      - 'Tools/ApparelForge/wng-step12-precursor-uniform-runtime.zip'

permissions:
  contents: write

concurrency:
  group: wng-step12-precursor-uniform-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Step 12 Precursor Uniform
        shell: bash
        run: |
          set -euo pipefail
          tmp=/tmp/wng-step12
          rm -rf "$tmp"
          mkdir -p "$tmp"
          unzip -q Tools/ApparelForge/wng-step12-precursor-uniform-runtime.zip -d "$tmp"

          dest="Textures/Things/Pawn/Humanlike/Apparel/Precursor"
          mkdir -p "$dest"
          install -m 0644 "$tmp"/WNG_PrecursorUniform*.png "$dest"/

          srcdest="Tools/ApparelForge/source_art/final"
          mkdir -p "$srcdest"
          install -m 0644 "$tmp"/source/PrecursorUniform_Master.png "$srcdest"/
          install -m 0644 "$tmp"/source/PrecursorUniform_Master_Front.png "$srcdest"/
          install -m 0644 "$tmp"/source/PrecursorUniform_Master_Back.png "$srcdest"/
          install -m 0644 "$tmp"/source/PrecursorUniform_Master_Side.png "$srcdest"/

          python - <<'PY'
          from pathlib import Path
          import struct
          root=Path("Textures/Things/Pawn/Humanlike/Apparel/Precursor")
          bodies=["Male","Female","Thin","Fat","Hulk"]
          dirs=["north","south","east","west"]
          expected=[root/"WNG_PrecursorUniform.png"]
          for b in bodies:
              expected.append(root/f"WNG_PrecursorUniform_{b}.png")
              expected.extend(root/f"WNG_PrecursorUniform_{b}_{d}.png" for d in dirs)
          assert len(expected)==26
          for p in expected:
              assert p.exists(), p
              data=p.read_bytes()
              assert data[:8]==b"\x89PNG\r\n\x1a\n", p
              w,h=struct.unpack(">II",data[16:24])
              assert (w,h)==(192,192), (p,w,h)
          masters=[
              Path("Tools/ApparelForge/source_art/final/PrecursorUniform_Master.png"),
              Path("Tools/ApparelForge/source_art/final/PrecursorUniform_Master_Front.png"),
              Path("Tools/ApparelForge/source_art/final/PrecursorUniform_Master_Back.png"),
              Path("Tools/ApparelForge/source_art/final/PrecursorUniform_Master_Side.png"),
          ]
          for p in masters:
              assert p.exists(), p
          print("validated",len(expected),"Precursor Uniform textures and",len(masters),"master files")
          PY

          git add -f Textures/Things/Pawn/Humanlike/Apparel/Precursor/WNG_PrecursorUniform*.png
          git add -f Tools/ApparelForge/source_art/final/PrecursorUniform_Master*.png

      - name: Commit Step 12 to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f Tools/ApparelForge/wng-step12-precursor-uniform-runtime.zip
          git rm -f .github/workflows/wng-step12-precursor-uniform-import.yml
          git commit -m "Finish Step 12 Precursor Uniform art and RimWorld fit [skip ci]"
          git pull --rebase origin main
          git push origin main
