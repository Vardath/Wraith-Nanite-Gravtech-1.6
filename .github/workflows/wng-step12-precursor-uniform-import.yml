name: WNG Step 12 Precursor Uniform Import

on:
  push:
    paths:
      - 'Tools/ApparelForge/step12_payload/READY'

permissions:
  contents: write

concurrency:
  group: wng-step12-precursor-uniform-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and install finished Precursor Uniform art
        shell: bash
        run: |
          set -euo pipefail
          tmp=/tmp/wng-step12
          rm -rf "$tmp"
          mkdir -p "$tmp"
          cat Tools/ApparelForge/step12_payload/part*.txt | base64 -d > "$tmp/step12.zip"
          unzip -q "$tmp/step12.zip" -d "$tmp/unpacked"

          dest="Textures/Things/Pawn/Humanlike/Apparel/Precursor"
          srcdest="Tools/ApparelForge/source_art/final"
          mkdir -p "$dest" "$srcdest"

          install -m 0644 "$tmp/unpacked"/WNG_PrecursorUniform*.png "$dest"/
          install -m 0644 "$tmp/unpacked/source/PrecursorUniform_Master.png" "$srcdest/PrecursorUniform_Master.png"
          install -m 0644 "$tmp/unpacked/source/PrecursorUniform_Master_Front.png" "$srcdest/PrecursorUniform_Master_Front.png"
          install -m 0644 "$tmp/unpacked/source/PrecursorUniform_Master_Back.png" "$srcdest/PrecursorUniform_Master_Back.png"
          install -m 0644 "$tmp/unpacked/source/PrecursorUniform_Master_Side.png" "$srcdest/PrecursorUniform_Master_Side.png"

          python - <<'PY'
          from pathlib import Path
          import struct
          root=Path("Textures/Things/Pawn/Humanlike/Apparel/Precursor")
          bodies=["Male","Female","Thin","Fat","Hulk"]
          dirs=["north","south","east","west"]
          expected=[root/"WNG_PrecursorUniform.png"]
          for b in bodies:
              expected.append(root/f"WNG_PrecursorUniform_{b}.png")
              expected.extend(root/f"WNG_PrecursorUniform_{b}_{d}.png" for d in dirs)
          assert len(expected)==26
          for p in expected:
              assert p.exists(), p
              data=p.read_bytes()
              assert data[:8]==b"\x89PNG\r\n\x1a\n", p
              w,h=struct.unpack(">II",data[16:24])
              assert (w,h)==(192,192), (p,w,h)
          print("validated",len(expected),"Precursor Uniform textures")
          PY

          git add -f Textures/Things/Pawn/Humanlike/Apparel/Precursor/WNG_PrecursorUniform*.png
          git add -f Tools/ApparelForge/source_art/final/PrecursorUniform_Master*.png

      - name: Commit Step 12 directly to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -rf Tools/ApparelForge/step12_payload
          git rm -f .github/workflows/wng-step12-precursor-uniform-import.yml
          git commit -m "Finish Step 12 Precursor Uniform art and RimWorld fit [skip ci]"
          git pull --rebase origin main
          git push origin main
