name: WNG Validate Replicator Redo

on:
  push:
    branches: [main]
    paths:
      - 'Textures/Things/Pawn/Replicator/**'
      - '.github/artgen/install_replicator_redo.py'
      - '.github/workflows/wng-validate-replicator-redo.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python -m pip install --disable-pip-version-check pillow
      - name: Validate Replicator redo family
        run: python .github/artgen/install_replicator_redo.py
