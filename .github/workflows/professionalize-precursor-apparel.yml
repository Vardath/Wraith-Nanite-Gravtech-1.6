name: Professionalize Precursor apparel production art

on:
  push:
    paths:
      - '.github/workflows/professionalize-precursor-apparel.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install pillow
      - name: Rebuild Precursor apparel from working RimWorld geometry
        shell: bash
        run: |
          cat > /tmp/professionalize.py <<'PY'
          from PIL import Image, ImageFilter, ImageChops, ImageDraw
          from pathlib import Path

          APP=Path('Textures/Things/Pawn/Humanlike/Apparel/Precursor')

          def clamp(v): return max(0,min(255,int(v)))

          def recolor(src_path,dst_path,family):
              src=Image.open(src_path).convert('RGBA')
              w,h=src.size
              out=Image.new('RGBA',(w,h),(0,0,0,0))
              sp=src.load(); op=out.load()
              cyan=Image.new('L',(w,h),0); cp=cyan.load()

              for y in range(h):
                  for x in range(w):
                      r,g,b,a=sp[x,y]
                      if not a: continue
                      lum=.2126*r+.7152*g+.0722*b
                      is_c=(b>120 and g>100 and b>r*1.15 and g>r*1.05) or (b>170 and g>140 and r<130)
                      if is_c:
                          cp[x,y]=a
                          k=max(.55,min(1.2,lum/170))
                          rr,gg,bb=18*k,205*k+18,245*k+8
                      elif lum>155:
                          shade=(lum-155)/100
                          if family=='uniform':
                              rr,gg,bb=188+50*shade,192+47*shade,187+43*shade
                          else:
                              rr,gg,bb=180+56*shade,187+55*shade,194+53*shade
                      elif lum<85:
                          k=lum/85
                          rr,gg,bb=18+45*k,23+50*k,29+57*k
                      else:
                          k=(lum-85)/70
                          if family=='uniform':
                              rr,gg,bb=78+90*k,84+91*k,88+93*k
                          else:
                              rr,gg,bb=69+95*k,76+100*k,84+105*k
                      op[x,y]=(clamp(rr),clamp(gg),clamp(bb),a)

              alpha=src.getchannel('A')
              edge=ImageChops.subtract(alpha,alpha.filter(ImageFilter.MinFilter(5)))
              ep=edge.load()
              for y in range(h):
                  for x in range(w):
                      if not op[x,y][3]: continue
                      e=ep[x,y]/255
                      if e>0:
                          r,g,b,a=op[x,y]
                          fac=1-.34*e
                          op[x,y]=(clamp(r*fac),clamp(g*fac),clamp(b*fac),a)

              if family in ('uniform','command'):
                  c_dil=cyan.filter(ImageFilter.MaxFilter(5 if family=='command' else 3))
                  ring=ImageChops.subtract(c_dil,cyan)
                  gp=ring.point(lambda v:int(v*(.38 if family=='uniform' else .85))).load()
                  for y in range(h):
                      for x in range(w):
                          gma=gp[x,y]
                          if gma<20 or not op[x,y][3]: continue
                          r,g,b,a=op[x,y]
                          t=min(.72,gma/255)
                          op[x,y]=(clamp(r*(1-t)+214*t),clamp(g*(1-t)+168*t),clamp(b*(1-t)+74*t),a)

              name=dst_path.name.lower()
              if family=='command' and '_north' not in name:
                  bbox=alpha.getbbox()
                  if bbox:
                      x0,y0,x1,y1=bbox
                      cx=(x0+x1)//2
                      cy=y0+int((y1-y0)*.36)
                      rr=max(2,int(min(x1-x0,y1-y0)*.045))
                      d=ImageDraw.Draw(out,'RGBA')
                      d.polygon([(cx,cy-rr*2),(cx+rr*2,cy),(cx,cy+rr*2),(cx-rr*2,cy)],fill=(213,168,68,235),outline=(247,224,149,235))
                      d.polygon([(cx,cy-rr),(cx+rr,cy),(cx,cy+rr),(cx-rr,cy)],fill=(34,220,249,255),outline=(200,250,255,255))

              if '_north' in name:
                  bbox=alpha.getbbox()
                  if bbox:
                      x0,y0,x1,y1=bbox
                      cx=(x0+x1)//2
                      d=ImageDraw.Draw(out,'RGBA')
                      d.line([(cx,y0+int((y1-y0)*.25)),(cx,y0+int((y1-y0)*.72))],fill=(24,170,209,140),width=1)

              out.putalpha(alpha)
              out.save(dst_path,optimize=True)

          for target,source,family in [
              ('WNG_PrecursorUniform','WNG_HumanFormUniform','uniform'),
              ('WNG_PrecursorFieldArmor','WNG_HumanFormCombatArmor','field'),
              ('WNG_PrecursorCommandArmor','WNG_HumanFormCombatArmor','command'),
          ]:
              for src in sorted(APP.glob(source+'*.png')):
                  suffix=src.name[len(source):]
                  recolor(src,APP/(target+suffix),family)

          print('uniform',len(list(APP.glob('WNG_PrecursorUniform*.png'))))
          print('field',len(list(APP.glob('WNG_PrecursorFieldArmor*.png'))))
          print('command',len(list(APP.glob('WNG_PrecursorCommandArmor*.png'))))
          PY
          python /tmp/professionalize.py

      - name: Commit production art
        shell: bash
        run: |
          git config user.name "Vardath WNG Art"
          git config user.email "59270526+Vardath@users.noreply.github.com"
          git add Textures/Things/Pawn/Humanlike/Apparel/Precursor/WNG_PrecursorUniform*.png
          git add Textures/Things/Pawn/Humanlike/Apparel/Precursor/WNG_PrecursorFieldArmor*.png
          git add Textures/Things/Pawn/Humanlike/Apparel/Precursor/WNG_PrecursorCommandArmor*.png
          git commit -m "Professionalize Precursor apparel production art"
          git push
