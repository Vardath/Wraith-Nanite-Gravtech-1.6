name: WNG Generate Precursor Settlement Furniture

on:
  push:
    branches: [ main ]
    paths:
      - ".github/artgen/generate_precursor_settlement_furniture.py"
      - ".github/workflows/wng-generate-precursor-settlement-furniture.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Generate dedicated Precursor settlement furniture art
        run: python .github/artgen/generate_precursor_settlement_furniture.py
      - name: Commit generated art
        run: |
          if git diff --quiet -- Textures/Things/Building/Precursor/Furniture
          then
            echo "No generated furniture changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Textures/Things/Building/Precursor/Furniture
          git commit -m "Generate dedicated Precursor settlement furniture art"
          git push origin HEAD:main
