name: WNG Finalize Goauld Power Coupler

on:
  push:
    branches: [main]
    paths:
      - ".github/artgen/finalize_goauld_power_coupler.py"
      - ".github/workflows/wng-finalize-goauld-power-coupler.yml"
      - "Textures/Things/Building/Goauld/Gravship/WNG_GoauldPowerCoupler.png"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m pip install --disable-pip-version-check pillow
      - name: Finalize centred RGBA coupler art
        run: python .github/artgen/finalize_goauld_power_coupler.py
      - name: Commit finalized coupler
        shell: bash
        run: |
          git add Textures/Things/Building/Goauld/Gravship/WNG_GoauldPowerCoupler.png
          if git diff --cached --quiet; then
            echo "Power coupler already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Finalize Goa'uld power coupler art"
          git push
