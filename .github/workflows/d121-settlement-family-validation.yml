name: D121 Settlement Family Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  settlement-families:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Wraith and Precursor settlement families
        shell: python
        run: |
          from pathlib import Path
          import xml.etree.ElementTree as ET

          failures = []

          files = [
              "Defs/ThingDefs/Things_WraithPlayerInfrastructure.xml",
              "Defs/ThingDefs/Furniture_WraithLiving.xml",
              "Defs/ThingDefs/Things_WraithHiveEcology.xml",
              "Defs/ThingDefs/Things_WraithLivingTechnology.xml",
              "Defs/ThingDefs/Things_PrecursorStructures.xml",
              "Defs/ThingDefs/Furniture_Precursor.xml",
              "Defs/ThingDefs/Furniture_PrecursorLighting.xml",
              "Defs/ThingDefs/Things_SovereignLattice.xml",
              "Defs/ThingDefs/Things_PrecursorPowerCell.xml",
          ]

          defs = {}
          for file in files:
              path = Path(file)
              if not path.exists():
                  failures.append(f"missing family file: {file}")
                  continue
              root = ET.parse(path).getroot()
              for node in list(root):
                  name = node.findtext("defName")
                  if name:
                      defs[name] = (node, file)

          expected_wraith = [
              "WNG_WraithLivingWall",
              "WNG_WraithMembraneDoor",
              "WNG_WraithNutrientNiche",
              "WNG_BioelectricOrgan",
              "WNG_LivingPowerCell",
              "WNG_WraithRestCradle",
              "WNG_WraithRestNestDouble",
              "WNG_WraithGrowthSeat",
              "WNG_WraithLounge",
              "WNG_WraithFeastTableSmall",
              "WNG_WraithFeastTable",
              "WNG_WraithBedsideNode",
              "WNG_WraithLumenOrgan",
              "WNG_WraithWallLumen",
              "WNG_WraithHibernationPod",
              "WNG_WraithFeedingNiche",
              "WNG_LivingForge",
              "WNG_WraithGrowthChamber",
          ]

          expected_precursor = [
              "WNG_PrecursorWall",
              "WNG_PrecursorDoor",
              "WNG_PrecursorRestPlatform",
              "WNG_PrecursorRestPlatformDouble",
              "WNG_PrecursorFormChair",
              "WNG_PrecursorSettee",
              "WNG_PrecursorTableSmall",
              "WNG_PrecursorTable",
              "WNG_PrecursorBedsideConsole",
              "WNG_PrecursorStoragePlinth",
              "WNG_PrecursorLumen",
              "WNG_PrecursorWallLumen",
              "WNG_PrecursorFabricator",
              "WNG_PrecursorPowerCell",
          ]

          for name in expected_wraith + expected_precursor:
              if name not in defs:
                  failures.append(f"player settlement family member missing: {name}")

          def texture_exists(tex_path, graphic_class):
              base = Path("Textures") / tex_path
              if (base.with_suffix(".png")).exists():
                  return True
              if graphic_class == "Graphic_Multi":
                  return any(Path(str(base) + suffix + ".png").exists()
                             for suffix in ("_north", "_east", "_south", "_west"))
              return False

          for name in expected_wraith + expected_precursor:
              if name not in defs:
                  continue
              node, file = defs[name]
              tex = node.findtext("./graphicData/texPath")
              graphic = node.findtext("./graphicData/graphicClass")
              if tex and not texture_exists(tex, graphic):
                  failures.append(f"{name} references missing presentation art: {tex}")


          dedicated_precursor_art = {
              "WNG_PrecursorRestPlatform": ("Things/Building/Precursor/Furniture/WNG_PrecursorRestPlatform", "Graphic_Multi"),
              "WNG_PrecursorRestPlatformDouble": ("Things/Building/Precursor/Furniture/WNG_PrecursorRestPlatformDouble", "Graphic_Multi"),
              "WNG_PrecursorFormChair": ("Things/Building/Precursor/Furniture/WNG_PrecursorFormChair", "Graphic_Multi"),
              "WNG_PrecursorSettee": ("Things/Building/Precursor/Furniture/WNG_PrecursorSettee", "Graphic_Multi"),
              "WNG_PrecursorTableSmall": ("Things/Building/Precursor/Furniture/WNG_PrecursorTableSmall", "Graphic_Multi"),
              "WNG_PrecursorTable": ("Things/Building/Precursor/Furniture/WNG_PrecursorTable", "Graphic_Single"),
              "WNG_PrecursorBedsideConsole": ("Things/Building/Precursor/Furniture/WNG_PrecursorBedsideConsole", "Graphic_Multi"),
              "WNG_PrecursorStoragePlinth": ("Things/Building/Precursor/Furniture/WNG_PrecursorStoragePlinth", "Graphic_Multi"),
              "WNG_PrecursorLumen": ("Things/Building/Precursor/Furniture/WNG_PrecursorLumen", "Graphic_Multi"),
              "WNG_PrecursorWallLumen": ("Things/Building/Precursor/Furniture/WNG_PrecursorWallLumen", "Graphic_Multi"),
          }

          for name, (tex, graphic) in dedicated_precursor_art.items():
              node, _ = defs.get(name, (None, None))
              if node is None:
                  continue
              if node.findtext("./graphicData/texPath") != tex:
                  failures.append(f"{name} regressed to placeholder/non-dedicated settlement art")
              if node.findtext("./graphicData/graphicClass") != graphic:
                  failures.append(f"{name} unexpected graphic class: {node.findtext('./graphicData/graphicClass')}")
              base = Path("Textures") / (tex + ".png")
              if not base.exists():
                  failures.append(f"{name} base art missing: {base}")
              if graphic == "Graphic_Multi":
                  for suffix in ("_north", "_east", "_south", "_west"):
                      directional = Path("Textures") / (tex + suffix + ".png")
                      if not directional.exists():
                          failures.append(f"{name} directional art missing: {directional}")

          placeholder_tokens = (
              "Things/Building/Precursor/Collective/WNG_AsuranPatternArchive",
              "Things/Building/Precursor/Gravship/WNG_PrecursorPilotConsole",
              "Things/Building/Precursor/Gravship/WNG_AsuranSignalJammer",
          )
          for file in ("Defs/ThingDefs/Furniture_Precursor.xml", "Defs/ThingDefs/Furniture_PrecursorLighting.xml"):
              text = Path(file).read_text(encoding="utf-8")
              for token in placeholder_tokens:
                  if token in text:
                      failures.append(f"{file} still uses placeholder art: {token}")


          wraith_wall = defs.get("WNG_WraithLivingWall", (None,))[0]
          precursor_wall = defs.get("WNG_PrecursorWall", (None,))[0]
          precursor_door = defs.get("WNG_PrecursorDoor", (None,))[0]

          if wraith_wall is not None:
              if wraith_wall.findtext("./graphicData/texPath") != "Things/Building/Wraith/Gravship/WNG_OrganicHull_Atlas":
                  failures.append("Wraith living wall lost its vanilla-linked family wall atlas")
              if wraith_wall.findtext("./graphicData/graphicClass") != "Graphic_Single":
                  failures.append("Wraith living wall returned to a stuff-dependent or invalid graphic class")

          if precursor_wall is not None:
              if precursor_wall.findtext("./graphicData/texPath") != "Things/Building/Precursor/Gravship/WNG_PrecursorHull_Atlas":
                  failures.append("Precursor wall lost its vanilla-linked family wall atlas")
              if precursor_wall.findtext("./graphicData/graphicClass") != "Graphic_Single":
                  failures.append("Precursor wall lost its safe non-stuff graphic class")

          if precursor_door is not None:
              if precursor_door.findtext("./graphicData/texPath") != "Things/Building/Precursor/Structure/WNG_PrecursorDoor":
                  failures.append("Precursor settlement door regressed to the gravship asset path")

          if failures:
              print("SETTLEMENT FAMILY VALIDATION FAILURES:")
              for failure in failures:
                  print(" -", failure)
              raise SystemExit(1)

          print("Wraith and Precursor player settlement families validated.")
