name: Apply professional WNG apparel art

on:
  push:
    paths:
      - '.github/workflows/apply-professional-apparel.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install art dependencies
        run: python -m pip install pillow numpy
      - name: Generate production apparel PNGs
        env:
          WNG_APPAREL_ROOT: Textures/Things/Pawn/Humanlike/Apparel
        run: python .tmp/professional_apparel_art.py
      - name: Commit production art directly to main
        run: |
          git config user.name "Vardath WNG Art"
          git config user.email "59270526+Vardath@users.noreply.github.com"
          git add Textures/Things/Pawn/Humanlike/Apparel/Wraith/
          git add Textures/Things/Pawn/Humanlike/Apparel/Precursor/
          git commit -m "Rebuild professional Stargate/RimWorld apparel art"
          git push
